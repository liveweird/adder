apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: app
  name: app
  namespace: adder
spec:
  # OrbStack provisions local LoadBalancers; `kubectl -n adder port-forward svc/app` is
  # the fallback. Port 8087 (not 8080/8081/8082) so Adder's LB can coexist with other
  # local stacks.
  type: LoadBalancer
  ports:
    - name: "8087"
      port: 8087
      targetPort: 8087
  selector:
    io.kompose.service: app
