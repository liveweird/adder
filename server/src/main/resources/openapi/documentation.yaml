openapi: 3.1.0
info:
  title: adder-api
  version: 1.28.0
  description: |
    JWT-authenticated REST API for Adder — a team chat with workflow threads. It serves the Adder web app and is
    versioned by its `/api/v1` path prefix. This foundation exposes the accounts, teams, feature-flag and operational
    surface the chat features build on.

    Authorization model: every user is implicitly a regular user; additional global roles (`ADMIN`) are carried as
    the `roles` array and only ever ADD privileges on top of that baseline. Every operation requires a bearer
    access token except the eight that declare `security: []` (`/login`, `/login/mfa`, `/refresh`, `/password-reset`,
    `/password-reset/confirm`, the two probes and the live-update WebSocket, which authenticates in its first frame). Beyond that each operation states its own rule: user management (`/users`, apart from
    reading or changing one's own record where noted) and the writes on the team record are `ADMIN` only (a team's roster is edited by an ADMIN or the team's manager); reading teams, workflow templates and the tag registry is open to
    any authenticated user, and the writes on a workflow template and on the tag registry are `ADMIN` only; telemetry is `ADMIN` only. A caller without the right gets a uniform `403`, whether or not the
    addressed resource exists.

    Public and restricted visible rooms can be discovered by signed-in users. Hidden rooms and their content are available only to
    members, including administrators. Room content requires membership, with an `ADMIN` exception for public and restricted visible
    rooms. An inaccessible room returns the same `404` as a missing room. Owner-only actions check the caller's room role before
    reading any request body and recheck it under the room lock before writing.

    List operations page with `page` / `pageSize` / `sort` into an `{items, page, pageSize, total}` envelope.

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`). Any endpoint may additionally
    return `500` (`InternalServerError`) on an unexpected server fault.
servers:
  - url: http://localhost:8087
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: health
    description: Public liveness and readiness probes; they disclose nothing but a status.
  - name: auth
    description: Login (with the optional email second factor), token refresh, logout and the self-service password reset.
  - name: users
    description: Adder's own login accounts - ADMIN-managed CRUD, per-user feature flags, language and password change, plus the member-picker directory open to any signed-in user.
  - name: teams
    description: Flat teams, the ownership unit chat features scope to - readable by any authenticated user; the team record is written by ADMIN only, the roster by ADMIN or the team's manager.
  - name: workflows
    description: The ADMIN-curated workflow-template registry (statuses and fields a room copies at creation) - readable by any authenticated user, written by ADMIN only.
  - name: tags
    description: The ADMIN-curated tag registry (categories of tags, one global vocabulary for every room) - readable by any authenticated user, written by ADMIN only, the whole-category writes under `X-Expected-Revision`.
  - name: rooms
    description: Rooms with public, restricted visible, or restricted hidden access, each with its own workflow and membership roster.
  - name: home
    description: The signed-in caller's recent quotes, owned and watched threads, and owned rooms.
  - name: threads
    description: The room's threads - a per-room number, a title, a workflow status, an owner and typed field values - and their append-only history. Members-only like the room; a non-member gets the uniform `404`.
  - name: messages
    description: The messages of a thread - Markdown bodies, edited by their author and deleted by their author, a room owner or an ADMIN (a deleted message stays listed as a tombstone). Members-only like the room; a non-member gets the uniform `404`.
  - name: notifications
    description: The caller's own notices (a mention in a message, a thread handed over to them) and the writes that mark them seen. A notice holds ids only; names and titles are read when the list is read.
  - name: live
    description: Live updates - the single-use ticket a signed-in tab exchanges for its WebSocket, and the WebSocket itself. Hints carry ids only; every refetch goes through the ordinary REST reads.
  - name: telemetry
    description: Adder's own vital signs (process memory, JVM, storage, request latency) and their 24h/7d/90d trends - ADMIN only.

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      description: |
        Public and unauthenticated (the container HEALTHCHECK and the k8s liveness probe call it):
        `200` proves the process answers requests. It touches nothing — use `/api/v1/ready` for the
        database round trip.
      security: []
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/ready:
    get:
      tags: [health]
      operationId: ready
      summary: Readiness probe
      description: |
        Public and unauthenticated (the k8s readiness probe and the e2e global setup call it): `200`
        once a database round trip succeeds within a short budget, `503` while it does not — the pod
        leaves the Service until the database is back.
        Rate-limited per client IP and serving process (default 60/min, `READY_RATE_LIMIT_PER_MINUTE`; the kubelet needs
        12/min): over that replica-local bucket it answers `429`. Unlike every action/auth bucket, this health-probe allowance is not
        shared through the database. `/api/v1/health` is not bucketed.
      security: []
      responses:
        '200':
          description: The app and its database answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: The database did not answer within the probe's budget
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter (for an MFA-enabled account the accepted code does, see
        `POST /login/mfa`); wrong codes and wrong current passwords on a password change feed the
        same counter. A lock whose failure window held a wrong emailed code lasts longer each time it
        repeats (the n-th consecutive one lasts the window x 2^(n-1), up to
        `LOGIN_LOCKOUT_MFA_MAX_DURATION_SECONDS`, default 24 h; the level is forgotten after
        `LOGIN_LOCKOUT_MFA_DECAY_SECONDS` without a lock); a window of wrong passwords only stays the flat
        window. A confirmed password reset (`POST /password-reset/confirm`) lifts the lock and its level.
        The answer is the same `429` whatever the cause. The database-shared lockout store admits at most
        `LOGIN_LOCKOUT_MAX_TRACKED` ordinary, untrusted submitted identities (default 10,000 physical rows).
        At capacity a new identity submitted to this login endpoint receives `429` before password
        verification; existing tracked identities continue, and expired state frees capacity.
        Known-account MFA-code and authenticated password-change failures are still admitted above
        that configured cap: one reserved row is bound by foreign key to the proved user id and follows
        that account's current canonical email, so repeated email changes cannot add reservations.
        Refusing to count a credential guess already compared would weaken the lockout. State and
        capacity are shared across every application instance. Submitted identities are represented
        only by a deployment-keyed digest in this store; the stable binding stores a user id, never an address.

        **Email MFA (opt-in via the `MFA` feature flag):** when the account has MFA enabled,
        correct credentials answer `200` with an `MfaChallengeResponse` instead of tokens — a
        6-digit code is emailed to the account, and the client exchanges it together with the
        `challengeId` at `POST /api/v1/login/mfa` for the ordinary `LoginResponse`. On a
        deployment without outbound email (`MAIL_TRANSPORT=disabled`) an MFA-enabled login
        fails closed with `503`. Pending challenges are shared across application instances
        using the same database and data encryption keys. The shared store admits at most
        `MFA_MAX_TRACKED` challenges (default 10,000); new issuance at capacity receives
        `429` without sending a code, while existing challenges remain verifiable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued, or (MFA-enabled accounts) a second-factor challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: MFA is enabled for the account but this deployment cannot send email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/login/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Exchange an MFA challenge and emailed code for a JWT pair
      description: |
        Second login step for MFA-enabled accounts. The `challengeId` comes from the login
        response, the 6-digit `code` from the email. Submit them to any instance that
        shares the deployment database and data encryption keys. A challenge can succeed only
        once across all instances. It expires on the database clock after a short TTL (default
        5 min, `MFA_CODE_TTL_SECONDS`) and allows a few total attempts
        (default 5, `MFA_MAX_ATTEMPTS`); every failure mode — unknown challenge, expired,
        wrong code, attempts exhausted, user gone, password or email changed — answers the uniform `401`. Rate-limited
        per client IP.

        A wrong code for a current challenge counts toward the account's login lockout (the same
        counter `POST /login` feeds, `LOGIN_LOCKOUT_THRESHOLD`), so the wrong codes across ALL of an account's
        challenges add up and a fresh login never resets them (only an accepted code does). The failure that
        locks the account answers the uniform `401`; the account's pending challenges are dropped, and from
        then on `POST /login` answers `429` for the lockout window. A correct code for a locked account is
        refused with the lockout's `429`. Locks tripped by wrong codes double per consecutive lock, up to
        `LOGIN_LOCKOUT_MFA_MAX_DURATION_SECONDS` (default 24 h), and a confirmed password reset lifts the lock
        (see `POST /login`). An account holds at most 3 pending challenges: a further login
        replaces the oldest, whose code then fails as an unknown challenge.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal with refresh-token rotation. Accepts a valid, unexpired,
        non-revoked refresh token and returns a brand-new access token and refresh token (each with
        a full TTL). The presented refresh token is retired: it is blocklisted until its own expiry,
        so it works once. A replay of an already-rotated token is `401`, except that a replay within
        a short shared grace window after the rotation (60 seconds by default; it survives a node
        restart or retry on another node, covers a response lost in flight, allows at most two
        aggregate replay responses per token, and ends when a logout for its account reaches the
        server) is answered with another fresh pair.
        The superseded access token is not revoked and
        lives until its own expiry. Requires no `Authorization` header (the access token may
        already be expired). Returns `401` for a missing/invalid/expired/revoked/already-used
        refresh token, if the user no longer exists, or if the token's credential revision no
        longer matches the user's current credentials. Password changes invalidate earlier refresh
        tokens even within the same clock second. Legacy tokens without a credential revision
        require a fresh sign-in after upgrading to 0.14.1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body and verifies as a refresh token, it is revoked too. The access-token
        revocation, optional refresh-token revocation, and removal of either account's applicable
        refresh grace are atomic. The body is optional. A browser that opted in to
        Web Push may send its opaque subscription id in `X-Adder-Push-Subscription`; cleanup is
        best-effort and caller-scoped, and never changes the logout response.
      parameters:
        - name: X-Adder-Push-Subscription
          in: header
          required: false
          schema: { type: integer, format: int32, minimum: 1 }
          description: This browser's server subscription id, detached on logout when it belongs to the caller.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: |
        Normally answers `202` for a well-formed request, whether or not an account with that
        email exists (no account enumeration; the actual work happens asynchronously). If the
        account exists, a single-use reset link is emailed to its stored address. Requesting or
        opening a link never changes the password or any session: nothing changes until the owner
        confirms the link and chooses a new password (`POST /api/v1/password-reset/confirm`).
        Links expire after 15 minutes by default (`PASSWORD_RESET_TOKEN_TTL_SECONDS`, 1 to 3600
        seconds). Only a SHA-256 digest of the 256-bit random token is persisted, and the browser
        receives the token in a URL fragment, never in a server-visible path or query string.
        Throttled per submitted email — one request per interval
        (default 60 s, `PASSWORD_RESET_MIN_INTERVAL_SECONDS`) — uniformly for existing and
        unknown addresses, and rate-limited per client IP. The database-shared cooldown store admits
        at most `PASSWORD_RESET_MAX_TRACKED` identities (default 10,000). At capacity a new
        identity receives `429` and no reset email is scheduled; elapsed cooldowns free space.
        The limit and interval apply across every application instance, and the submitted
        identity is represented only by a separate deployment-keyed digest in this store.
        A soft-deleted account is unknown here (no link is minted or emailed, and the response
        follows the same acceptance and throttling rules). Answers `503` on deployments without
        outbound email (`MAIL_TRANSPORT=disabled`) or without a configured `MAIL_APP_URL` (the
        deployment's https origin, validated at startup, never derived from the `Host` header).
        Several requested links may coexist; completing one invalidates all of them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email, or has no `MAIL_APP_URL` (password reset unavailable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Choose a new password using a single-use reset link
      description: |
        Public credential exchange: the reset token authorizes only this operation, never
        bearer-authenticated API calls. Send it in the JSON body, not the URL. A valid token is
        checked before the password is validated. Expired, used, malformed and unknown tokens,
        deleted accounts, and tokens predating a password or email change all answer one uniform
        `401`. Consumption of the token, the password replacement and the credential-generation
        advance commit atomically; concurrent confirmations cannot both succeed, including with
        different links for one account. A password the rules refuse (`400`) does not consume the
        token. Success invalidates every access and refresh session of the account and any pending
        MFA challenge. It also lifts the account's sign-in lockout (a held failure counter or lock of
        any cause) and its escalation level, since the link proves the mailbox that receives the
        sign-in codes. There is no automatic sign-in: sign in normally, with the MFA code if it is
        enabled. A best-effort confirmation email contains neither password nor token; a delivery
        failure does not undo the reset. Rate-limited to 10 requests per minute per client IP. A
        lost success response can make a retry answer `401`: try signing in with the chosen
        password, or request another link. A link issued earlier still works if outbound mail is
        later disabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Password replaced and existing sessions revoked; sign in again
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (management view)
      description: |
        ADMIN only — the whole management surface is admin-gated; regular users keep only
        their self password change.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email` (deliberately not `roles` — a set has no
          order). Default sort is `id` ascending; `id` ascending is always appended as a
          deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `name` / `email` — case- and accent-insensitive substring matches.
          - `role` — `ADMIN` (holders of the additional role) or `USER` (plain users).
          - `feature` + `featureEnabled` — feature-flag state (the pair must come
            together, `400` otherwise; `featureEnabled` is a strict boolean).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 50 }
          description: Trimmed first; at most 50 characters (code points) after trimming, `400` past that.
        - name: email
          in: query
          required: false
          schema: { type: string, maxLength: 254 }
          description: Trimmed first; at most 254 characters (code points) after trimming, `400` past that.
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, USER] }
        - name: feature
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Feature' }
          description: Feature-flag state filter — must be paired with `featureEnabled` (400 otherwise).
        - name: featureEnabled
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean — only users with `feature` enabled (true) or disabled (false).
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        ADMIN only. The initial password is CLIENT-generated (the SPA's 96-bit generator) and
        shown to the admin exactly once — the server stores only the bcrypt hash and no
        response ever carries plaintext. The email is canonicalized (trimmed + lowercased);
        a duplicate among active accounts is a `409` (a soft-deleted account frees its email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error (blank/too-long name or email, password rules)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/directory:
    get:
      tags: [users]
      operationId: searchUserDirectory
      summary: Look up active users (member picker)
      description: |
        ANY signed-in user — deliberately not the ADMIN-only management list (`GET /users`, which stays
        unchanged). A room owner is any user and needs somebody to add, so this returns the minimum
        a picker needs: `{id, name, email}` of ACTIVE users (soft-deleted accounts are absent). Roles,
        feature flags and language are never exposed; the email tells namesakes apart.

        It is the broadest read of accounts open to a regular user (a team roster and a room's member
        list show name and email too, `security.md` "What the user directory discloses"). The bounds slow and
        audit a bulk harvest; they do not prevent one by a signed-in insider (the disclosure is accepted):
        `q` is REQUIRED and needs at least 2 characters, a page holds at most 20 rows, and the
        endpoint rides a per-USER rate bucket of 120 per minute (`429` beyond it).

        Supports offset pagination, sorting and one free-text filter.

        - `q` — case- and accent-insensitive substring match on name OR email. It is trimmed
          before the limits apply; 2 to 100 characters (code points) after trimming, `400` otherwise
          (a missing or blank `q` included).
        - `pageSize` — 1 to 20 (default 20), `400` beyond.
        - Sortable fields: `name` (default) and `id`; `id` ascending is always appended as a
          deterministic tiebreaker.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/DirectoryPageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: A page of active users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDirectoryPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/directory/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUserDirectoryEntry
      summary: Look up one active user (profile)
      description: |
        ANY signed-in user, no guard: the directory entry `{id, name, email}` of ONE active user - the header of the profile page
        (`/people/:id`). The same three-field projection as the directory list (`UserDirectoryEntry`), so it adds nothing the list does
        not already show: roles, feature flags, language, MFA state and sign-in times are never exposed (`GET /users/{id}` stays
        self-or-ADMIN). An unknown id and a soft-deleted account are the SAME `404`, so the answer reveals no more than the list does.
        It rides the per-USER directory bucket (the list's own, 120 a minute shared by both; `429` beyond it).
      responses:
        '200':
          description: The active user's directory entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDirectoryEntry'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user
      description: Target user or ADMIN (guard-before-read — an unauthorized caller 403s uniformly).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: updateUser
      summary: Update a user's name, email, and roles
      description: |
        ADMIN only. The password is deliberately not writable here (it has its own endpoint).
        Demoting the LAST active administrator is a `409` — the management surface must stay
        reachable. An email already used by another active account is also a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        ADMIN only, soft delete: the account can no longer sign in, outstanding refresh
        tokens die (`user_gone`), the email is freed for reuse, and the user's catalog files
        stay with a deleted-creator marker. Deleting YOURSELF is a `403`; deleting the LAST
        active administrator is a `409`.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN, or attempted to delete their own account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/features:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserDisabledFeatures
      summary: Replace a user's disabled-feature set (ADMIN only)
      description: |
        Per-user feature flags: a **wholesale replace** of the target user's DISABLED set —
        an empty array re-enables everything (idempotent, a same-set re-PUT is `204` again).
        **ADMIN-only**; changing one's OWN flags is allowed (the users routes themselves are
        never feature-gated, so an admin can always find their way back). `MFA` is the one
        inverted-default flag: users start with it in the disabled set, and a set omitting it
        — the empty "re-enable everything" array included — ENABLES the login second factor.
        The set rides the JWT, so a change takes effect at the target's next token refresh
        (≤15 min) or login. Audited as `user.features_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeaturesUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Disabled-feature set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/language:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserLanguage
      summary: Set a user's language (target user or ADMIN)
      description: |
        The ONE synced per-user language: it drives the UI at sign-in (rides `LoginResponse`,
        applied by the SPA on login/MFA/refresh) and the language of every email sent to the
        user (read fresh at send time, so a change takes effect immediately for emails; the
        UI picks it up at the next sign-in or token refresh). **Target user or ADMIN** — the
        header language switcher is the self-service writer (switching while signed in also
        saves here); an admin may fix a mis-set language. Idempotent (a same-value re-PUT is
        `204` again); an unsupported code is `400`. Audited as `user.language_changed` on an
        actual change. Set initially at create (`UserCreateRequest.language`, default `en`);
        the whole-user PUT deliberately never touches it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLanguageUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Language set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        and pending MFA challenges, including changes within the same clock second
        (already-issued access tokens expire naturally within their TTL).

        Rides a per-USER rate bucket of 5 per minute (`429` beyond it; the bucket is spent before the
        guards run). A wrong `currentPassword` on a self change also counts as a failed sign-in
        attempt toward the account's login lockout (the same counter `POST /login` and `POST /login/mfa`
        feed, `LOGIN_LOCKOUT_THRESHOLD`): once the account is locked, a self change is refused with the
        lockout's `429` - even with the correct current password, and before it is checked - exactly as
        `POST /login` is, until the lockout window ends. A missing `currentPassword` is a `403` that does
        not count. An admin resetting ANOTHER user's password verifies nothing, so it neither counts nor
        is refused by the target's lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters or longer than 71 UTF-8 bytes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List teams
      description: |
        Any authenticated user — teams are the shared ownership unit chat features scope to;
        every mutation is ADMIN only.

        - Sortable fields: `id`, `name`, `handle`, `createdAt`, `updatedAt`. Default `id` ascending. A team without a handle sorts last
          ascending (and first descending).
        - Filters: `name` and `handle` (each a case- and accent-insensitive substring; a team without a handle never matches `handle`).
        - The `handle` filter is the substring search of the composer's team-mention picker (1.1.0 S7), its UI consumer: the optional `q` free-text
          rule of API-LIST-005 (a per-column substring only where a UI needs it) is met by that picker.
        - `memberId` (1.2): only the teams whose roster holds that ACTIVE user (the profile page's teams). An unknown or removed user matches
          nothing (an empty page); anything but 1 to 2147483647 in ASCII digits (a sign, a fraction, `0`, a blank `memberId=`), or a repeated key, is a `400`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: Trimmed first; at most 100 characters (code points) after trimming, `400` past that.
        - name: handle
          in: query
          required: false
          schema: { type: string, maxLength: 30 }
          description: Trimmed first; at most 30 characters (code points) after trimming, `400` past that.
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: A page of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      description: |
        ADMIN only (guarded before the body decodes — a non-admin's malformed body is still
        403). A case-insensitive name clash with an active team is `409`. An optional manager (a
        user; being a manager grants no write rights on the team yet) must be an active
        user (`400` otherwise). An optional mention `handle` (2 to 30 characters, lowercase letters, digits and
        single hyphens, starting with a letter; uppercase is a `400`, never folded; `everyone`, `watchers`,
        `observers`, `here`, `all`, `channel`, `room` and `team` are reserved, `400`) must be unique among active
        teams (`409`, `keys: ["handle"]`; a name clash is `keys: ["name"]`); omitted = none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new team
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: Get a team
      description: Any authenticated user.
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [teams]
      operationId: updateTeam
      summary: Rename / re-describe a team, set its manager
      description: "ADMIN only, guard before the id lookup (uniform 403). A full replace: an omitted `managerId` clears the manager; a set one must be an active user (`400` otherwise). An omitted `handle` clears it too (a full replace: a client that renames a team without sending its handle drops it). A set `handle` follows the create rules (2 to 30 characters, lowercase letters, digits and single hyphens, starting with a letter; uppercase is a `400`, never folded; `everyone`, `watchers`, `observers`, `here`, `all`, `channel`, `room` and `team` are reserved, `400`) and must be unique among active teams (`409`, `keys: [\"handle\"]`). A case-insensitive name clash with another active team is `409` (`keys: [\"name\"]`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: Delete a team (soft)
      description: ADMIN only, guard before the id lookup. Soft delete — the name and the mention handle are freed for reuse.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/UserIdPath'
    put:
      tags: [teams]
      operationId: addTeamMember
      summary: Add a user to a team's roster
      description: |
        ADMIN or the team's ACTIVE manager (guarded first, before any read: every other caller gets a uniform `403` whether
        or not the team exists; a non-admin's grant is re-checked under the team row lock). Idempotent: `204` for an
        added OR an already-present member, and only an actual add is audited (`team.member_added`). No request body.
        An unknown or soft-deleted team (ADMIN caller) or user is `404`; a roster that already holds 200 active members is `409`.
      responses:
        '204':
          description: The user is on the roster (added now or already present)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: removeTeamMember
      summary: Remove a user from a team's roster
      description: |
        ADMIN or the team's ACTIVE manager, guarded exactly like the add (uniform `403`, re-checked under the team row lock).
        `404` for an unknown team (ADMIN caller) or a user who is not on the roster. Audited `team.member_removed`.
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/workflow-templates:
    get:
      tags: [workflows]
      operationId: listWorkflowTemplates
      summary: List workflow templates
      description: |
        Any authenticated user - a room copies a template's statuses and fields when it is created. Active templates only.

        - Sortable fields: `id`, `name`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring, at most 100 characters - `400` beyond).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: Trimmed first; at most 100 characters (code points) after trimming, `400` past that.
      responses:
        '200':
          description: A page of workflow templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplatePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [workflows]
      operationId: createWorkflowTemplate
      summary: Create a workflow template
      description: |
        ADMIN only (guarded before the body decodes - a non-admin's malformed body is still `403`). The new template starts at
        `revision` 1. A case-insensitive name clash with an active template is `409`; a deleted template frees its name. The
        document must satisfy the workflow rules: 2-20 statuses (unique slug keys, exactly one initial and it is `OPEN`, at
        least one `CLOSED`), 0-20 fields (unique slug keys), options only on the select kinds (1-50, unique slugs), every
        status, field and option label a language map with an `en` value of 1-60 characters (`400` otherwise), unique per language
        (case-insensitive, after trimming) among the statuses, among the fields and among one field's options.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTemplateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new template
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/workflow-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [workflows]
      operationId: getWorkflowTemplate
      summary: Get a workflow template
      description: Any authenticated user. The `revision` is what a later PUT names in `X-Expected-Revision`.
      responses:
        '200':
          description: The template with its statuses and fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [workflows]
      operationId: updateWorkflowTemplate
      summary: Replace a workflow template
      description: |
        ADMIN only. A whole-document replace under optimistic concurrency, checked in this order: the guard (uniform `403`,
        whether or not the id exists and whatever the body), the `X-Expected-Revision` header (missing, repeated or malformed is
        `400`), the body (`400`, the rules of the create), then under the row lock the id (`404`) and the revision. A stale
        revision is `409` of type `urn:adder:problem:revision-conflict`; a case-insensitive name clash with another active
        template is a plain `409`. Every successful PUT stores `revision + 1`; read the template again for it. A template edit
        never touches a room that copied it.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTemplateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [workflows]
      operationId: deleteWorkflowTemplate
      summary: Delete a workflow template (soft)
      description: ADMIN only, guard before the id lookup. Soft delete - the name is freed for reuse; rooms that copied the template are untouched.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/tag-categories:
    get:
      tags: [tags]
      operationId: listTagCategories
      summary: The tag registry
      description: |
        Any authenticated user (the tag picker and the Tags page). A page of the active categories, each with its live tags
        alphabetical (by code point). The registry holds at most 100 categories of at most 100 tags, so the SPA reads it whole with
        `pageSize=100`.

        - Sortable fields: `id`, `name` (lower-cased, by code point, so `alpha` comes before `Bravo`). Default `name` ascending; the
          `id` tiebreaker is appended.
        - No filters.
        - `total` counts the active categories, before paging.

        A page is about half a megabyte at most (100 categories x 100 names of up to 40 characters), so the read rides the per-USER
        `chat-read` bucket of 300 per minute shared with the thread list and the tag list of a room (`429` beyond it; spent before any
        check).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCategoryPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [tags]
      operationId: createTagCategory
      summary: Create a tag category
      description: |
        `ADMIN` only (guarded before the body decodes - a non-admin's malformed body is still `403`). A name (1-60 characters, single line,
        unique among active categories case-insensitively: a clash is `409`), an optional description (at most 500) and 1-100 tags. A tag
        name is trimmed, whitespace runs are collapsed and it is lower-cased; 1-40 characters of letters and digits with spaces and
        `. _ / + # : -` inside; each once (`400` otherwise). A tag lives in exactly ONE category: one a live category already holds is
        `409` naming its owner; one retired earlier is revived into this category (the same tag row, so the threads that kept it show it
        live again). At most 100 categories (`400`). The new category starts at `revision` 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCategoryRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new category
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCategory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/tag-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [tags]
      operationId: updateTagCategory
      summary: Replace a tag category
      description: |
        `ADMIN` only. A full replace of the name, description and tag list under optimistic concurrency, checked in this order: the guard
        (uniform `403`, whether or not the id exists and whatever the body), the `X-Expected-Revision` header (missing, repeated or
        malformed is `400`), the body (`400`, the rules of the create), then under the registry lock the id (`404`, even when the payload
        claims a tag another category holds) and the revision (a stale one is `409` of type `urn:adder:problem:revision-conflict`, so two
        admins never silently overwrite each other's tag list), then the claims. Every successful PUT stores `revision + 1`; read the
        registry again for it. A tag dropped from the list is RETIRED, not erased (a thread that carries it keeps showing it as retired,
        and a write that still carries it is `400`); moving a tag to another category is two saves (drop it from the first, then add it
        to the second); a case-insensitive name clash with another active category is a plain `409`, and so is a tag a live category holds.
        A write waits at most about 3 seconds for the registry's table lock, then answers `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1` (nothing was written).
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCategoryRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [tags]
      operationId: deleteTagCategory
      summary: Delete a tag category (soft)
      description: |
        `ADMIN` only, guard before the header and the id lookup. Soft delete under `X-Expected-Revision` (REQUIRED; a stale one is `409` of
        type `urn:adder:problem:revision-conflict`: the admin confirmed deleting a tag list that has changed since): the name is freed for
        reuse and the category's tags are retired (a thread that carries one keeps showing it as retired until a tag write drops it).
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List rooms
      description: |
        Lists public rooms, restricted visible rooms, and restricted hidden rooms the caller belongs to. Deleted rooms never appear.

        - Sortable fields: `id`, `name`, `lastActivityAt`, `createdAt`, `personalOrder`. Default `id` ascending.
        - `personalOrder` requires `member=true` and no `memberId`. It orders joined rooms by the caller's saved groups and room order before
          pagination. Rooms without a saved position follow them, in descending activity order and then ascending ID.
        - Filters: `name` (case- and accent-insensitive substring, at most 80 characters - `400` beyond); `archived` (strict `true` or
          `false`; omitted = both); `member` (strict `true` or `false`: `true` = only rooms the caller is a member of - the rooms rail
          always sends it; `false` = discoverable rooms the caller has not joined; omitted = both). A repeated key is a `400`.
        - `memberId` (1.2): only the rooms that ACTIVE user is a member of, ANDed with everything above - a member sees the rooms they
          SHARE with that user, with an `ADMIN` exception for public and restricted visible rooms. An unknown or removed user matches
          nothing (an empty page); anything but 1 to 2147483647 in ASCII digits (a sign, a fraction, `0`, a blank `memberId=`), or a repeated key, is a `400`.
        - Each row's `role` is the caller's role in that room, or `null` before they join.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
          description: Trimmed first; at most 80 characters (code points) after trimming, `400` past that.
        - name: archived
          in: query
          required: false
          schema: { type: boolean }
        - name: member
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: A page of rooms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room from a workflow template
      description: |
        Any authenticated user; the creator becomes the room's OWNER. In ONE transaction the room is inserted, its creator is added as
        OWNER, and the template's statuses and fields are COPIED into the room with every label resolved to the request's `language`
        (default `en`; a label the template has no translation for falls back to its `en` text). The copy is single-language plain text
        and has no link back: a later template edit or delete never touches the room. When per-label resolution would clash within a list,
        that whole list is copied in EN.

        The access type is fixed at creation. Omitting `accessType` creates a restricted hidden room.

        An unknown or deleted `templateId` is a `400` of type `urn:adder:problem:template-gone`; an unsupported `language` is a plain `400`. A case-insensitive name clash with a non-deleted
        room is `409` (archived rooms keep their names; a deleted room frees its own). Rides a per-USER rate bucket of 30 per minute
        shared with the rename (`429` beyond it). The name may not contain invisible formatting characters (`400`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new room
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/room-organization:
    get:
      tags: [rooms]
      operationId: getRoomOrganization
      summary: Get your room organization
      description: |
        A private document for the signed-in caller. A caller with no saved organization gets revision 1 and empty arrays.
        Room placements for memberships the caller no longer holds or rooms that were deleted are omitted.
      responses:
        '200':
          description: The caller's room groups and room order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomOrganization'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [rooms]
      operationId: replaceRoomOrganization
      summary: Save your room organization
      description: |
        Replaces the signed-in caller's private document. Only current room members can place a room in their own layout.
        Group IDs and room IDs must be unique in the document. A group reference must point to one of its groups or be `null`
        for an ungrouped room. Group names are trimmed single-line text and unique within the document, ignoring case.
        A missing, deleted, or non-member room reference is
        a uniform `400`. Missing or invalid `X-Expected-Revision` is `400`; a stale revision is `409` of type
        `urn:adder:problem:revision-conflict`. Uses the per-user `chat-write` bucket of 240 requests per minute.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomOrganizationUpdate'
      responses:
        '200':
          description: The saved organization and its current revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomOrganization'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Get a room
      description: |
        A member of the room or an `ADMIN` in a public or restricted visible room. A caller without content access gets the same
        `404` as for a missing or deleted room. `role` is the caller's role, `null` for an `ADMIN` outside the room.
        Signed-in non-members can use the access preview to discover public and restricted visible rooms.
        `workflowRevision` is what a workflow PUT names in `X-Expected-Revision`.
      responses:
        '200':
          description: The room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [rooms]
      operationId: updateRoom
      summary: Replace a room's name and description
      description: |
        The room's OWNER or an `ADMIN`. Checked in this order: visibility (`404` for a missing room and for a non-member alike), role
        (`403` for a plain member), the body (`400`), then under the room lock the guard again (a caller demoted while the write waited is
        refused), the archived state (`409` of type `urn:adder:problem:room-archived`: an archived room is read-only) and the name (a
        case-insensitive clash with another non-deleted room is a plain `409`, audited `room.name_conflict`). A full replace: an omitted description clears it.
        The name may not contain invisible formatting characters (Unicode category Cf, U+2028, U+2029: `400`). Rides the per-USER `room-name`
        bucket shared with the room create (30 per minute, `429` beyond it), because a rename's `409` would otherwise be a free probe for a room's name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [rooms]
      operationId: deleteRoom
      summary: Delete a room (soft)
      description: |
        `ADMIN` only, but the visibility check comes first: a non-member who is not an `ADMIN` gets the `404`, a member who is not an
        `ADMIN` (the room's OWNER included) gets `403`. Soft delete - the room stops reading as active and frees its name; there is no
        restore. An archived room can be deleted. Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token).
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/access:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: getRoomAccess
      summary: Get a room access preview
      description: |
        Public and restricted visible rooms are available to any signed-in user. A restricted hidden room is available only to
        members. The preview contains room metadata and the caller's own request state. Inaccessible, missing, and deleted rooms return the same `404`.
      responses:
        '200':
          description: The access preview
          content:
            application/json:
