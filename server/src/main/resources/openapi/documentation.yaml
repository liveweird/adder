        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/join:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [rooms]
      operationId: joinPublicRoom
      summary: Join a public room
      description: |
        Adds the signed-in caller as a member of a public room, including an archived one. Already a member is a no-op.
        The room-members bucket permits 60 writes per user per minute.
      responses:
        '204':
          description: The caller is a member
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/join-requests:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: listRoomJoinRequests
      summary: List pending room join requests
      description: |
        Room owners can see pending requests from active users for a restricted visible room. Sort by `id` (request id) or
        `requestedAt`. Default order is ascending by `id`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of pending join requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomJoinRequestPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [rooms]
      operationId: requestRoomMembership
      summary: Request to join a restricted visible room
      description: |
        Submits a request for the signed-in caller. A caller with a pending request or an existing membership can repeat the action
        safely. Submitting again after a rejection creates a new pending request. The room-members bucket permits 60 writes per user
        per minute.
      responses:
        '204':
          description: The request is pending or the caller is already a member
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/join-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: requestId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    put:
      tags: [rooms]
      operationId: decideRoomJoinRequest
      summary: Approve or reject a room join request
      description: |
        A room owner decides a request. Approval grants membership in the same transaction. Rejection leaves the applicant outside the
        room and records the outcome in their access preview. A later request has a new id. The room-members bucket permits 60 writes
        per user per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomJoinRequestDecision'
      responses:
        '204':
          description: Decision recorded
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/seen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [rooms]
      operationId: markRoomSeen
      summary: Record that the caller has looked at a room
      description: |
        A MEMBER of the room (a non-member is the uniform `404`; an `ADMIN` who is not a member is `403`: they have no read state). Moves
        ONLY the caller's own `seen_at`, forward only, so the room stops being `unread` in the rooms list until someone else's next
        activity. Checked in this order: authentication (`401`), the per-USER `read-state` bucket of 240 per minute (`429` beyond it;
        spent before any guard), visibility (`404`), the member rule (`403`), then the caller's own membership (`404` when they were
        removed meanwhile). View state: it takes no room lock, emits no live event and writes no audit line; the caller's other tabs
        catch up on focus. An archived room is seen all the same. No request body.
      responses:
        '204':
          description: Recorded (the same answer when the room was already seen)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/read-all:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [threads]
      operationId: markRoomRead
      summary: Mark every thread of a room as read for the caller
      description: |
        "Mark all as read". A MEMBER of the room (a non-member is the uniform `404`; an `ADMIN` who is not a member is `403`: they have no
        read state). Checked in this order: authentication (`401`), the per-USER `read-state` bucket of 240 per minute (`429` beyond it;
        spent before any guard), visibility (`404`), the member rule (`403`), then the caller's own membership (`404` when they were
        removed meanwhile).

        Raises ONLY the caller's own floor of unread counting (`read_from`) and their `seen_at` to the instant of the request, forward only,
        so every thread of the room (closed ones and ones they never opened too) answers `unreadCount` 0 and `firstUnreadMessageId` null,
        the room stops being `unread` in the rooms list, and then the caller's unseen notices of THIS room that were made up to that
        instant become seen (the rail's `@` count for the room, the bell), in chunks of 1,000, each its own short transaction. Every kind and channel is settled, a notice that was only to be emailed too (which cancels its pending digest, as the read marker does). A message
        or notice made after the instant stays unread or unseen, and so is a thread started afterwards; a message committed in the very
        instant of the request may be swallowed. The caller's per-thread read markers and everybody else's read state are untouched.
        Idempotent: the same answer when nothing was unread. An archived room is marked all the same. No room lock is taken and no
        live event is emitted (the caller's other tabs of the same browser re-read the bell count through a `BroadcastChannel`, the rest catches up on focus); ONE audit line (`room.read_all`: ids, the number of
        notices settled and whether the work `complete`d) is written after the work. At most ONE call per person runs at a time: a second while the first is running
        is `429` of type `urn:adder:problem:read-busy` with `Retry-After: 1`. If the work fails after the floor was raised (an error
        answer), the floor stays raised and calling again settles the rest of the notices. No request body.
      responses:
        '204':
          description: Marked (the same answer when nothing was unread)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [rooms]
      operationId: archiveRoom
      summary: Archive a room
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, then role `403`). Idempotent: archiving an archived room is a `204` that
        changes nothing. An archived room is read-only for its name, description and workflow; its members can still be managed.
        No request body. Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token).
      responses:
        '204':
          description: Archived (or already archived)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [rooms]
      operationId: unarchiveRoom
      summary: Unarchive a room
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, then role `403`). Idempotent: unarchiving an active room is a `204` that
        changes nothing. No request body. Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token).
      responses:
        '204':
          description: Unarchived (or already active)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/workflow:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: getRoomWorkflow
      summary: Get a room's workflow
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`). The room's ACTIVE statuses and fields in position order
        (retired ones are not shown), with plain single-language labels and the `revision` a later workflow PUT names in
        `X-Expected-Revision`. Each status carries `threadCount`, the number of threads currently in it.
      responses:
        '200':
          description: The room's workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomWorkflow'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [rooms]
      operationId: updateRoomWorkflow
      summary: Replace a room's workflow
      description: |
        The room's OWNER or an `ADMIN`. A whole-document replace of the room's own copy under optimistic concurrency, checked in
        this order: the room (a missing room or a non-member is the uniform `404`), the role (`403`), the `X-Expected-Revision`
        header (missing, repeated or malformed is `400`), the body (`400`: the workflow rules - 2-20 statuses with unique slug keys,
        exactly one initial and it is `OPEN`, at least one `CLOSED`, 0-20 fields with unique slug keys, 1-50 options on the select
        kinds only, labels of 1-60 characters unique per list, case-insensitively), then under the room lock, in this order: an
        archived room is `409` of type `urn:adder:problem:room-archived`; a stale revision is `409` of type
        `urn:adder:problem:revision-conflict`; a field whose key exists (retired ones included) with another `type` is `409` of type
        `urn:adder:problem:field-type-immutable` with `keys`; a room may reserve at most 200 status keys and 200 field keys
        (retired ones included), beyond that a plain `409`; an invalid `replacements` mapping is `400`; a status that would be retired
        or re-categorised while threads use it, without a valid replacement, is `409` of type `urn:adder:problem:status-in-use` with
        `keys`.

        `statuses` and `fields` are the ACTIVE ones in the new order (position is the array index). A key the document no longer
        names is retired (its key stays reserved); a retired key it names again is revived. `replacements` is
        `{retiredKey: replacementKey}`: where the threads of each status THIS change retires move; the key must be a status this
        change retires and the target a status of the new document in the same category as the retired one (else `400`). A
        status's category can only change while no thread uses it. A replacement moves each of those threads and writes one
        `STATUS_REPLACED` event to its history; the thread keeps its `closedAt` (the replacement has the same category), its
        `lastActivityAt` and its details `revision` are not bumped, and only its `updatedAt` moves. Every successful PUT stores
        `workflowRevision + 1`; read the workflow again for it.

        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token).
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomWorkflowUpdate'
      responses:
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: listRoomMembers
      summary: List a room's members
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`). Members are ACTIVE users only: a soft-deleted user's
        membership is inert and never listed.

        - Sortable fields: `id` (the user id), `name`, `role`, `addedAt`. Default `id` ascending.
        - Filters: `role` (`OWNER` or `MEMBER`; any other value is a `400`); `name` (case- and accent-insensitive substring of the display
          name, at most 100 characters - `400` beyond). A repeated key is a `400`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RoomRole' }
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 50 }
          description: Trimmed first; at most 50 characters (code points) after trimming, `400` past that.
      responses:
        '200':
          description: A page of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomMemberPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [rooms]
      operationId: addRoomMembers
      summary: Add people to a room, one by one and/or a whole team
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, role `403`, then the body `400`, then under the room lock the guard again).
        Allowed on an archived room. At least one of `userIds` (at most 200) and `teamId` is required. A team is a SNAPSHOT: its
        ACTIVE roster at this moment becomes members, and a later roster edit never follows. Everyone is added as `MEMBER`; promotion
        is a separate step (`PUT .../members/{userId}`).

        Idempotent: a person who already belongs is skipped and counted in `alreadyMembers` (and beats the cap). An unknown or
        soft-deleted user id or team id is a `400` and nothing is added. A room holds at most 500 active members: an add that would
        exceed it is a plain `409` and nothing is added. A team whose roster holds no active member adds nobody: `200` with
        `{added: 0, alreadyMembers: 0}`. One `room.member_added` audit line per person actually added. The body is limited to 16 KiB (`413`
        beyond it, before it is decoded) and the call rides a per-USER `room-members` bucket of 60 per minute (`429` beyond it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomMembersAddRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Added (the counts say how many people were new)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomMembersAddResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/UserIdPath'
    put:
      tags: [rooms]
      operationId: setRoomMemberRole
      summary: Set a member's role
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, role `403`, the body `400`, then under the room lock the guard again). Allowed
        on an archived room. Idempotent: the role the member already has is a `204` that changes nothing and is not audited
        (`room.member_role_changed` fires on a change only). A user who is not an active member is `404`. Demoting the room's last
        `OWNER` whose user is active is a `409` of type `urn:adder:problem:last-owner`: promote someone else first. Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomMemberRoleRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: The member has the role (set now or already)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [rooms]
      operationId: removeRoomMember
      summary: Leave a room, or remove a member
      description: |
        A member removes THEMSELVES (a leave: visibility `404` for a non-member, so an `ADMIN` who is not in the room gets `404` too) or
        the room's OWNER or an `ADMIN` removes someone else (a plain member removing another is `403`). Allowed on an archived room.
        `404` for a user who is not an active member. Removing the room's last `OWNER` whose user is active - a leave included - is a
        `409` of type `urn:adder:problem:last-owner`. Audited `room.member_removed` (with `self`). A hard delete: the person can be added
        again. Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token).
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [threads]
      operationId: listRoomTags
      summary: List a room's hashtags
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, then the parameters are checked: `400`).

        This path and `GET /rooms/{id}/hashtags` return the same collection.
        A tag is a hashtag written in a message (`#Wdrozenie`); it belongs to the MESSAGE, so a thread has it while one of its live
        messages does, and editing it away or deleting the message removes it. A row is the FOLDED tag (lower case, accents stripped: the
        key the thread list's `tag` filter takes) and `threadCount`, the number of distinct threads, open and closed, that have a live
        message carrying it. Nothing here is a record the caller can edit: the set is derived from the messages.

        - Sortable fields: `tag`, `threadCount`. Default `-threadCount` (the most used first; ties by `tag`).
        - Filter: `q` (API-LIST-005; optional here, unlike the search routes), a case- and accent-insensitive substring of the tag (for a
          picker), at most 50 characters (`400` beyond). A repeated key is a `400`. It is not the thread list's `tag`, which is an exact,
          repeatable key.

        Rides the per-USER `chat-read` bucket of 300 per minute shared with the thread list and the registry read (`429` beyond it; the bucket is spent
        before any guard, so a refused or invalid read costs a token too). The read runs under one deadline of 5 seconds by default: a
        list past it is answered `429` of type `urn:adder:problem:read-timeout` with `Retry-After: 2`, audited without the filter value.
        The caller can have at most 8 listed reads in flight, subject to a server-wide default of 8 for the shared list budget. Each
        read waits about 1 second for a slot. If the wait runs out, it is answered `429` of type `urn:adder:problem:read-busy` with `Retry-After: 1`
        (the server is loaded; retry shortly, nothing to narrow).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/TagQ'
      responses:
        '200':
          description: A page of the room's tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTagPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/hashtags:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [threads]
      operationId: listRoomHashtags
      summary: List a room's hashtags
      description: |
        Lists the same message-derived hashtags as `GET /rooms/{id}/tags`. Room reader access is checked before query validation.
        Each row's `tag` is a case- and accent-folded key for the thread list's `hashtag` filter. `threadCount` counts distinct
        threads with at least one live message carrying that key. Sortable fields are `tag` and `threadCount`. The default is
        `-threadCount` with ties by `tag`. The optional `q` matches a case- and accent-insensitive substring up to 50 characters.
        Both paths share the `chat-read` rate limit and read budget.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/TagQ'
      responses:
        '200':
          description: A page of the room's hashtags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTagPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/search:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [threads]
      operationId: searchRoom
      summary: Search a room's threads and messages
      description: |
        Full-text search over the room's thread TITLES and live message BODIES. A member of the room or an `ADMIN` (a non-member gets the
        uniform `404`). Checked in this order: authentication (`401`), the per-USER `search` bucket of 60 per minute (`429`; spent
        before any guard, so a refused search costs a token too), visibility (`404`, audited `room.access_denied`), the parameters
        (`400`), then the query. A non-member's bad `q` or `threadTag` is still a `404`. An archived room is searched.

        - Plain `q` (when `syntax` is omitted; REQUIRED unless `watching=true`, `unread` is given, or a `threadTag` is given; 2 to 100 code points after trimming, at least one letter or digit, no control characters; repeating it is a `400`)
          is matched case- and accent-insensitively: `zolw` finds `Żółw` and the snippet keeps the diacritics. Every term is required
          within ONE message or within the title; a term of three or more characters matches as a PREFIX (there is no stemming, so
          `awari` finds `awaria` and `awarii`, but `bazy` does not find `baza`), a shorter one matches exactly. There are no operators:
          `&`, `|`, `!`, quotes and `:*` are punctuation, never syntax, so an operator is never a query error: only an input with no letter or digit at all
          (`!!!`) is a `400`, while tag-shaped input such as `<script>` has no indexable word and matches nothing. `PROD-123` is indexed as `prod` and `-123`: searching it finds it, `123` alone does not.
          Hashtag text is searchable (`#db-outage` indexes `db-outage`, `db` and `outage`). Field values and deleted messages are never
          searched.
        - `syntax=structured` makes `q` required and enables space-separated clauses combined with AND. See the `SearchSyntax`
          parameter for the grammar. `timeZone` supplies the time zone of calendar dates.
        - `closed` (strict `true` or `false`, on the status category; omitted = both; a repeated key is a `400`).
        - `watching` (strict `true` or `false`; a repeated key is a `400`) keeps the threads the CALLER watches (`PUT .../watch`), or, with
          `false`, the ones they do not; it narrows the matches of `q`. **In plain mode, `q` is optional with `watching=true` or a `threadTag`** (below): with `watching=true` that is the room's
          "Threads I watch" list, every thread of the room the caller watches, sorted like any search (default newest activity first),
          with NO query: no text is matched, so each hit has `messages: []`, `matchCount: 0` and its title as one segment with `hit:
          false`. A blank `q` counts as none there; a given `q` is validated as ever. Without `watching=true` (omitted, or `false`) and without a
          `threadTag` or `unread` filter a missing `q` is a `400`. A caller who is not a member of the room (an `ADMIN`) watches none, so `watching=true` is an empty
          page for them.
        - `unread` (strict `true` or `false`; a repeated key is a `400`) keeps threads with something unread for the CALLER, or with
          `false`, those with nothing unread. It combines with every text, structured, scope, watching, and tag filter. **In plain mode,
          an `unread` filter makes `q` optional**: that is the room's read-state view, sorted like any search, with no message-level matches.
          A non-member `ADMIN` has no read state, so `unread=true` is empty and `unread=false` is its exact complement.
        - `threadTag` (repeatable, any-of, at most 20 distinct; the thread list's own parameter) keeps the threads of the room that carry any of
          these CURATED tags (`GET /tag-categories`; a retired tag still finds the threads that kept it, a well-formed name the registry never held
          matches nothing, a malformed name or more than 20 distinct values is a `400`), also with a `q`, which then narrows them. **Like
          `watching=true`, a tag alone is a valid search**: with no `q` the room's threads carrying any of the tags, sorted like any search,
          each hit with `messages: []`, `matchCount: 0` and its title as one segment with `hit: false`. Every hit carries its own `tags`.
        - Sortable fields: `lastActivityAt`, `createdAt`, `id`. Default `-lastActivityAt` (`id` ascending breaks ties). `pageSize` is at
          most 20 (default 20; `400` beyond).

        An item is a THREAD, in the page envelope: `total` counts matching threads. `messages` holds the three newest matching live
        messages (newest first) and `matchCount` counts all of them; a thread that only matched by its title has no messages and a
        count of 0. A snippet is a list of typed segments `{text, hit}`, never markup: `text` is a fragment of the Markdown source as
        PLAIN text (render it as text, never as HTML or Markdown), `hit` marks the words that matched. `status` is the status KEY (the
        room's workflow holds the label and colour). The search is one read under ONE deadline for all its statements (5 seconds by
        default): a search past it is answered `429` of type `urn:adder:problem:search-timeout` with `Retry-After: 2`, audited without
        the term (narrow the query). At most 4 searches run in the server at once (both search operations together): another is refused
        at once with `429` of type `urn:adder:problem:search-busy` and `Retry-After: 1` (the server is loaded; retry shortly, nothing to
        narrow). The cost of a search is linear in the messages of the rooms it covers (this room, or the caller's rooms): a word that
        matches nothing reads them all. The term appears in no log line and in no problem body. Results are not live.
      parameters:
        - $ref: '#/components/parameters/SearchQ'
        - $ref: '#/components/parameters/SearchSyntax'
        - $ref: '#/components/parameters/SearchTimeZone'
        - name: closed
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/ThreadWatchingFilter'
        - $ref: '#/components/parameters/ThreadUnreadFilter'
        - $ref: '#/components/parameters/ThreadCuratedTagFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/SearchPageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of matching threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadSearchPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [threads]
      operationId: listThreads
      summary: List a room's threads
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`).
        The default list shows active canonical threads. Set `mergedInto` to browse the readable source conversations of a merge.

        - Sortable fields: `id`, `number`, `title`, `lastActivityAt`, `createdAt`, `status` (the status's position in the room's
          workflow: the first status first, a retired one where it sits). Default `id` ascending (the SPA sends `-lastActivityAt`).
        - Filters: `closed` (strict `true` or `false`, on the status category: `true` = only closed threads, `false` = only open ones;
          omitted = both; a repeated key is a `400`), and the repeatable `status`, `ownerId` and `field`: any-of within one parameter,
          all-of across parameters. `field` is `key:value` on an ACTIVE SELECT, MULTI_SELECT or USER field of the room, any-of
          within a key and all-of across keys (SELECT and MULTI_SELECT: an option key, one the room has since removed still finds
          the threads that kept it; USER: a user id). An unknown, RETIRED, TEXT, URL, DATE or NUMBER field key, a `field` without a
          colon and a value of the wrong shape for its type are a `400`.
        - `hashtag` and `tag` (aliases, repeatable, any-of, at most 10 distinct after case folding across both names) keep the threads
          that have a LIVE message carrying any of the hashtags. A value is the tag as written without its `#`, or a `tag` of
          `GET /rooms/{id}/hashtags` as returned, and it is
          folded (case and accents ignored: `Wdrozenie` and `wdrożenie` are one tag). A returned key can hold punctuation and be longer
          than a written tag, so a value is 1 to 150 characters without `#` or control characters. A malformed value, or more than 10
          distinct values, is a `400`.
        - `threadTag` (repeatable, any-of, at most 20 distinct) keeps the threads that carry any of these CURATED tags (`GET /tag-categories`;
          not the hashtags of `tag`): a registry name, normalised like the PUT's (trimmed, whitespace collapsed, lower-cased). A RETIRED
          tag still finds the threads that kept it; a well-formed name the registry never held matches nothing; a name outside the tag
          grammar, or more than 20 distinct values, is a `400`.
        - `mentionedId` (repeatable, any-of, at most 20 distinct) keeps the threads that have a LIVE message mentioning any of
          those people (`<@id>` in its body, the person an active member of the room when it was written or edited); the filter reads
          the mention index only, so it finds nothing for a message written before mentions were indexed. A non-positive or
          non-integer id, or more than 20 distinct values, is a `400`.
        - `watching` (strict `true` or `false`) keeps the threads the CALLER watches (`PUT .../watch`), or, with `false`, the ones they do not.
        - `mentionsMe` (strict `true` or `false`; a repeated key is a `400`) keeps the threads with a LIVE message that addresses the CALLER
          (the "Mentions me" view), or, with `false`, the ones that do not: the message names them with `<@id>`, or names a team they are
          on NOW (`<@team:id>`), or names everyone (`<@everyone>`), or names the watchers (`<@watchers>`) while they watch the thread NOW.
          A caller who is not a member of the room (an `ADMIN`) is addressed by name only, never through a group. `mentionedId` is
          unchanged and stays direct only. It reads the mention indexes only, so it finds nothing for a message written before they existed.
        - `unread` (strict `true` or `false`; a repeated key is a `400`) keeps the threads with something UNREAD for the CALLER (exactly the
          rows whose `unreadCount` is above 0: a message among the newest 100 after their read marker written since they joined or
          last marked the room read), or, with `false`, the ones with nothing unread; omitted = both. It combines with every other filter
          (all-of), closed threads included, and `total` counts the same predicate. A caller who is not a member of the room (an `ADMIN`)
          has no read state: `true` is an empty page and `false` keeps everything.
        - A well-formed status key, owner id, mentioned user id, field value or tag that matches nothing is an empty page, never an error. Checked in this
          order: visibility (`404`), then the parameters (`400`): a non-member's bad filter is still a `404`. A filter never widens
          what the caller may read.
        - A row carries the status KEY; labels and colours come from the room's workflow (`GET /rooms/{id}/workflow`).
        - Rides the per-USER `chat-read` bucket of 300 per minute shared with `GET /rooms/{id}/tags` and `GET /tag-categories` (`429` beyond it; the bucket is spent
          before any guard, so a refused or invalid read costs a token too). The read runs under one deadline of 5 seconds by default: a
          list past it is answered `429` of type `urn:adder:problem:read-timeout` with `Retry-After: 2`, audited without the filter values.
          The caller can have at most 8 listed reads in flight, subject to a server-wide default of 8 for the shared list budget. Each
          read waits about 1 second for a slot. If the wait runs out, it is answered `429` of type `urn:adder:problem:read-busy` with `Retry-After: 1`
          (the server is loaded; retry shortly, nothing to narrow).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: closed
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/ThreadStatusFilter'
        - $ref: '#/components/parameters/ThreadOwnerFilter'
        - $ref: '#/components/parameters/ThreadFieldFilter'
        - $ref: '#/components/parameters/ThreadTagFilter'
        - $ref: '#/components/parameters/ThreadHashtagFilter'
        - $ref: '#/components/parameters/ThreadCuratedTagFilter'
        - $ref: '#/components/parameters/ThreadMentionFilter'
        - $ref: '#/components/parameters/ThreadMentionsMeFilter'
        - $ref: '#/components/parameters/ThreadWatchingFilter'
        - $ref: '#/components/parameters/ThreadUnreadFilter'
        - name: mergedInto
          in: query
          description: List only threads merged into this thread number in the room. An unknown number returns an empty page.
          schema: { type: integer, format: int32, minimum: 1 }
      responses:
        '200':
          description: A page of threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [threads]
      operationId: createThread
      summary: Start a thread
      description: |
        A MEMBER of the room (an `ADMIN` who is not a member is `403` and joins through the Members page first; a non-member is the
        uniform `404`). Checked in this order: visibility (`404`), membership (`403`), the body (`400`), then under the room lock the
        guard again (a caller removed while the write waited is refused), an archived room (`409` of type `urn:adder:problem:room-archived`)
        and the field values and registry membership of selected tags (`400`).

        The thread starts in the room's initial status with the caller as its owner and the number `MAX + 1` of the room; `body`
        becomes its opening message. `title` is a single line of 1 to 200 characters; `body` is Markdown of 1 to 8,000 UTF-16 units
        after line endings are normalised, leading blank lines and trailing whitespace are dropped and the first line's indentation stays
        (`\n` and `\t` allowed, every other control character and the hidden direction characters
        are a `400`). Every required field must be supplied; an unknown key, or a value for a retired key (an unchanged `null` for a retired key is ignored), is a `400`,
        as is a value that breaks its type's rule. The thread, its opening message, its `CREATED` history entry and the activity bump of the thread and the room commit
        together, and so do the notifications (`listNotifications`): every other ACTIVE member of the room gets `THREAD_CREATED`, or the most
        specific of `MENTIONED` (named with `<@id>`), `TEAM_MENTIONED` (a member of a team the body names with `<@team:id>`) and
        `HERE_MENTIONED` (an active member with a fresh visible-tab lease when `<@here>` is introduced) and `EVERYONE_MENTIONED`
        (`<@everyone>`); `<@watchers>` in an opening message reaches nobody.

        Optional `tags` contains curated registry names. Omission or an empty list creates an untagged thread.
        A nonempty list commits its tag associations and a `TAGS_CHANGED` event with the creation. The new thread starts at revision 1.
        Rides the per-USER `chat-post` bucket of 120 per minute shared with the message POST (`429`
        beyond it); the bucket is spent before any guard, so a refused or invalid POST costs a token too. The request body is at most 192 KiB (`413` beyond it)
        and `fields` holds at most 20 keys whose values are primitives, `null` or a list of at most 50 option keys (anything else, a
        nested object included, is a `400` before any lock); the stored values may not exceed 439,001 characters of JSON (`400`). The write
        waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with
        `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new thread
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    get:
      tags: [threads]
      operationId: getThread
      summary: Get a thread
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, as does an unknown number). `fields` holds the ACTIVE
        fields' stored values only (a retired field keeps its value, hidden, and it returns if the field is revived); `fieldUserNames`
        maps the user ids held by USER fields to display names. `revision` is what the details PUT names in `X-Expected-Revision`.

        The read runs under the lists' deadline (5 seconds by default; past it `429` of type `urn:adder:problem:read-timeout` with
        `Retry-After: 2`) and its OWN in-flight caps (2 per user and 3 in the process, apart from the lists' permits;
        `urn:adder:problem:read-busy` with `Retry-After: 1`: the server is loaded, retry shortly). It is NOT in the `chat-read` bucket:
        a live hint re-reads the open thread every few hundred milliseconds in a busy thread, which would spend the lists' budget, and
        for the same reason it does not share the lists' permits.
      responses:
        '200':
          description: The thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [threads]
      operationId: updateThread
      summary: Edit a thread's title and fields
      description: |
        A member of the room or an `ADMIN` (any reader edits the open-side metadata; a non-member is the uniform `404`). Checked in this
        order: visibility (`404`), the `X-Expected-Revision` header (missing, repeated or malformed is `400`), the body (`400`), then
        under the room lock: the guard again (a caller removed while the write waited is refused), the thread (`404`), an archived room
        (`409` of type `urn:adder:problem:room-archived`), a closed thread (`409` of type `urn:adder:problem:thread-closed`: reopen it
        first), a stale revision (`409` of type `urn:adder:problem:revision-conflict`), then the field values (`400`).

        `title` is a single line of 1 to 200 characters. `fields` MERGES over the stored values: a key left out is untouched and `null`
        clears the field; a value equal to the stored one is not re-validated, so a stale value (a removed option, a user who left)
        never blocks a save. A required field cannot be cleared once set; an unknown key, or a changed value for a retired key, is a `400`.
        When nothing changed the answer is `204` with no revision bump, no history entry and no activity bump. Otherwise the revision
        becomes `revision + 1` (read the thread again for it), one `TITLE_CHANGED` and one `FIELD_CHANGED` entry per changed field are
        recorded (neither carries the old or new title, nor a TEXT or URL value), and the thread and the room are bumped in the activity order.

        The body is at most 192 KiB (`413` beyond it) and `fields` holds at most 20 keys whose values are primitives, `null` or a list of at most 50 option keys (anything else, a nested object included, is a `400` before any lock); the stored values may not exceed 439,001 characters of JSON (`400`).
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadUpdateRequest'
      responses:
        '204':
          description: Saved, or nothing changed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [threads]
      operationId: deleteThread
      summary: Delete a thread
      description: |
        The thread steward (the owner while a member, a room owner, or an ADMIN with room access) deletes an open or closed thread
        in an active room. Deleting a canonical thread also deletes the conversations merged into it. The thread numbers are not reused.
        The room write lock serializes the deletion and removal of saved message revisions. The per-user chat-write bucket applies.
      responses:
        '204': { description: Thread deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/merge:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: mergeThread
      summary: Merge a duplicate thread into another thread
      description: |
        Requires stewardship of both threads in one active room. The destination must be canonical. The source conversation stays
        readable with its original links, and it no longer accepts new activity. The destination retains its workflow and metadata.
        Repeating the same merge is a no-op. Merging a source that already points to a different destination returns a conflict.
        The room write lock serializes the merge. The per-user chat-write bucket applies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadMergeRequest'
      responses:
        '204': { description: Merged or already merged to this thread }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/status:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadStatus
      summary: Move a thread to a status (close, reopen)
      description: |
        A member of the room or an `ADMIN` (a non-member is the uniform `404`). A move between two OPEN statuses is open to every reader;
        a move that enters or leaves a CLOSED status - closing, reopening, or CLOSED to CLOSED - needs a STEWARD: the thread's owner
        while a member, the room's OWNER or an `ADMIN` (`403` otherwise). Which of the two applies depends on the target's category, so
        the answer is decided under the room lock after the target resolves: checked in this order visibility (`404`), the body (`400`),
        then under the lock the guard again, the thread (`404`), the target (`400` for a status key that is unknown or retired - every
        reader can read the workflow, so it discloses nothing), the steward rule (`403`), an archived room (`409` of type
        `urn:adder:problem:room-archived`, the no-op included). A closed thread is NOT refused here: reopening it, or moving it between
        CLOSED statuses, is the point.

        Setting the status the thread already has is `204` with no history entry, no activity bump and no audit line (a plain member
        is still `403` when that status is CLOSED). Otherwise the status changes, `closedAt` is set to the instant the thread closed
        (kept across CLOSED to CLOSED moves) and cleared by a move into an OPEN one, a `STATUS_CHANGED`, `CLOSED` or `REOPENED` history entry is recorded and
        the thread and the room are bumped in the activity order, and the thread's WATCHERS (never the caller) get a notification
        (`listNotifications`): `THREAD_CLOSED`, `THREAD_REOPENED` or `THREAD_STATUS_CHANGED` by the move. A single-value set: the last writer wins, and the history records
        each change; the thread's `revision` is not moved.
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadStatusRequest'
      responses:
        '204':
          description: Moved, or already in that status
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/read-marker:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadReadMarker
      summary: Record that the caller has read a thread up to a message
      description: |
        A MEMBER of the room reads (a non-member is the uniform `404`; an `ADMIN` who is not a member is `403`: they have no read state).
        A single-value set with a body: the CALLER's own marker in this thread, moved up to and including `messageId`. It moves FORWARD
        only (reading an older message again is a `204` that changes nothing), and it moves nobody else's. Checked in this order:
        authentication (`401`), the per-USER `read-state` bucket of 240 per minute (`429` beyond it; spent before any guard), visibility
        (`404`), the member rule (`403`), the body (`400`: a `messageId` that is not a message id), then the caller's own membership (`404`
        when they were removed meanwhile), the thread (`404`) and the message, which must be the thread's, a tombstone included (`404`
        otherwise). The thread's notices of the caller up to that message become seen in the same transaction. Archived rooms and closed
        threads are read all the same.

        View state: it takes NO room lock (it locks only the caller's own membership row for the commit), emits no live event and writes no
        audit line; the caller's other tabs catch up on focus (the bell count follows across the tabs of the same browser when this settled a notice). It also counts as looking at the room (`POST /rooms/{id}/seen`). The unread
        count it clears is `unreadCount` of the thread read and of the thread list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadMarkerRequest'
      responses:
        '204':
          description: Recorded, or already read that far
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/watch:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadWatch
      summary: Watch or stop watching a thread
      description: |
        Any MEMBER of the room watches or unwatches any thread of it (a non-member is the uniform `404`; an `ADMIN` who is not a member is
        `403`: they have no state of their own in the room). A single-value set with a body: the CALLER's own watch, nobody else's.
        Checked in this order: authentication (`401`), the per-USER `thread-watch` bucket of 30 per minute (its own, apart from the read
        marker's; `429` beyond it; spent before any guard, so a refused write costs a token), visibility (`404`), the member rule (`403`) before the body, the body (`400`: `watching` must be a boolean), then the
        caller's own membership (`404` when they were removed meanwhile) and the thread (`404`). Repeating the stored choice gives
        `204` with nothing written and no audit line; a change is audited (`thread.watch_changed`). The first explicit off is stored
        even before the caller has watched, so a later reply respects it.

        A closed thread and an ARCHIVED room can be watched and unwatched: a watch is the member's own state, not a write to the room.
        It takes NO room lock (it holds only the caller's own membership row for the commit), emits no live event and moves no activity
        order; the caller's other tabs catch up on focus. The creator and a member who replies watch automatically. A new owner watches
        automatically unless they explicitly stopped watching before; an explicit stop also survives later replies. Setting `watching=true`
        opts back in. Leaving or being removed from the room drops the preference. What a watch does is read through `watching` and
        `watcherCount` of the thread and `watching` of the thread list and its filter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchRequest'
      responses:
        '204':
          description: Watching or not as asked, or already so
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/watchers:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
    get:
      tags: [threads]
      operationId: listThreadWatchers
      summary: List the people watching a thread
      description: |
        Members of the room can page through the active users who currently watch the thread. An inaccessible room is the uniform
        `404`; an `ADMIN` who is not a member gets `403`. Inactive watch preferences and soft-deleted users are omitted. Sortable by
        `id` or `name`; default `id`, with `id` as the stable tiebreaker.
      responses:
        '200':
          description: One page of watchers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadWatcherPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/mute:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadMute
      summary: Mute or unmute a thread for the caller
      description: |
        A room member sets their own mute independently of watching. A mute suppresses new notices for this thread and
        skips pending email while muted. The preference is visible as `muted` in the caller's thread detail.
        Closed threads and archived rooms are allowed. Leaving or being removed drops the preference.
        The user's thread settings bucket is shared with the watch write (30 per minute). A non-member receives the uniform
        `404`, an administrator outside the room receives `403`. The membership guard runs before the request body is decoded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted: { type: boolean }
      responses:
        '204': { description: The requested mute state is in effect. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/tags:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadTags
      summary: Replace a thread's curated tags
      description: |
        Who (1.2 D1): a member of the room or an `ADMIN` while the thread is OPEN (the rule of the title and fields); on a CLOSED thread only
        a STEWARD: the thread's owner while a member, the room's OWNER or an `ADMIN` (`403` otherwise); a non-member is the uniform `404`.
        An ARCHIVED room refuses (`409`). Checked in this order: authentication (`401`), the per-USER `chat-write` bucket of 240 per
        minute (`429` beyond it; spent before any guard), visibility (`404`), the thread (`404`) on a lock-free read and, when it is
        closed, the steward rule (`403`) BEFORE the header and the body, the `X-Expected-Revision` header (missing, repeated or malformed
        is `400`), the body (`400`: more than 20 names, judged before any name is normalised; a name outside the tag grammar; a name
        twice after normalising), then under the room lock the guard again (a caller removed while the write waited is refused), the
        thread (`404`), the steward rule again on the fresh row when it is closed (`403`), an archived room (`409` of type
        `urn:adder:problem:room-archived`), a stale revision (`409` of type `urn:adder:problem:revision-conflict`), and every name
        being a LIVE tag of the registry (`400` with a fixed detail that names no tag: an unknown name, a retired one, and a retired tag
        the thread still carries, so a save that keeps one is refused until it is dropped).

        `tags` is the thread's WHOLE tag set: registry names (`GET /tag-categories`), trimmed, whitespace collapsed and lower-cased, at
        most 20, each once; an empty list clears the thread. It is applied as a diff. The same set again is a `204` with no revision bump,
        no history entry and no audit line. Otherwise the thread's `revision` becomes `revision + 1` (read the thread again for it: a tag
        save and a details save share one token, so two people saving at once conflict), ONE `TAGS_CHANGED` entry (`{added, removed}`)
        is recorded and `thread.updated` is emitted. A tag change is history, not activity: no rail bump, no unread, no notice and
        `lastActivityAt` does not move.

        The body is at most 16 KiB (`413` beyond it). Like every write of the room it waits at most about 3 seconds for the room's write
        lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadTagsRequest'
      responses:
        '204':
          description: Saved, or the same set already
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/owner:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadOwner
      summary: Pass a thread on to another member
      description: |
        A STEWARD: the thread's owner while a member, the room's OWNER or an `ADMIN` (a non-member is the uniform `404`, a member who is
        not a steward `403`). Checked in this order: visibility (`404`), the thread (`404`) and the steward rule (`403`) on a lock-free
        read of its owner, the body (`400`), then under the room lock the guard, the thread and the steward rule again on the fresh
        rows, an archived room (`409` of type `urn:adder:problem:room-archived`), a closed thread (`409` of type
        `urn:adder:problem:thread-closed`: reopen it first), and the new owner (`400` unless `ownerId` is an ACTIVE member of the room).
        A removed or deleted owner keeps the thread, inert, until a steward passes it on.

        Naming the current owner again is `204` with no history entry, no activity bump and no audit line. Otherwise an `OWNER_CHANGED`
        history entry is recorded and the thread and the room are bumped in the activity order. A single-value set: the last writer
        wins, and the history records each change; the thread's `revision` is not moved. The new owner starts to watch the thread and gets a
        `THREAD_ASSIGNED` notification (`listNotifications`) and the live `notification.created` event, unless the caller took the thread
        themself; the thread's other watchers (the caller never) get `THREAD_OWNER_CHANGED`.
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadOwnerRequest'
      responses:
        '204':
          description: Passed on, or already the owner
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    get:
      tags: [threads]
      operationId: listThreadEvents
      summary: List a thread's history
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, as does an unknown number). The thread's append-only
        history: structured entries (`type` plus string-map `params`: keys and ids with snapshots of labels and names) that the client
        renders in the viewer's language. Message edits and deletes are not history, and neither is any title or TEXT or URL value
        (see `ThreadEventType` for the `params` of each kind, and for what a retired field hides).

        - Sortable fields: `id`, `createdAt`. Default `-createdAt,-id` (newest first).
        - `createdAt[gte]` and `createdAt[lte]` are inclusive epoch-millisecond bounds. Both may be used together.
        - `actorDeleted` marks an actor whose account has since been deleted (the recorded name stays).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: createdAt[gte]
          in: query
          description: Earliest event timestamp to include, in epoch milliseconds.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: createdAt[lte]
          in: query
          description: Latest event timestamp to include, in epoch milliseconds.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: A page of history entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadEventPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/messages:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    get:
      tags: [messages]
      operationId: listThreadMessages
      summary: List a thread's messages
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, as does an unknown number). Deleted messages are
        LISTED as tombstones (`body: null`, `deleted: true`); a single `GET` of one answers `404`.

        - Sortable field: `id` only (ascending is time). Default `-id` (newest first), so the keyset is right without a `sort` parameter.
        - Keyset paging inside the standard envelope: `id[lt]` keeps only the messages OLDER than that id, so the next page of a
          newest-first list is `id[lt]=<smallest id loaded>&page=1`. `total` is counted AFTER the `id[lt]` filter: `total > items.length`
          means older messages exist. A repeated `id[lt]` is a `400`.
        - Each message carries its `reactions` as the CALLER sees them (`reacted` marks the caller's own); a tombstone carries none.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/IdLt'
      responses:
        '200':
          description: A page of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [messages]
      operationId: postThreadMessage
      summary: Post a message to a thread
      description: |
        A MEMBER of the room (an `ADMIN` who is not a member is `403` and joins through the Members page first; a non-member is the
        uniform `404`). Checked in this order: visibility (`404`), membership (`403`), the body (`400`: the message rules, and a
        `quotedMessageId` outside 1 to 2147483647), then under the room lock the guard again (a caller removed while the write waited is
        refused), the thread (`404`), an archived room (`409` of type `urn:adder:problem:room-archived`), a closed thread (`409` of type
        `urn:adder:problem:thread-closed`: a steward reopens it first) and the quote.

        `quotedMessageId` makes the message QUOTE any live message the caller can currently read, including one in another thread or room.
        The source and destination rooms are locked in ascending id order and both permissions are re-checked under those locks. An unknown
        id, an unreadable source room and a deleted message or source thread are ONE answer, a `400` of type
        `urn:adder:problem:quote-unavailable` with a fixed detail (never a `404`: on this POST that means the thread or the room is gone);
        nothing is written. The quote is set when the message is posted and never changes: the edit (`editThreadMessage`) cannot name one.
        The `201` carries it as `quote` (read like every message does: the quoted message as it reads NOW).

        `body` is Markdown of 1 to 8,000 UTF-16 units after line endings are normalised, leading blank lines and trailing whitespace
        are dropped and the first line's indentation stays (`\n` and `\t` allowed, every other control character and the hidden
        direction characters are a `400`). It is stored raw and rendered without HTML. The message, `messageCount + 1` and the
        activity bump of the thread and the room commit together, and so do the notifications (`listNotifications`): a `MENTIONED` one for
        each member the body mentions with `<@id>`, `MESSAGE_QUOTED` for the author of the quoted message (an ACTIVE member of the room now,
        never the poster; a person who left the room or whose account was deleted is not told and the post still succeeds),
        `TEAM_MENTIONED` for each member of the room on the roster of a team it names with
        `<@team:id>` (a team member who is not in the room is never told; a team that is deleted, unknown or has no handle is plain text),
        `WATCHERS_MENTIONED` for each WATCHER of the thread when it names `<@watchers>`, `HERE_MENTIONED` for each active room member whose
        visible-tab lease is fresh when `<@here>` is introduced, `EVERYONE_MENTIONED` for every member of the room when
        it names `<@everyone>` (any member may), and a `THREAD_REPLIED` one for each other WATCHER of the thread (one notice per person, the most
        specific reason in that order; never the author). At most 20 distinct people, 5 distinct teams and each keyword once count; the rest are
        plain text. A group mention reaching more than 20 people is a wide event (the daily budget below). Rides the per-USER `chat-post` bucket of 120 per minute shared with
        the thread POST (`429` beyond it); the bucket is spent before any guard, so a refused or invalid POST costs a token too. The
        request body is at most 64 KiB (`413` beyond it), and the write waits at most about 3 seconds for the room's write lock before it is
        answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      parameters:
        - name: X-Mutation-Id
          in: header
          required: false
          description: |
            Optional identifier for correlating this request with the writer's live message.posted event. Supply at most one
            canonical lowercase UUIDv4. A malformed or repeated value returns `400`. This identifier only correlates events.
            Sending the same identifier again can post another message.
          schema: { $ref: '#/components/schemas/LiveMutationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagePostRequest'
      responses:
        '201':
          description: Posted; `Location` points at the new message (`/api/v1/rooms/{id}/messages/{messageId}`)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/messages/context:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    get:
      tags: [messages]
      operationId: getThreadMessageContext
      summary: Get a message window in a thread
      description: |
        Lands directly on `messageId` in the selected thread and returns it with up to 25 earlier and 25 later messages, oldest first.
        This is a bounded replacement window, not a page to append: request the first returned id to move earlier or the last returned
        id to move later. `older` and `newer` say whether another window exists outside the returned one. The anchor is included even
        when it is a deleted tombstone; an unknown id and a message of another thread are the same uniform `404`.

        Room members may read it. An `ADMIN` outside the room can read public and restricted visible rooms. Other callers get the uniform `404`. The read shares the bounded per-user thread
        detail budget and may answer `429`; it never counts or scans the whole history.
      parameters:
        - $ref: '#/components/parameters/MessageIdQuery'
      responses:
        '200':
          description: The chronological bounded window containing the anchor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageContextResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/messages/search:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    get:
      tags: [messages]
      operationId: searchThreadMessages
      summary: Search messages in one thread
      description: |
        Room members may search it. An `ADMIN` outside the room can search public and restricted visible rooms. Other callers and an unknown
        thread number get the uniform `404`. Returns a flat page of live message hits from this thread; deleted tombstones and the thread title are never searched or returned. Search is case- and
        accent-insensitive except that an exact phrase preserves accents, punctuation and spaces.

        With `syntax=structured`, `in:` must resolve to this room, while `owner:` and `with:` test the selected thread. `from:`, date,
        text, link, reaction and emoji clauses test each returned message. `has:pin` alone returns pinned messages only; when combined
        with another message clause, a thread pin also admits messages that satisfy those other clauses. Clauses remain AND-combined.

        - Sortable field: `id` only. Default `-id` (newest first).
        - At most 20 hits per page. Each hit contains a plain-text snippet with matching runs marked; render it as text, never HTML.
        - Uses the shared search rate limit, concurrency cap and deadline; a refused, busy or timed-out search is `429`.
      parameters:
        - $ref: '#/components/parameters/MessageSearchQ'
        - $ref: '#/components/parameters/SearchSyntax'
        - $ref: '#/components/parameters/SearchTimeZone'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/SearchPageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A flat page of matching live messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSearchPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/MessageIdPath'
    get:
      tags: [messages]
      operationId: getMessage
      summary: Get a message
      description: |
        A member of the room or an `ADMIN`. A message is addressed through its room (API-RES-006 allows two path parameters at most):
        an unknown message, a DELETED one and a message of another room are the same `404`, as is a non-member's.
      responses:
        '200':
          description: The message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [messages]
      operationId: editMessage
      summary: Edit a message
      description: |
        The message's AUTHOR while still a member of the room; nobody else edits it, a room owner and an `ADMIN` included (they may
        delete, never edit). Checked in this order: visibility (`404`), the message (`404` when it is unknown, deleted or of another
        room) and the author rule (`403`) on a lock-free read of the author, the body (`400`), then under the room lock the guard, the
        message and the author rule again on the fresh rows, an archived room (`409` of type `urn:adder:problem:room-archived`) and a
        closed thread (`409` of type `urn:adder:problem:thread-closed`).

        The body rules are those of the post. The message's quote (`quote`) is set when it is posted and cannot be added, changed or
        removed by an edit: the request has no `quotedMessageId`, so naming one is a `400`; the quote stays through the edit. Sending the body the message already has (after normalising) is `204` with no write and
        no audit line. Otherwise a revision preserves the previous body in the same transaction, the body is overwritten, and
        `editedAt` is set. `messageCount` and the activity order are untouched. Only the people the edit NEWLY addresses are
        notified: addressed by the new body, by name or through a team,
        the watchers, here or everyone, and not by the old one; team, watcher and everyone recipients are read as of the edit. A kept
        `<@here>` token preserves the recipient snapshot taken when it was introduced and addresses nobody again; removing it deletes that
        snapshot, and adding it in a later edit takes a new snapshot of recently active visible tabs. A person who held a less specific
        notice of the message gets a fresh one in its place, and the notification of a
        mention the edit removed or made less specific is relabelled in place to the next reason that applies (`THREAD_REPLIED` when the person
        watches the thread, `THREAD_CREATED` for an opening message) or, for anybody else, is deleted; an edit as such notifies nobody. An
        edit that newly addresses more than 20 people counts as a wide event; a relabel alone does not. Last writer wins: the author alone writes it and the room lock serialises their own requests.
        The body is at most 64 KiB (`413` beyond it). Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '204':
          description: Saved, or nothing changed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Delete a message
      description: |
        The message's AUTHOR while a member, the room's OWNER or an `ADMIN` (a non-member is the uniform `404`, any other member `403`).
        A moderator removal exists because incident chat leaks credentials and the author may be asleep. Checked like the edit
        (visibility, the message and the remover rule on a lock-free read, then again under the room lock), then an archived room
        (`409` of type `urn:adder:problem:room-archived`) and a closed thread (`409` of type `urn:adder:problem:thread-closed`: a
        moderator's delete included; a steward reopens the thread, deletes and closes it again).

        The body is scrubbed, all revisions are removed, the row is marked deleted and `deleted_by` records the caller. The message stays in the thread's list
        as a tombstone (`deletedByModerator` tells an author's own delete from a moderator's); `messageCount` never goes down. Every
        notification about the message is deleted with it. A deleted message is `404` for every further read or write.
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/messages/{messageId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/MessageIdPath'
    get:
      tags: [messages]
      operationId: listMessageRevisions
      summary: List a message's edit history
      description: |
        The message's author while a room member, a room owner, or an `ADMIN` with access to the room can read prior bodies.
        Room visibility and a live message in an active thread in that room are required (`404`).
        Other room readers receive `403`. History is readable in closed, archived, and merged conversations when these checks pass.
        A message with no saved history returns an empty page. Recording starts with the first real edit after the upgrade.
        Deleting the message removes its saved bodies. Revisions never include the current body.
        Sortable field `id`. Default `-id` (newest revision first). The route shares the `chat-read` budget and serves `Cache-Control: no-store`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of earlier message bodies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageRevisionPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/messages/{messageId}/link-preview:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/MessageIdPath'
    post:
      tags: [messages]
      operationId: previewMessageLink
      summary: Preview an external message link
      description: |
        A reader of the room may explicitly request a bounded preview for an external URL that is a link, image or autolink in the
        current live message. Merely reading or hovering a message never calls this operation. The message and URL association are
        checked before and after the outbound work, so an edit, deletion or access loss cannot release a stale preview. An unknown,
        deleted or foreign-room message and a non-reader are the same `404`.

        A syntactically valid link that the guarded fetcher does not support, or an unavailable upstream, returns `200` with
        `kind: UNAVAILABLE`. Invalid input or a URL absent from the current message is `400`. Calls ride a per-user bucket of 20 per
        minute and one preview may be in flight for a caller (`429` beyond either bound). The response is generated on demand and
        carries `Cache-Control: no-store`. The compact request has a 16 KiB transport ceiling (`413` beyond it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkPreviewRequest'
      responses:
        '200':
          description: The preview, or a stable unavailable result
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkPreviewResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/pins:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [threads]
      operationId: listRoomPins
      summary: List a room's pinned threads and messages
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, then the parameters are checked: `400`).

        A pin is of a whole thread (`kind` `THREAD`, `message` `null`) or of one message (`kind` `MESSAGE`, `message` the ordinary
        message as `GET /rooms/{id}/messages/{messageId}` answers it). A room holds at most 50 pins, so one page of 50 is the whole set;
        the answer is still the paged envelope. Every pin says who made it (`pinnedById`, `pinnedByName`: the name is read now) and when.
        A thread's `threadTitle`, `threadStatus` (the status KEY) and `threadClosed` are as the thread reads now. A deleted message has
        no pin: it leaves the list in the delete's own transaction.

        - Sortable fields: `id`, `pinnedAt`. Default `-pinnedAt,-id` (the newest pin first; pins made in the same millisecond list the later one first). No filter.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of pins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPinPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/pin:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadPin
      summary: Pin or unpin a thread
      description: |
        Any MEMBER of the room (a non-member is the uniform `404`; an `ADMIN` outside the room reads the pins but is `403` here, like
        every other write of speech). Checked in this order: visibility (`404`), the member rule (`403`), the body (`400`), then under
        the room lock the guard again on the fresh caller, the thread (`404`), an archived room (`409` of type
        `urn:adder:problem:room-archived`), the state the thread already has (`204`, nothing written, no live hint, no audit line) and,
        when pinning, the room's 51st pin (`409` of type `urn:adder:problem:pin-limit`; unpinning is never refused).

        A closed thread CAN be pinned: a pin is the room's, and "pin the thread that explains what happened" is the use. A pin is not
        activity: it moves no activity order and writes no history entry. A single-value set: the last writer wins.
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
      responses:
        '204':
          description: Pinned or unpinned, or already so
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/messages/{messageId}/pin:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/MessageIdPath'
    put:
      tags: [messages]
      operationId: setMessagePin
      summary: Pin or unpin a message
      description: |
        The same set as `setThreadPin`, for one message. Any MEMBER of the room; the order is visibility (`404`), the member rule
        (`403`), the body (`400`), then under the room lock the guard again, the message (`404` when it is unknown, DELETED or of
        another room), an archived room (`409` of type `urn:adder:problem:room-archived`), the state it already has (`204`, nothing
        written) and the room's 51st pin (`409` of type `urn:adder:problem:pin-limit`). A message of a closed thread can be pinned.
        A message and its thread can both be pinned. Deleting the message removes its pin.
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
      responses:
        '204':
          description: Pinned or unpinned, or already so
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/messages/{messageId}/reaction:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/MessageIdPath'
    put:
      tags: [messages]
      operationId: setMessageReaction
      summary: Add or remove the caller's own reaction of one emoji
      description: |
        A MEMBER of the room speaks (a non-member is the uniform `404`; an `ADMIN` who is not a member is `403`, and joins through the
        Members page first). A single-value set with a body, like a thread's `status` and `owner`: the emoji is chosen text and must not
        travel in a path (API-RES-006 allows two path parameters at most, and every `path` field of a log line would carry it).
        Checked in this order: authentication (`401`), the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before
        any guard, so a refused write costs a token), visibility (`404`), the member rule (`403`) before the body, the body (`400`, a
        fixed detail that never echoes what was sent), then under the room lock the message (`404` when it is unknown, deleted or of
        another room), an archived room (`409` of type `urn:adder:problem:room-archived`), a closed thread (`409` of type
        `urn:adder:problem:thread-closed`: reopen it first), the state it already has (`204`, nothing written, no hint, no audit line)
        and the limits (`409` of type `urn:adder:problem:reaction-limit`: a 21st distinct emoji on the message, or a 6th emoji of the
        caller's on it; joining an emoji already on the message is never the first, and removing is never refused).

        `emoji` must be ONE emoji in its one fully qualified spelling: 1 to 32 UTF-16 units and at most 10 code points, exactly one extended
        grapheme cluster, and then a flag (a PAIR of regional indicators), a keycap (`0-9`, `#` or `*`, the variation selector, the
        combining keycap: the selector is required), one of the three tag flags (England, Scotland, Wales) or one or more elements joined by single zero-width joiners
        (never first, last or doubled), each element an emoji followed by nothing, by one skin tone (after an emoji that takes one) or by its
        variation selector once (only after an emoji that has no emoji presentation of its own: a heart needs it, a thumbs up refuses it).
        A digit, a letter, a heart without its variation selector, two emoji, an emoji with a combining accent, a stray selector, joiner, skin
        tone or regional indicator, or any other arrangement of the same code points is `400`, so one emoji has one stored value. It is stored
        as sent. What the rule cannot check is membership of the official emoji list.
        That rule judges ADDING (`reacted: true`). Removing (`reacted: false`) looks the value up as stored and checks only the bounds
        (1 to 32 units, at most 10 code points), so a value an earlier rule let in stays removable.

        A reaction is speech, not activity: it does not bump the rail or make the thread unread. The first reaction this caller leaves on
        the message creates one `REACTION_ADDED` notice for its author (subject to mute and notification preferences); more emoji from the
        same caller keep that one notice, and removing their last reaction removes it. A self-reaction is silent. The change is announced
        by one `message.reaction_changed` hint. `reacted: true` adds the caller's reaction, `false` removes it. Like every write of the room,
        it waits at most about
        3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '204':
          description: Set, or already as requested
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/messages/{messageId}/reactors:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/MessageIdPath'
    get:
      tags: [messages]
      operationId: listMessageReactors
      summary: List every person who chose one reaction
      description: |
        Returns the full paged roster behind one reaction summary, ordered by reaction time and then user id. `reactionKey` is the opaque
        key from `ReactionSummary`; the emoji itself never enters the URL. A reader who cannot see the room or message receives the same
        `404` as the message read. A key that is well formed but does not name a current reaction of the message is `404`.

        Standard list rules apply. Sortable field: `createdAt`; default `createdAt` ascending, with user id as the stable tie-breaker.
      parameters:
        - name: reactionKey
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          description: The opaque key of the reaction summary whose people are requested.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: One page of reactors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactorPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/home:
    get:
      tags: [home]
      operationId: getHome
      summary: Get the caller's personal Home dashboard
      description: |
        Returns up to five items per section. All sections are scoped to rooms the signed-in caller currently belongs to, including
        for administrators. Recent quotes are replies from other people to the caller's messages, newest first. The quote list is
        independent of notification preferences and includes read items. Owned threads are open threads in active rooms, newest
        activity first. Watched threads put unread threads first, then sort by latest activity. Owned rooms with pending join requests
        appear first. Within each group, active rooms precede archived ones and the most recently active rooms come first.
        The per-user chat-read bucket and bounded thread-list read limiter apply.
      responses:
        '200':
          description: The caller's dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/search:
    get:
      tags: [threads]
      operationId: searchRooms
      summary: Search the threads and messages of all the caller's rooms
      description: |
        The same full-text search as `GET /api/v1/rooms/{id}/search` (the matching, the snippets, the item and the page envelope are
        identical, and each hit says which room it is from) over every room the caller is an ACTIVE member of, an archived one included
        (`roomArchived: true`) and a deleted one never. Any authenticated caller; there is no room in the request, so there is no `404`.
        **The scope is membership and nothing else, an `ADMIN`'s too**: an `ADMIN` finds hits only in the rooms they belong to (they can
        still search any single room through `GET /api/v1/rooms/{id}/search`). A caller who belongs to no room gets an empty page. A room
        the caller is removed from is gone from the next request.

        Checked in this order: authentication (`401`), the per-USER `search` bucket of 60 per minute, shared with the room search
        (`429`; spent before anything else, so a refused search costs a token too), the parameters (`400`: no room is looked at first),
        then the query.

        - Plain `q` (when `syntax` is omitted; REQUIRED unless `watching=true`, `unread` is given, or a `threadTag` is given; 2 to 100 code points after trimming, at least one letter or digit, no
          control characters; repeating it is a `400`): case- and accent-insensitive, every term required within ONE message or the title, a term of three or more characters
          matches as a PREFIX, no operators. Exactly as the room search documents it.
        - `syntax=structured` makes `q` required and enables the same clauses as room search. `in:` narrows the set of rooms the
          caller already belongs to. `timeZone` supplies the time zone of calendar dates.
        - `closed` (strict `true` or `false`, on the status category; omitted = both; a repeated key is a `400`).
        - `watching` (strict `true` or `false`; a repeated key is a `400`) keeps the threads the CALLER watches (`PUT .../watch`), or, with
          `false`, the ones they do not. **In plain mode, `q` is optional with `watching=true` or a `threadTag`** (below): with `watching=true` that is the cross-room "Threads I watch" view,
          every thread the caller watches in the rooms they are an ACTIVE member of (the view starts from those rooms, never from the
          watches: a deleted room's watches are never listed), newest activity first by default, with NO query: each hit has `messages:
          []`, `matchCount: 0` and its title as one segment with `hit: false`. A blank `q` counts as none there; a given `q` is
          validated as ever. Without `watching=true` (omitted, or `false`), an `unread` filter, or a `threadTag` a missing `q` is a `400`. The deadline and
          the cap on concurrent searches apply to it unchanged.
        - `unread` (strict `true` or `false`; a repeated key is a `400`) uses the CALLER's independent read floor in each room and combines
          with every other filter. **In plain mode, an `unread` filter makes `q` optional**: `true` is every unread thread in the rooms where the
          caller is an ACTIVE member, with no message-level matches. It never widens the membership-only global scope.
        - `threadTag` (repeatable, any-of, at most 20 distinct; as on the room search and the thread list) keeps the threads that carry any of these
          CURATED tags, retired ones included. **A tag alone is a valid search**: every thread tagged so in the rooms the caller is an ACTIVE member
          of, newest activity first by default, with NO query (each hit has `messages: []`, `matchCount: 0` and its title as one segment with `hit:
          false`). The tag never widens the scope: the view starts from the caller's rooms (a tag has no room of its own), so a thread of a room the
          caller is not in is never listed, whatever tags it carries, an `ADMIN` included. A tag no thread carries, or one the registry never held,
          is an empty page. Every hit carries its own `tags`.
        - Sortable fields: `lastActivityAt`, `createdAt`, `id`. Default `-lastActivityAt` (`id` ascending breaks ties). `pageSize` is at
          most 20 (default 20; `400` beyond).

        `total` counts matching threads across the caller's rooms. `status` is the status KEY of the thread's own room: this response does
        not carry a room's workflow, so a client shows an open or closed badge from `closed` (`GET /api/v1/rooms/{id}/workflow` holds
        the labels and colours). The search is one read under ONE deadline for all its statements (5 seconds by default): a search past it
        is answered `429` of type `urn:adder:problem:search-timeout` with `Retry-After: 2`, audited without the term (narrow the query).
        At most 4 searches run in the server at once (both search operations together): another is refused at once with `429` of type
        `urn:adder:problem:search-busy` and `Retry-After: 1` (the server is loaded; retry shortly, nothing to narrow). The cost is linear
        in the messages of the caller's rooms: a word that matches nothing reads them all. The term appears in no log line and in no
        problem body. Results are not live.
      parameters:
        - $ref: '#/components/parameters/SearchQ'
        - $ref: '#/components/parameters/SearchSyntax'
        - $ref: '#/components/parameters/SearchTimeZone'
        - name: closed
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/ThreadWatchingFilter'
        - $ref: '#/components/parameters/ThreadUnreadFilter'
        - $ref: '#/components/parameters/ThreadCuratedTagFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/SearchPageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of matching threads, each naming its room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadSearchPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List the caller's own notifications
      description: |
        Any authenticated caller, no further guard: the list is the caller's OWN notices, so there is nothing to hide and
        nobody to probe. Up to 5,000 unseen notices are retained per recipient across rooms and channels. The oldest available
        unseen notices expire first and their pending email or browser delivery is cancelled. Existing backlogs above the limit
        are reduced in batches after supported upgrade or rollback recovery. A notice is listed only while its recipient is an ACTIVE member of its room and the room is active (a deleted
        room's notices are hidden; an archived room's are listed, and its link opens it read-only), **an `ADMIN` included**: an `ADMIN`
        who is not a member of a room has none of its notices. A member who is removed from a room, or leaves it, loses that room's
        notices for good (they are deleted with the membership, so rejoining starts clean), and a deleted message, or a mention an edit
        removed, takes its notice with it. A caller who belongs to no room gets an empty page.

        A notice is made INSIDE the write that caused it, one per person and event, labelled with the most specific reason
        (`NotificationType`, fourteen thread kinds). The writes make these: `MENTIONED` (a post, a thread's opening message or an edit that
        newly mentions the caller with `<@id>`; never for a mention of oneself), `MESSAGE_QUOTED` (a post that quotes a message of the caller's;
        never for quoting one's own message, and not for a caller who is no longer an active member of the room; an edit of that post can
        also make it, when it newly names a group the caller is in and they hold no notice of it, or turn the caller's `MENTIONED` notice
        into it when the edit drops the `<@id>` mention), `THREAD_REPLIED` (a reply in a thread the caller watches),
        `THREAD_CREATED` (a new thread in a room the caller is a member of), `THREAD_ASSIGNED` and `THREAD_OWNER_CHANGED` (a hand-over: the
        new owner, and the thread's other watchers; nothing for a steward who takes the thread themself), and `THREAD_STATUS_CHANGED`,
        `THREAD_CLOSED` and `THREAD_REOPENED` (a status move of a thread the caller watches); the four group-mention kinds (a team, the
        watchers, here or everyone) are named so a client can show them as the writes that make them arrive. An actor is never notified of their
        own write. An event that would notify more than 20 people counts against the actor's daily wide-event budget
        (`notifications.maxBroadcastsPerActorPerDay`); over it the write still succeeds and only the people named directly are notified. Each
        notice reaches the caller's open tabs as the live `notification.created` event, on every socket the caller has, subscribed to the
        room or not; the SPA then re-reads this list. Notices older than the retention (90 days by default) are deleted.

        Channels are judged when the notice is made: a kind the caller switched off IN THE APP (`PUT .../notification-preferences`) makes
        no row for them (or a mail-only row, never listed here, when its email is on), so this list, its `total` and `seen-all` hold only
        notices that show in the app.

        An item holds ids only on the server: `actorName`, `roomName` and `threadTitle` are read when the page is read, so a rename shows at
        once and nothing stored can outlive a leave or a delete. `messageId` is `null` for every thread-level kind (the hand-over and status kinds).

        - Sortable fields: `id` (time order), `createdAt`. Default `-id` (newest first; `id` breaks ties).
        - Filters: `seen` (strict `true` or `false`; omitted = both; a repeated key is a `400`); `type` (repeatable, any-of: only notices of
          these kinds; omitted = every kind; each distinct name at most once; an unknown name is a `400`).
        - **Bounds.** The per-USER `notification-read` bucket of 240 per minute (`429` beyond it; spent before the paging checks), and the
          same per-request deadline and in-flight caps as the thread list (`urn:adder:problem:read-timeout`, `read-busy`). A page whose count
          is 0 reads no rows. Each `notification.created` event makes every open tab re-read the list up to three times (the badge, the
          addressed count and, with the drawer open, its page).
        - A notice of a kind this server does not know is not listed and not counted.
        - `total` is CAPPED at 1000: the server counts at most 1000 rows, so a recipient with more notices than that (or more unseen ones)
          reads `1000`, and the bell shows it as "many". A page that starts at row 1000 or later (`(page - 1) * pageSize >= 1000`) is EMPTY
          (`items: []`, `total` as above): the server never skips that many rows.
      parameters:
        - name: seen
          in: query
          required: false
          schema: { type: boolean }
          description: '`true` = only seen notices, `false` = only unseen ones; omitted = both.'
        - name: type
          in: query
          required: false
          description: 'Repeatable, any-of; duplicates collapse; an unknown name (case-sensitive) is a `400`; omitted = every kind; at most 14 distinct.'
          schema:
            type: array
            minItems: 1
            maxItems: 14
            items: { $ref: '#/components/schemas/NotificationType' }
          style: form
          explode: true
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of the caller's notices, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/feed:
    get:
      tags: [notifications]
      operationId: listNotificationFeed
      summary: List the caller's notifications, including room membership notices
      description: |
        The caller's own in-app notices, while they are a member of the active room. Uses the same visibility, retention,
        `notification-read` rate bucket (240/minute), and read deadline as `GET /api/v1/notifications`. A caller who belongs
        to no room gets an empty page. An administrator sees only their own notices.

        `ROOM_ADDED` is made when another person adds the caller to a room, including via a team or by approving a join request.
        It has no thread or message. Removal or leaving deletes the notice with the membership. Old clients may continue to
        use `GET /api/v1/notifications` for the thread-only representation. Both lists use the same seen operations.
        An add of more than 20 people uses the actor's daily wide-event budget. After exhaustion only the first 20 named
        recipients are considered for a notice. Membership changes still succeed for the whole audience.

        With `groupReplies=true`, the server takes at most 5,000 candidates from each current active room and groups only the newest
        5,000 unseen `THREAD_REPLIED` notices across those rooms before counting and pagination. Older eligible replies remain unseen
        and surface after newer groups are cleared; retained history of an inactive room is excluded. Individually addressed mentions
        and quotes, seen history, and every other kind remain individual. A group points to its oldest included message and carries
        the inclusive oldest/newest raw notice ids (`replyFloorId`/`replyCeilingId`) used by the group-seen action.

        Workflow notices linked to history include `change` with the previous and next status labels or owner names.
        An unseen notice refreshed by another change of the same kind describes that latest change.

        - Sortable fields: `id` and `createdAt`. Default `-id` (newest first; `id` breaks ties).
        - Filters: `seen` (strict boolean) and repeated `type` (any-of, duplicates collapse, unknown names are rejected).
        - `total` is capped at 1000. Pages starting at row 1000 or later are empty.
      parameters:
        - name: seen
          in: query
          required: false
          schema: { type: boolean }
          description: '`true` = only seen notices, `false` = only unseen ones; omitted = both.'
        - name: type
          in: query
          required: false
          description: Repeatable. Omitted includes every kind.
          schema:
            type: array
            minItems: 1
            maxItems: 15
            items: { $ref: '#/components/schemas/NotificationFeedType' }
          style: form
          explode: true
        - name: groupReplies
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Collapse eligible unseen plain replies per room and thread within the shared unseen retention limit.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of the caller's notification feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationFeedPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/push/config:
    get:
      tags: [notifications]
      operationId: getBrowserPushConfig
      summary: Discover whether this deployment supports browser push
      description: |
        Any authenticated caller. The public VAPID key is returned only when all server-side push settings are valid. When
        `subscriptionId` is supplied, `registered` reconciles that opaque browser id against the caller, current credential revision,
        active account, and 90-day subscription lifetime. Unknown, expired, disabled, stale-revision, and other-caller ids all return
        `registered: false` without disclosing which condition applied.
      parameters:
        - name: subscriptionId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1 }
          description: Optional caller-held browser subscription id to reconcile; when omitted, `registered` is absent.
      responses:
        '200':
          description: Browser push capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserPushConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/push/subscriptions:
    post:
      tags: [notifications]
      operationId: subscribeBrowserPush
      summary: Opt this browser in to generic push notifications
      description: |
        Registers or refreshes one HTTPS endpoint from an allowlisted browser push provider. The endpoint is encrypted at rest;
        only its SHA-256 digest is used for uniqueness. A caller may hold at most five browser subscriptions. Registration starts
        with notices created afterwards and never replays notification history. Uses the notification-preferences rate bucket.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserPushSubscriptionRequest' }
      responses:
        '200':
          description: Registered, or the caller's same endpoint refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserPushSubscription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Browser push is not configured
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/push/subscriptions/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    delete:
      tags: [notifications]
      operationId: unsubscribeBrowserPush
      summary: Stop browser push for one caller-owned subscription
      description: Idempotent and caller-scoped. Another user's id is indistinguishable from an absent id. Uses the notification-preferences rate bucket.
      responses:
        '204': { description: 'Removed, not owned by the caller, or already absent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/reply-groups/{roomId}/{threadNumber}/seen:
    parameters:
      - name: roomId
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
      - name: threadNumber
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    post:
      tags: [notifications]
      operationId: markNotificationReplyGroupSeen
      summary: Mark one grouped reply snapshot seen
      description: |
        Idempotently marks only the caller's unseen in-app `THREAD_REPLIED` notices in this room/thread from `fromId` through `throughId`.
        Replies outside that inclusive snapshot range, other threads and addressed notice kinds remain unseen. A missing or already-cleared group
        is a `204`, so the tuple discloses nothing. Uses the per-user `read-state` rate bucket and emits no audit or live event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fromId, throughId]
              properties:
                fromId: { type: integer, format: int32, minimum: 1 }
                throughId: { type: integer, format: int32, minimum: 1 }
      responses:
        '204': { description: 'Marked, already marked, or no matching caller-owned group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/seen-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsSeen
      summary: Mark every unseen notification of the caller seen
      description: |
        Any authenticated caller: every retained unseen notice of the caller. A `204` even when none was unseen. Rides the per-USER
        `read-state` bucket of 240 per minute (`429` beyond it; spent before anything else). View state: it is not audited and emits no
        live event; the caller's other tabs of the same browser re-read the bell count (a `BroadcastChannel`, no server part), other devices catch up on focus. No request body.
      responses:
        '204':
          description: Marked (or nothing was unseen)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/{id}/seen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [notifications]
      operationId: markNotificationSeen
      summary: Mark one notification seen
      description: |
        Any authenticated caller, scoped to their OWN notices: someone else's notice is the same `404` as one that does not exist (there
        is no `403` to probe with). Seen again is a `204` that changes nothing. Rides the per-USER `read-state` bucket of 240 per minute
        (`429` beyond it; spent before anything else, so an id sweep costs tokens). View state: it is not audited and emits no live
        event. No request body.
      responses:
        '204':
          description: Marked (or already seen)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/users/{id}/notification-preferences:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: Read a user's notification switches, in the app and by email (target user or ADMIN)
      description: |
        Which kinds of notice reach the user, and how: `kinds` lists the thread kinds in the order of `NotificationType`, with their `inApp`
        switch (the notice shows in the bell; on unless the user switched it off) and its `email` switch (the kind joins the digest below;
        **off unless the user switched it on**, for every kind: email is opt-in since 1.1.0). A person who never saved a choice has the
        defaults; there is no master switch and no kind is locked on. `emailAvailable` is false on a deployment with no outbound email
        (`MAIL_TRANSPORT=disabled`): the email switches are stored but nothing is mailed. Account email (the MFA code, the password-reset
        link) is not a kind: it is sent directly and always goes. `roomMembership` holds the same two switches for `ROOM_ADDED`.

        **Changed in 1.1.0 (an accepted exception to API-VER-002, `product.md` 1.1 D7 and A28):** email is off by default for every kind, so
        a person who never saved a choice, and a 1.0.0 client's `{"disabled": []}` ("everything on"), now mean every email OFF.

        **The digest.** A notice still unseen after 5 minutes by default (`notifications.email.delaySeconds`) is mailed, at most one email
        per person per 15 minutes (`notifications.email.minIntervalSeconds`; a person inside it gets everything in one later email),
        in the person's language. The email names WHO did it, the room, the applicable thread number and a link; it never carries a thread title or any
        message text. A notice is mailed at most once and never when it is older than a day, when the person has left the room or been
        deleted, or when its kind's email switch is off at that moment. One actor can make at most 20 distinct people a day
        (`notifications.email.maxRecipientsPerActorPerDay`, UTC days) eligible for the digest, whatever the kind:
        over that budget the in-app notice is still made and only its email is withheld.

        **Target user or `ADMIN`** (`403` otherwise, before anything else is read); an unknown or deleted user is `404`. Unbucketed.
      responses:
        '200':
          description: The user's switches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [notifications]
      operationId: setNotificationPreferences
      summary: Replace a user's notification switches (target user or ADMIN)
      description: |
        A **wholesale replace** of the user's choices: `disabled` lists the `(type, channel)` pairs that are OFF, `enabled` (optional) the
        pairs that are ON, and a pair in neither takes its default (in the app on, by email off, for every kind). So `{"disabled": []}`
        resets everything to the defaults and a client that only knows `disabled` can never switch an email on by accident. Channels are
        `IN_APP` and `EMAIL`. The optional `roomMembership` object sets those switches for room additions and approvals. Omitting it restores
        their defaults as part of the replacement. **Changed in 1.1.0:** email is off by default for every kind, so a body that lists nothing switches every email
        off; and a client that omits `enabled` and the `IN_APP` pairs (a 1.0.0 page) resets those to the defaults (accepted, `product.md` 1.1 A28
        and A31). Order of refusals: `403` (not the target user and not `ADMIN`), then `400` (an unknown kind or channel, a pair
        listed twice or in both lists), then `404` (an unknown or deleted user). A same-state PUT is a `204` that changes nothing. Audited as
        `user.notification_preferences_changed` (`from` and `to` list the choices that differ from the defaults, as sorted
        `TYPE:CHANNEL=on|off`) on an actual change only. A switch applies to notices made (in the app) or mailed (email) from then on; it never
        rewrites a notice that exists. Rides its own per-user `notification-prefs` bucket (30 a minute, checked before the guards; `429` with `Retry-After`); the body is capped at 16 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesUpdate'
      responses:
        '204': { description: Replaced (or already so) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/live/tickets:
    post:
      tags: [live]
      operationId: mintLiveTicket
      summary: Mint a single-use ticket for the live-update WebSocket
      description: |
        Any authenticated caller, no further guard: a ticket proves nothing about any room, subscriptions are judged per room when they are
        made. The ticket (43 base64url characters) is bound to the caller and to the access token that authenticated this call, is valid
        for 30 seconds and works ONCE: the socket sends it in its FIRST FRAME and never in a URL (API-AUTH-002), so it is not logged by
        any proxy. The socket closes when that access token expires, and the client mints again. An exchange rather than a creation, so
        `200`, not `201`. No request body.

        Rides the per-USER `live-ticket` bucket of 60 per minute (`429` beyond it; spent before anything else). The server holds at most
        `live.maxTickets` (10,000) unexpired tickets in the deployment database. When the shared store is full, minting returns
        `429` with `Retry-After: 30` (audited `live.ticket_saturated`). The ticket can be redeemed by an instance using that database
        and the same authorization settings. The supported deployment still runs one application instance.
        The caller may hold up to 16 authenticated sockets by default (`LIVE_MAX_SOCKETS_PER_USER`) across instances using
        the same deployment database. A mint beyond
        that is a `429` of type `urn:adder:problem:live-socket-limit` with `Retry-After: 60` (nothing is minted). While the server is
        stopping, already holds its maximum of sockets, or its notification listener has been down for more than 10 seconds (hints would reach nobody; the
        open sockets are closed 1013 too), or while the ticket or authenticated socket lease store is unavailable, minting returns `503` of type
        `urn:adder:problem:live-unavailable` with `Retry-After`.
      responses:
        '200':
          description: The ticket and its expiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveTicketResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/LiveUnavailable' }
  /api/v1/live:
    get:
      tags: [live]
      operationId: connectLive
      summary: Open the live-update WebSocket
      description: |
        A WebSocket upgrade (`GET` with `Connection: Upgrade` and `Upgrade: websocket`); `101` is the only success. The route is public at the HTTP
        layer (`security: []`): the socket authenticates in-band, by its FIRST FRAME, a ticket minted by `mintLiveTicket`. The ticket never travels in
        the URL (API-AUTH-002) and the `Authorization` header never reaches the socket. A plain (non-upgrade) `GET` answers `400` after admission.

        **Admission, in order:** the per-IP `live-connect` bucket (600 a minute, `429` with `Retry-After`; it comes FIRST, so a refused request costs a
        token too); the `Origin` header (REQUIRED, `403`): its scheme must be `http` or `https` AND equal the request's own scheme, and its authority
        must equal the request's own host and port (default ports dropped, case-insensitive) or be listed in `http.corsHosts` (a `Host` header whose port is
        not a number is a `403` too); a stopping server, a full socket table, too many unauthenticated sockets from the caller's address (8 by default;
        an IPv6 address counts by its /64) or in total (`503` of type `urn:adder:problem:live-unavailable` with `Retry-After`); otherwise `101`. A browser hides a refused handshake's status from the page, so
        everything the client must act on goes on the ticket mint or into a 4xxx close code below.

        **Frames** are JSON text frames of at most 8 KiB; the client ignores unknown server frame types and fields; the server is strict
        (`LiveClientFrame`). Client to server: `{"type":"auth","ticket":"..."}` (the first frame, within 2 seconds, exactly once),
        `{"type":"subscribe","roomIds":[...]}` and `{"type":"unsubscribe","roomIds":[...]}` (1 to 128 positive ids), `{"type":"ping"}`. Server to
        client (`LiveServerFrame`): `ready` (after a good ticket; `maxSubscriptions` is 128), `subscribed` (the answer to ONE `subscribe` frame: which of its ids are now subscribed, which are `refused`
        and which are `capped` over the per-socket limit; `refused` deliberately mixes "no such room" with "not readable", like the REST `404`),
        `event` (a hint), `revoked` (the room is no longer readable, because the caller was removed from it or it was deleted: the subscription is gone, at once), `resync` (a gap: refetch everything) and `pong`.

        **Close codes:** 1000 normal; 1001 the server is stopping (reconnect after a random 1 to 5 seconds); 1003 a binary frame; 1008 a malformed,
        unknown or over-long frame, a frame before `auth`, a second `auth`, or more than 30 frames in 10 seconds; 1009 a frame over 8 KiB; 1011 an
        internal error; 4001 the access token that minted the ticket expired (mint again at once); 4003 that token was revoked, or the account
        changed (logout, deletion, password or role change), at redemption or within a minute after it (mint again; the client's refresh or
        sign-out follows); 4401 no ticket by the deadline, or an unknown, expired or used one; 4429 the per-user socket cap (16)
        was reached (pause, retry in 60 seconds); 1013 the server's socket table filled between the upgrade and the redemption, too many
        unauthenticated sockets were open, the shared ticket or socket lease store was unavailable, a socket lease expired, or the notification listener has been down for more than 10 seconds (try again with backoff). A server ping every 25 seconds keeps the connection open through proxies; a visible, authenticated
        socket is never closed for being quiet.

        **Events** (`event.kind`, `LiveEventKind`; the wire name equals the audit event of the write): `room.created`, `room.updated`,
        `room.archived`, `room.unarchived`, `room.deleted`, `room.member_added`, `room.member_role_changed`, `room.member_removed`,
        `room.workflow_updated`, `thread.created`, `thread.updated`, `thread.deleted`, `thread.merged`, `thread.status_changed`, `thread.owner_changed`
        (thread events carry `threadNumber`
        for the thread kinds), `message.posted`, `message.edited`, `message.deleted` and `message.reaction_changed` (these carry `threadNumber` and `messageId`),
        `room.pin_changed` (a pin or unpin; it carries `threadNumber`, and `messageId` for a message pin) and `notification.created`
        (`threadNumber`, and `messageId` for a mention; only the people it is for hear it). An event says
        THAT something changed, never what: it carries ids only, and the client refetches through the ordinary REST reads, so authorization stays
        where it is. **Delivery semantics:** a socket receives the events of the rooms it is subscribed to, in commit order per room, plus the events about
        the person itself on every socket it has, subscribed or not (`room.created` for the creator; `room.member_added` and
        `room.member_role_changed` for the person concerned; `notification.created` reaches ONLY the recipients of the new notice, on every
        socket they have, and no subscriber of the room: a mention that is posted emits `message.posted`, then `notification.created`, and a
        hand-over of a thread emits `thread.owner_changed`, then `notification.created` unless the steward took the thread themself); removal from a room and deletion of a room arrive as `revoked` instead (an `ADMIN`
        who is merely removed from a room keeps it and gets the `room.member_removed` event); delivery is
        AT MOST ONCE with no replay (a missed hint is covered by `resync` and by the refetch after each `subscribed`); an event is emitted only for
        a real change (a no-op write emits nothing); a socket gets at most one frame per hint. A user may subscribe to the rooms they can read (an
        `ADMIN`: every existing room).

        One socket per tab, at most 16 authenticated sockets per user across the shared database. Subscriptions belong to the instance serving the connection.
      security: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string }
          description: The page's origin; a missing header, a non-http(s) scheme, a scheme other than the request's own or a foreign authority is a `403`.
      responses:
        '101':
          description: Switching Protocols - the socket is open; send the `auth` frame
        '400':
          description: Not a WebSocket upgrade (a plain `GET`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: >-
            The `Origin` header is missing, malformed, foreign or of another scheme than the request's own, or the request's `Host` cannot be read
            (audited as `live.refused` with reason `origin` and a `detail`). When `http.corsHosts` is
            set, the CORS plugin refuses a foreign origin first, with a bodiless `403` and no audit line.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/LiveUnavailable' }
  /api/v1/telemetry/current:
    get:
      tags: [telemetry]
      operationId: getTelemetryCurrent
      summary: Adder's own vital signs - processes, storage, request latency
      description: |
        ADMIN only (operational data: process sizes, container limits, storage sizes), read-only, no audit event;
        both telemetry reads share one per-user rate bucket (30/min, `429`). `.claude/docs/observability.md` "Telemetry".
        `processes` lists each sampling process (role `app`) with its latest raw sample: every live process, and the
        newest stale one when none is alive (a process that stopped stays visible for a day). `stale` = no sample for more than three
        sample intervals. A figure the process could not measure is null (no container limit outside a cgroup, no `memory.peak` on an
        old kernel) - never zero; `percentOfLimit` is the cgroup working set over the container limit, in percent. `storage` is the
        newest database / per-schema size (null before the first measurement). `requests` is the latest sample interval of the live
        processes: the `*` total and the 15 busiest routes.
      responses:
        '200':
          description: The current figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCurrent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/history:
    get:
      tags: [telemetry]
      operationId: getTelemetryHistory
      summary: The trend of one telemetry section over 24 hours, 7 days or 90 days
      description: |
        ADMIN only (guard before the query is read: `403` outranks `400`), read-only, no audit event.
        `group` picks the section and `range` the span; both are required. Buckets: `24h` = the raw sample interval (widened to a whole
        multiple of it when that would exceed 400 points), `7d` = one hour (the hourly rollups plus the raw rows of the hours not yet
        rolled up), `90d` = six hours; `bucketSeconds` says which. At most 400 points per series and 40 series (`truncated` when more
        matched); a series has points only for the buckets that hold data.
        Per-process groups merge the processes of one `role` into one series, so a trend survives a restart (`memory`, `jvm`), or all
        processes into one series per route (`requests`, `role` null); `storage` is cluster-wide (`role` null). `requests` keeps the `*`
        total (count, p50, p95, 5xx, 429) and the ten busiest routes of the range (count, p50, p95). A DELTA series' `avg` is the
        bucket's TOTAL and its `max` the largest single sample interval; a GAUGE or PERCENTILE series' `avg` is the n-weighted mean and
        `max` the largest sample. `historyFrom` is the oldest instant the range can actually hold: the first sampler boot (a fresh
        install, or retention shorter than the range).
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
            enum: [memory, storage, requests, jvm]
          description: The panel section.
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [24h, 7d, 90d]
          description: How far back the history reaches.
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400. Ids are database sequences that
      # start at 1, so 0 never addresses anything (it answers 404, like any unknown id).
      schema: { type: integer, format: int32, minimum: 1 }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
      description: A user id (int32; ids start at 1).
    ThreadNumberPath:
      name: number
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
      description: A thread's per-room number (`#42`; int32, numbering starts at 1 in every room).
    MessageIdPath:
      name: messageId
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
      description: A message id (int32; ids start at 1).
    MessageIdQuery:
      name: messageId
      in: query
      required: true
      schema: { type: integer, format: int32, minimum: 1, maximum: 2147483647 }
      description: The message to anchor a chronological context window on. A repeated key is a `400`.
    IdLt:
      name: id[lt]
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 1 }
      description: Keyset filter of a message list - only rows whose `id` is below this value (the older messages). A repeated key is a `400`.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`, and so is a field named
        twice (with or without `-`) or a list longer than the whitelist. `id` ascending is
        always appended as a deterministic tiebreaker.
    DirectoryPageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      description: Rows per page for the user directory only. Defaults to 20, maximum 20 (the shared maximum is 100).
    SearchPageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      description: Rows per page for the search only (a hit carries up to three snippets). Defaults to 20, maximum 20 (the shared maximum is 100).
    Q:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 100 }
      description: >-
        Free-text search (API-LIST-005), REQUIRED where declared. Case- and accent-insensitive; the endpoint says how it
        matches (a substring, or whole words and prefixes) and what it searches. The value is trimmed before the length
        limits apply, so it needs 2 to 100 characters (code points) after trimming.
    SearchQ:
      name: q
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
      description: >-
        Search input (API-LIST-005) for either search route. With `syntax=structured`, supply a nonblank query of up to 512 code points
        and 24 clauses. With `syntax` omitted, supply plain text of 2 to 100 code points with at least one letter or digit, or omit `q`
        with `watching=true`, an `unread` filter, or a `threadTag` filter. Length is measured after trimming. Control and direction override characters are invalid.
    MessageSearchQ:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
      description: >-
        Required search input. With `syntax=structured`, supply a nonblank query of up to 512 code points and 24 clauses. With `syntax`
        omitted, supply plain text of 2 to 100 code points with at least one letter or digit. Length is measured after trimming. A repeated
        key, control character or direction override character is invalid.
    SearchSyntax:
      name: syntax
      in: query
      required: false
      schema: { type: string, enum: [structured] }
      description: |
        Omit for plain full-text search. Use `structured` for the following AND-combined clauses:

        - `word` matches a full indexed word, `prefix*` an indexed word starting with at least two letters or digits, and `"exact phrase"`
          a contiguous literal phrase. Phrase matching ignores case and preserves accents, punctuation and spaces. Prefix a text
          clause with `-` to exclude it.
        - `in:room`, `from:user`, `with:user`, and `owner:user` accept exact names or `#ID`. Quote names containing spaces.
          The person filters also accept exact email addresses. `from` selects a matching message's author,
          `with` a thread with a live message by that user, and `owner` its current owner.
        - `status:key` requires the thread's exact current workflow status key. Keys use the immutable workflow-key grammar; multiple
          status clauses are AND-combined, so different keys match nothing. A well-formed unknown key also matches nothing.
        - `hashtag:tag` requires an exact hashtag on the matching live message. A single leading `#` is optional. Matching uses the
          hashtag index's NFC, case and accent folding; it never does a partial match. Multiple hashtag clauses must hold on that same
          message.
        - `on:YYYY-MM-DD` selects the named day, `before:` selects earlier days, `after:` selects later days,
          and `during:YYYY-MM` or `during:YYYY` selects a month or year. Calendar boundaries use `timeZone`.
        - `has:pin` requires a pinned thread or matching message. `has:link` matches an HTTP(S), `www.`, or `mailto:` link.
          `has:reaction` requires any reaction, `has:reaction:👍` requires that reaction, and `has:emoji:👍` finds the literal emoji in the body.

        All message clauses, including `hashtag:`, must hold on one live message. Positive text can also match a title when no filter
        requires a message; a hashtag therefore prevents a title-only match.
        A query with only thread filters can produce hits without message snippets. Malformed clauses and unknown operators return
        `400` without echoing the query.
    SearchTimeZone:
      name: timeZone
      in: query
      required: false
      schema: { type: string, default: UTC }
      example: Europe/Warsaw
      description: IANA time zone used to interpret structured date clauses. Omit for UTC.
    TagQ:
      name: q
      in: query
      required: false
      schema: { type: string, maxLength: 50 }
      description: >-
        Free-text substring of a hashtag (API-LIST-005; the room's tag list). Unlike `Q` it is OPTIONAL and has no minimum, because a
        picker lists every tag before the user types. Case- and accent-insensitive; trimmed first; at most 50 characters (code
        points), `400` past that.
    ThreadStatusFilter:
      name: status
      in: query
      required: false
      description: Repeatable - any of these status keys (the thread list). A well-formed key that is not a status of the room matches nothing; a malformed one, or more than 20 distinct values, is a `400`.
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items: { type: string, maxLength: 40, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
      style: form
      explode: true
    MemberId:
      name: memberId
      in: query
      required: false
      description: Only what this ACTIVE user is a member of (the profile page's rooms and teams). An unknown or removed user matches nothing; anything but 1 to 2147483647 in ASCII digits (a sign, a fraction, `0`, a blank value) is a `400`.
      schema: { type: integer, format: int32, minimum: 1 }
    ThreadOwnerFilter:
      name: ownerId
      in: query
      required: false
      description: Repeatable - any of these owner ids (the thread list; "mine" is the caller's own id). An id that owns nothing matches nothing; a non-positive or non-integer one, or more than 20 distinct values, is a `400`.
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items: { type: integer, format: int32, minimum: 1 }
      style: form
      explode: true
    ThreadWatchingFilter:
      name: watching
      in: query
      required: false
      description: '`true` = only the threads the CALLER watches (`PUT .../watch`), `false` = only the ones they do not; omitted = both. Strict booleans: anything else, or a repeated key, is a `400`. Bound to the caller: it takes no user id, and a caller who is not a member watches none. On the two searches `true` also makes `q` optional (the watched-threads view; a `threadTag` does too).'
      schema: { type: boolean }
    ThreadUnreadFilter:
      name: unread
      in: query
      required: false
      description: '`true` = only the threads with something unread for the CALLER (`unreadCount` above 0), `false` = only the ones with nothing unread; omitted = both. Strict booleans: anything else, or a repeated key, is a `400`. Bound to the caller: it takes no user id, and a caller who is not a member has no read state (`true` is an empty page). On the two searches either value also makes `q` optional; global search uses the caller''s independent read floor in every room and retains its membership-only scope.'
      schema: { type: boolean }
    ThreadMentionsMeFilter:
      name: mentionsMe
      in: query
      required: false
      description: '`true` = only the threads with a live message that addresses the CALLER (names them, a team they are on now, everyone, or the watchers while they watch the thread now), `false` = only the ones without; omitted = both. Strict booleans: anything else, or a repeated key, is a `400`. Bound to the caller: it takes no user id. `mentionedId` (direct mentions of any given people) is unchanged.'
      schema: { type: boolean }
    ThreadMentionFilter:
      name: mentionedId
      in: query
      required: false
      description: Repeatable - a live message of the thread mentions any of these people (the thread list; "mentions me" is the caller's own id). An id nobody was mentioned as matches nothing; a non-positive or non-integer one, or more than 20 distinct values, is a `400`.
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items: { type: integer, format: int32, minimum: 1 }
      style: form
      explode: true
    ThreadFieldFilter:
      name: field
      in: query
      required: false
      description: >-
        Repeatable `key:value` (the thread list): the field's key, a colon, then an option key (SELECT, MULTI_SELECT) or a user id
        (USER). Any-of within one key, all-of across keys; at most 20 distinct pairs. The key must be an ACTIVE SELECT, MULTI_SELECT or
        USER field of the room; any other key, a missing colon or a value of the wrong shape is a `400`.
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          maxLength: 81
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*:([a-z][a-z0-9]*(-[a-z0-9]+)*|[0-9]+)$'
      style: form
      explode: true
    ThreadTagFilter:
      name: tag
      in: query
      required: false
      description: >-
        Compatibility alias of `hashtag`. Repeatable - any of these hashtags, without the `#`: a tag as written, or a key of the room's list as
        returned (folding can add punctuation and length, so up to 150 characters, no control characters). Folded like the stored tags
        (case and accents ignored). A tag that no live message carries matches nothing; a malformed value, or more than 10 distinct
        values after case folding, is a `400`. A request may carry at most 50 distinct raw values (more is a `400`), which must fold to
        at most 10 across both parameter names.
      schema:
        type: array
        minItems: 1
        maxItems: 50
        items: { type: string, minLength: 1, maxLength: 150 }
      style: form
      explode: true
    ThreadHashtagFilter:
      name: hashtag
      in: query
      required: false
      description: >-
        Repeatable any-of filter on message hashtags without the leading `#`. Values are folded for case and accents.
        Values under `hashtag` and `tag` are combined before deduplication. The combined limit is 50 distinct raw values
        and 10 distinct folded keys. A malformed key or exceeded limit returns `400`.
      schema:
        type: array
        minItems: 1
        maxItems: 50
        items: { type: string, minLength: 1, maxLength: 150 }
      style: form
      explode: true
    ThreadCuratedTagFilter:
      name: threadTag
      in: query
      required: false
      description: >-
        Repeatable - any of these CURATED tags (the registry's names, `GET /tag-categories`; the thread list and both searches): normalised like the tags PUT
        (trimmed, whitespace collapsed, lower-cased), 1 to 40 characters of the tag grammar. A retired tag still finds the threads that
        kept it; a well-formed name the registry never held matches nothing; a malformed value, or more than 20 distinct values, is a
        `400`. Duplicates collapse before the bound (so the raw count may exceed 20 when values repeat), and a blank value is ignored. Not the
        hashtags: those are `tag`.
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items: { type: string, minLength: 1, maxLength: 40 }
      style: form
      explode: true
    ExpectedRevision:
      name: X-Expected-Revision
      in: header
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: |
        The revision of the document the caller read (`revision`, or a room's `workflowRevision`). Missing, repeated or
        malformed is a `400`; a stale one is a `409` of type `urn:adder:problem:revision-conflict`. Every successful PUT
        bumps the revision.
  responses:
    UnsupportedMediaType:
      description: |
        Cross-cutting, answerable by ANY operation (a bodiless GET or DELETE included): a request that carries a
        `Content-Encoding` other than `identity` (a body is never decoded; the check runs before any route), or a body
        that is not `application/json`. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing, invalid or no longer valid token (revoked, or the account was deleted, demoted or re-credentialed since it was issued)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    LiveUnavailable:
      description: >-
        The live channel cannot take another socket right now: the server is stopping, holds its maximum of sockets or of unauthenticated
        sockets (in total or from the caller's address), or its notification listener is down (`urn:adder:problem:live-unavailable`). Retry after the stated seconds; every other route is unaffected.
      headers:
        Retry-After:
          required: true
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — rate-limit buckets use one fixed 60-second refill window and are shared by every application replica for the same
        authenticated user or canonical client address. The sole exception is `/api/v1/ready`: its per-address probe bucket remains local
        to the serving process, so one failed or overloaded replica cannot consume another replica's probe allowance. Successful bucketed
        responses retain Ktor's `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` headers; an exhausted window returns
        `Retry-After` rounded up to whole seconds. A shared-store failure fails closed through the standard server-error response and is
        not reported as caller throttling. Either the per-IP rate-limit bucket is exhausted (generic detail), on a telemetry read
        (`/api/v1/telemetry/**`) the per-USER telemetry bucket is exhausted (30/min), on the user directory
        (`/api/v1/users/directory`, and one entry of it, `/api/v1/users/directory/{id}`) the per-USER directory bucket (shared by both) is exhausted (120/min), on creating or
        renaming a room (`POST /api/v1/rooms`, `PUT /api/v1/rooms/{id}`) the per-USER room-name bucket (shared by both) is exhausted (30/min),
        on adding room members (`POST /api/v1/rooms/{id}/members`) the per-USER room-members bucket is exhausted (60/min), on starting a thread or posting a message
        (`POST /api/v1/rooms/{id}/threads`, `POST /api/v1/rooms/{id}/threads/{number}/messages`) the per-USER chat-post bucket (shared by both) is exhausted (120/min), on the other thread
        and message writes (the thread details, status and owner PUTs, a message edit and a message delete, the thread and message pin PUTs and the reaction PUT) and on the room-lock writes that are not a name or an enrolment write (the room archive, unarchive and delete, a member's role PUT and removal, and the room workflow PUT) the per-USER chat-write bucket (shared by all fourteen) is exhausted (240/min),
        on the thread list, the tag list and the registry read (`GET /api/v1/rooms/{id}/threads`, `GET /api/v1/rooms/{id}/tags`, `GET /api/v1/tag-categories`) the per-USER chat-read bucket (shared by all three) is exhausted (300/min), the read outruns its deadline (`urn:adder:problem:read-timeout`, `Retry-After: 2`), or the caller or the server already runs its maximum of list reads (`urn:adder:problem:read-busy`, `Retry-After: 1`; the thread read `GET /api/v1/rooms/{id}/threads/{number}` has the deadline and the caps but not the bucket),
        on the watch PUT (`PUT /api/v1/rooms/{id}/threads/{number}/watch`) the per-USER thread-watch bucket (30/min) is exhausted, on the view-state writes (the thread read-marker PUT, `POST /api/v1/rooms/{id}/seen`, and the two notification "seen" POSTs) the per-USER read-state bucket (shared by all four) is exhausted (240/min), on a tag-registry write (`POST /api/v1/tag-categories`, `PUT` and `DELETE /api/v1/tag-categories/{id}`) the registry's table lock stayed held by another writer for about 3 seconds (`urn:adder:problem:room-busy`, `Retry-After: 1`, nothing was written), on the notification list the per-USER notification-read bucket (240/min) or on the notification-preferences PUT the per-USER notification-prefs bucket (30/min) is exhausted, or the notification list outruns its deadline (`read-timeout`) or finds the caller or server at their maximum of list reads (`read-busy`),
        on a search (`GET /api/v1/rooms/{id}/search`, `GET /api/v1/search`) the per-USER search bucket (shared by both) is exhausted (60/min), or the search outruns its request deadline (`urn:adder:problem:search-timeout`, `Retry-After: 2`), or the server already runs its maximum of concurrent searches (`urn:adder:problem:search-busy`, `Retry-After: 1`), on minting a live-update ticket (`POST /api/v1/live/tickets`) the per-USER live-ticket bucket is exhausted (60/min), the server already holds its maximum of pending tickets (answered with `Retry-After: 30`) or the caller already holds 16 sockets (`urn:adder:problem:live-socket-limit`, `Retry-After: 60`), on the live-update WebSocket (`GET /api/v1/live`) the per-IP live-connect bucket is exhausted (600/min), or, on /login, the
        per-account lockout is active (account-specific detail). Any room write (the record, archive, delete, workflow, member, thread and message writes) whose room stayed locked by other
        writers for about 3 seconds is a `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1` (retry; nothing was written). `Retry-After` is sent with every typed 429 (`room-busy`, `search-timeout`, `search-busy`, `read-timeout`, `read-busy`, `live-socket-limit`), the per-bucket 429s and the live-ticket store's full `429` (30 s, the ticket TTL), not with the login lockout, so it is
        declared optional. All carry a ProblemDetail body.
      headers:
        Retry-After:
          required: false
          description: Seconds to wait before retrying; sent with every typed 429 (`room-busy`, `search-timeout`, `search-busy`, `read-timeout`, `read-busy`, `live-socket-limit`), the rate-limit bucket 429s and the live-ticket store's full 429; not with the login lockout.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the ceiling — 512 KiB globally, 16 KiB on the small-body routes (the anonymous auth routes: login, MFA,
        refresh, password reset and its confirmation; the room member add; the thread status, owner and read-marker PUTs; the thread and
        message pin PUTs; the message reaction PUT; the notification-preferences PUT), 64 KiB on a message post or edit and 192 KiB
        on a thread create or details edit — a memory-DoS backstop shared by
        every endpoint, so declared on every operation that takes a body (field-level maxLength
        rules reject oversized values far earlier on ordinary payloads). Cross-cutting for the
        coverage gate: pinned once by `PayloadValidationTest`, never once per operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: >-
        Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use 256-bit reset credential from the email; never logged or returned.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 71
          description: The new password; at most 71 UTF-8 bytes (bcrypt ceiling).

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password:
          type: string
          description: >-
            A password longer than 71 UTF-8 bytes (the bcrypt ceiling) never matches an account: the same `401` as a wrong one.

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V1) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    LiveTicketResponse:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket:
          type: string
          minLength: 43
          maxLength: 43
          description: Opaque single-use ticket (32 random bytes, base64url). Send it as the socket's first frame; never put it in a URL.
        expiresAt:
          type: integer
          format: int64
          description: Ticket expiry as Unix epoch milliseconds (30 seconds after the mint).

    LiveEventKind:
      type: string
      description: What changed; the wire name equals the audit event of the write (the catalog is in the `connectLive` description).
      enum:
        - room.created
        - room.updated
        - room.archived
        - room.unarchived
        - room.deleted
        - room.member_added
        - room.member_role_changed
        - room.member_removed
        - room.workflow_updated
        - thread.created
        - thread.updated
        - thread.deleted
        - thread.merged
        - thread.status_changed
        - thread.owner_changed
        - message.posted
        - message.edited
        - message.deleted
        - message.reaction_changed
        - room.pin_changed
        - notification.created
    LiveAuthFrame:
      type: object
      required: [type, ticket]
      description: The FIRST frame of a socket, within 2 seconds, exactly once.
      properties:
        type: { type: string, enum: [auth] }
        ticket: { type: string, minLength: 43, maxLength: 43, description: The single-use ticket of `mintLiveTicket`. }
    LiveSubscribeFrame:
      type: object
      required: [type, roomIds]
      description: Subscribe to rooms the caller can read; answered by one `subscribed` frame.
      properties:
        type: { type: string, enum: [subscribe] }
        roomIds: { type: array, minItems: 1, maxItems: 128, items: { type: integer, format: int64, minimum: 1, maximum: 4294967295 } }
    LiveUnsubscribeFrame:
      type: object
      required: [type, roomIds]
      description: Drop subscriptions; no answer.
      properties:
        type: { type: string, enum: [unsubscribe] }
        roomIds: { type: array, minItems: 1, maxItems: 128, items: { type: integer, format: int64, minimum: 1, maximum: 4294967295 } }
    LivePingFrame:
      type: object
      required: [type]
      description: Application-level keep-alive; answered by `pong`.
      properties:
        type: { type: string, enum: [ping] }
    LiveForegroundFrame:
      type: object
      required: [type, visible]
      description: Renew or clear this authenticated tab's 60-second foreground lease. The shared lease can contribute to @here in rooms the user belongs to.
      properties:
        type: { type: string, enum: [foreground] }
        visible: { type: boolean }
    LiveClientFrame:
      description: A frame the client sends (JSON text, at most 8 KiB, parsed strictly).
      oneOf:
        - $ref: '#/components/schemas/LiveAuthFrame'
        - $ref: '#/components/schemas/LiveSubscribeFrame'
        - $ref: '#/components/schemas/LiveUnsubscribeFrame'
        - $ref: '#/components/schemas/LivePingFrame'
        - $ref: '#/components/schemas/LiveForegroundFrame'
      discriminator:
        propertyName: type
        mapping:
          auth: '#/components/schemas/LiveAuthFrame'
          subscribe: '#/components/schemas/LiveSubscribeFrame'
          unsubscribe: '#/components/schemas/LiveUnsubscribeFrame'
          ping: '#/components/schemas/LivePingFrame'
          foreground: '#/components/schemas/LiveForegroundFrame'
    LiveReadyFrame:
      type: object
      required: [type, protocol, maxSubscriptions]
      description: The ticket was good; the socket is authenticated.
      properties:
        type: { type: string, enum: [ready] }
        protocol: { type: integer, format: int32, description: The protocol version (1). }
        maxSubscriptions: { type: integer, format: int32, description: Subscriptions allowed per socket (128). }
        presenceSupported: { type: boolean, description: Whether the server accepts foreground lease frames. }
    LiveSubscribedFrame:
      type: object
      required: [type, roomIds, refused, capped]
      description: >-
        The answer to ONE `subscribe` frame, about that frame's ids only: `roomIds` are subscribed now, `refused` are rooms that do not exist or the
        caller cannot read (deliberately indistinguishable) and `capped` are ids over the per-socket subscription limit.
      properties:
        type: { type: string, enum: [subscribed] }
        roomIds: { type: array, items: { type: integer, format: int64, minimum: 1, maximum: 4294967295 } }
        refused: { type: array, items: { type: integer, format: int64, minimum: 1, maximum: 4294967295 } }
        capped: { type: array, items: { type: integer, format: int64, minimum: 1, maximum: 4294967295 } }
    LiveMutationId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    LiveEventFrame:
      type: object
      required: [type, kind, roomId]
      description: A hint that something changed; ids only, never what.
      properties:
        type: { type: string, enum: [event] }
        kind: { $ref: '#/components/schemas/LiveEventKind' }
        roomId: { type: integer, format: int64, minimum: 1, maximum: 4294967295 }
        threadNumber: { type: integer, format: int32, description: The thread's per-room number; present for the thread and message kinds. }
        messageId: { type: integer, format: int64, minimum: 1, maximum: 4294967295, description: Present for the message kinds. }
        mutationId:
          allOf: [{ $ref: '#/components/schemas/LiveMutationId' }]
          description: On message.posted, correlates a reply POST with its event for the writer's account only.
    LiveRevokedFrame:
      type: object
      required: [type, roomId]
      description: The room is no longer readable by the caller (removed, or the room was deleted); the subscription is gone.
      properties:
        type: { type: string, enum: [revoked] }
        roomId: { type: integer, format: int64, minimum: 1, maximum: 4294967295 }
    LiveResyncFrame:
      type: object
      required: [type]
      description: 'A gap (a listener outage or an overflowing queue), so refetch everything the page shows.'
      properties:
        type: { type: string, enum: [resync] }
    LivePongFrame:
      type: object
      required: [type]
      description: The answer to a `ping`.
      properties:
        type: { type: string, enum: [pong] }
    LiveServerFrame:
      description: A frame the server sends (JSON text). A client ignores unknown types and unknown fields.
      oneOf:
        - $ref: '#/components/schemas/LiveReadyFrame'
        - $ref: '#/components/schemas/LiveSubscribedFrame'
        - $ref: '#/components/schemas/LiveEventFrame'
        - $ref: '#/components/schemas/LiveRevokedFrame'
        - $ref: '#/components/schemas/LiveResyncFrame'
        - $ref: '#/components/schemas/LivePongFrame'
      discriminator:
        propertyName: type
        mapping:
          ready: '#/components/schemas/LiveReadyFrame'
          subscribed: '#/components/schemas/LiveSubscribedFrame'
          event: '#/components/schemas/LiveEventFrame'
          revoked: '#/components/schemas/LiveRevokedFrame'
          resync: '#/components/schemas/LiveResyncFrame'
          pong: '#/components/schemas/LivePongFrame'

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    BrowserPushConfig:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        publicKey:
          type: string
          description: Unpadded base64url raw uncompressed P-256 public point; absent when unavailable.
        registered:
          type: boolean
          description: Present only when `subscriptionId` was requested; true only for the caller's current, unexpired subscription.

    BrowserPushSubscriptionRequest:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, minLength: 1, maxLength: 2048, format: uri }

    BrowserPushSubscription:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int32, minimum: 1 }

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    UserDirectoryEntry:
      type: object
      required: [id, name, email]
      description: The whole directory projection - nothing else about a user is exposed.
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        email: { type: string }

    UserDirectoryPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
