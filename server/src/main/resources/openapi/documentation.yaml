          description: An immutable lower-case slug, reserved for the life of the room.
        label: { type: string, minLength: 1, maxLength: 60, description: Plain text in the language the room was created with }
        colour: { $ref: '#/components/schemas/StatusColour' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        initial:
          type: boolean
          description: Exactly one status is the initial one, and it is in the `OPEN` category.
        threadCount: { type: integer, format: int64, minimum: 0, description: The threads currently in this status }
    RoomWorkflowStatusDef:
      type: object
      required: [key, label, colour, category, initial]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { type: string, minLength: 1, maxLength: 60 }
        colour: { $ref: '#/components/schemas/StatusColour' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        initial:
          type: boolean
          description: Exactly one status is the initial one, and it is in the `OPEN` category.
    RoomWorkflowUpdate:
      type: object
      required: [statuses, fields]
      properties:
        statuses:
          type: array
          minItems: 2
          maxItems: 20
          description: The ACTIVE statuses in the new order.
          items:
            $ref: '#/components/schemas/RoomWorkflowStatusDef'
        fields:
          type: array
          maxItems: 20
          description: The ACTIVE fields in the new order.
          items:
            $ref: '#/components/schemas/RoomWorkflowField'
        replacements:
          type: object
          maxProperties: 20
          additionalProperties: { type: string }
          description: >-
            `{retiredKey: replacementKey}`: where the threads of each status this change retires move. The target must be a
            status of the new document in the same category. Omit it when no status that threads use is retired.
    RoomWorkflowOption:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { type: string, minLength: 1, maxLength: 60 }
    RoomWorkflowField:
      type: object
      required: [key, label, type, required, options]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: '#/components/schemas/FieldType' }
        required: { type: boolean }
        options:
          type: array
          maxItems: 50
          description: 1-50 options for `SELECT` and `MULTI_SELECT`; empty for every other type.
          items:
            $ref: '#/components/schemas/RoomWorkflowOption'
    RoomWorkflow:
      type: object
      required: [revision, statuses, fields]
      properties:
        revision: { type: integer, format: int64, minimum: 1, description: The token a workflow PUT names in `X-Expected-Revision` }
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/RoomWorkflowStatus'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/RoomWorkflowField'

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: |
            A URI reference identifying the problem type: `about:blank`, or one of the typed problems below, which a client tells apart
            from the plain status by the URI, never by the detail text. This list is the whole set (it equals the server's registry,
            `ProblemTypes`, pinned by `ProblemTypesTest`); the status in brackets is the one it answers.

            - `urn:adder:problem:revision-conflict` (409): a stale `X-Expected-Revision`.
            - `urn:adder:problem:last-owner` (409): the write would leave a room without an active owner.
            - `urn:adder:problem:room-archived` (409): an archived room is read-only.
            - `urn:adder:problem:thread-closed` (409): a closed thread takes no activity until it is reopened.
            - `urn:adder:problem:thread-merged` (409): this source conversation is merged into another thread.
            - `urn:adder:problem:status-in-use` (409): a workflow change would retire or re-categorise a status threads use; carries `keys`.
            - `urn:adder:problem:field-type-immutable` (409): a field's type is fixed per key; carries `keys`.
            - `urn:adder:problem:pin-limit` (409): the room already holds its 50 pins.
            - `urn:adder:problem:reaction-limit` (409): the message or the caller is at the reaction limit.
            - `urn:adder:problem:room-busy` (429, `Retry-After`): the room's write lock stayed busy; retry.
            - `urn:adder:problem:read-timeout` (429, `Retry-After`): a filtered thread list, a tag list or a thread read outran its deadline.
            - `urn:adder:problem:read-busy` (429, `Retry-After`): the caller or the server is at its maximum of list and thread reads.
            - `urn:adder:problem:search-timeout` (429, `Retry-After`): a search outran its deadline.
            - `urn:adder:problem:search-busy` (429, `Retry-After`): the server is at its maximum of concurrent searches.
            - `urn:adder:problem:live-socket-limit` (429, `Retry-After`): the caller already holds their maximum of live sockets.
            - `urn:adder:problem:live-unavailable` (503, `Retry-After`): the live channel is stopping, full or without its listener.
            - `urn:adder:problem:template-gone` (400): the workflow template a room is created from is unknown or deleted.
            - `urn:adder:problem:quote-unavailable` (400): the message a post quotes is unknown, unreadable, or deleted.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
        keys:
          type: array
          items: { type: string }
          description: >-
            Extension member, present only on a conflict that is about specific keys: a workflow conflict (the statuses or fields
            it names) or a team's unique-name clash (`["name"]` or `["handle"]`, the field that is already taken).

    ThreadFieldValues:
      type: object
      description: |
        Field values by field key. Per type: TEXT a single-line string of at most 500 characters (blank means unset); NUMBER a finite
        JSON number whose magnitude is at most 1e15; DATE a real calendar day as a `YYYY-MM-DD` string; SELECT one option key;
        MULTI_SELECT 1 to 50 distinct option keys (an empty array means unset); USER the id of an active member of the room;
        URL an absolute `http` or `https` URL of at most 2,000 characters with no user name or password and no control or hidden direction
        character. `null` means unset. A value of the wrong JSON type is a `400`; so is a nested object, or a request with more than 20 keys (a request carries at most 20 keys, even when one is an unchanged retired key).
      maxProperties: 20
      additionalProperties:
        anyOf:
          - { type: string, nullable: true }
          - { type: number }
          - type: array
            maxItems: 50
            items: { type: string }
    ThreadCreateRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: A single line; trimmed. }
        body:
          type: string
          minLength: 1
          maxLength: 8000
          description: The opening message, Markdown (stored raw, rendered without HTML). Line endings are normalised; leading blank lines and trailing whitespace are dropped, the first line's indentation stays.
        fields:
          $ref: '#/components/schemas/ThreadFieldValues'
        tags:
          $ref: '#/components/schemas/ThreadTagNames'
    ThreadUpdateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: A single line; trimmed. }
        fields:
          description: |
            MERGED over the stored values, not a full replace (a documented exception to API-RES-004): a retired field's value is hidden
            on read and cannot be sent back, so replacing would erase it. An omitted key keeps its value; send `null` to clear it.
          allOf:
            - $ref: '#/components/schemas/ThreadFieldValues'
    ThreadStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1, maxLength: 40, description: The KEY of an active status of the room's workflow. }
    ThreadOwnerRequest:
      type: object
      required: [ownerId]
      properties:
        ownerId: { type: integer, format: int32, minimum: 1, description: The id of an active member of the room. }
    ThreadMergeRequest:
      type: object
      required: [targetNumber]
      properties:
        targetNumber: { type: integer, format: int32, minimum: 1, description: The destination's number in the same room. }
    ThreadResponse:
      type: object
      required:
        - id
        - number
        - title
        - status
        - closed
        - closedAt
        - ownerId
        - ownerName
        - createdById
        - createdByName
        - fields
        - fieldUserNames
        - messageCount
        - revision
        - lastActivityAt
        - createdAt
        - updatedAt
        - unreadCount
        - firstUnreadMessageId
        - watching
        - watcherCount
        - hashtags
        - tags
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        number: { type: integer, format: int32, minimum: 1, description: The per-room number (`#42`); never reused. }
        title: { type: string }
        status: { type: string, description: The status KEY; its label and colour are in the room's workflow. }
        closed: { type: boolean, description: The status is in a CLOSED category; the thread takes no further activity until it is reopened. }
        closedAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the instant the thread closed (kept across CLOSED to CLOSED moves); `null` while open. }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        createdById: { type: integer, format: int32, minimum: 1 }
        createdByName: { type: string }
        fields:
          $ref: '#/components/schemas/ThreadFieldValues'
        fieldUserNames:
          type: object
          readOnly: true
          description: Display names of the users held by USER fields, by user id.
          additionalProperties: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0, description: 'Every message: the opener and deleted ones included; it never goes down.' }
        revision: { type: integer, format: int64, minimum: 1, description: The token the details PUT names in `X-Expected-Revision`. Starts at 1. }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        unreadCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 'Messages the CALLER has not read (it counts the newest 100 after their marker, so 100 is "100 or more"); 0 for someone who is not a member.'
        firstUnreadMessageId:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: The first of those messages; `null` when none is unread or the caller is not a member.
        watching: { type: boolean, description: The CALLER watches the thread (`PUT .../watch`); `false` for someone who is not a member. }
        watcherCount: { type: integer, format: int32, minimum: 0, description: 'How many active members watch the thread; who they are is not on the wire.' }
        muted: { type: boolean, description: The caller muted notices for this thread. Omitted when unmuted. }
        mergedIntoThreadNumber: { type: integer, format: int32, minimum: 1, nullable: true, description: The canonical destination thread number if this history was merged. }
        mergedSourceCount: { type: integer, format: int64, minimum: 0, description: The number of readable source conversations merged into this thread. }
        hashtags:
          $ref: '#/components/schemas/ThreadHashtags'
        tags:
          $ref: '#/components/schemas/ThreadTags'
    ThreadTag:
      type: object
      required: [name, retired]
      description: One curated tag on a thread (1.2).
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: The registry name (normalised). }
        retired: { type: boolean, description: 'The registry has retired the tag since it was put on. It stays on the thread until the next tag save drops it; a save that still carries it is a `400`.' }
    ThreadTags:
      type: array
      maxItems: 20
      description: |
        The thread's CURATED tags (the ADMIN registry of `GET /tag-categories`, set by `PUT .../tags`; not the hashtags): in code point
        order of the name, at most 20, a retired tag marked and kept (1.2).
      items:
        $ref: '#/components/schemas/ThreadTag'
    ThreadTagsRequest:
      type: object
      required: [tags]
      properties:
        tags:
          $ref: '#/components/schemas/ThreadTagNames'
    ThreadTagNames:
      type: array
      maxItems: 20
      description: >-
        The thread's whole curated tag set. An empty list means no tags. Registry names are trimmed, whitespace-collapsed and
        lowercased. Each name must then be 1 to 40 characters in the tag grammar, name a live registry tag, and be unique in the list.
      items: { type: string, minLength: 1, maxLength: 200 }
    ThreadHashtags:
      type: array
      maxItems: 20
      description: |
        The thread's HASHTAGS (the `#word`s of its live messages, 0.5.0): the distinct stored (case- and accent-folded)
        keys, alphabetical, at most 20. Each is a valid `tag` filter value of the thread list. A deleted message's hashtags are gone; an edit adds or drops them.
      items: { type: string, minLength: 1, maxLength: 150 }
    ThreadListItem:
      type: object
      required: [id, number, title, status, closed, ownerId, ownerName, messageCount, lastActivityAt, createdAt, unreadCount, watching, hashtags, tags]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        number: { type: integer, format: int32, minimum: 1 }
        title: { type: string }
        status: { type: string, description: The status KEY. }
        closed: { type: boolean }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0 }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        unreadCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 'Messages the CALLER has not read (the newest 100 after their marker are counted, so 100 is "100 or more"); 0 for someone who is not a member.'
        watching: { type: boolean, description: The CALLER watches the thread (`PUT .../watch`); `false` for someone who is not a member. }
        hashtags:
          $ref: '#/components/schemas/ThreadHashtags'
        tags:
          $ref: '#/components/schemas/ThreadTags'
    ThreadPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    RoomTag:
      type: object
      required: [tag, threadCount]
      properties:
        tag:
          type: string
          minLength: 1
          maxLength: 150
          description: The FOLDED tag without its `#` (lower case, accents stripped); what the thread list's `tag` filter takes.
        threadCount:
          type: integer
          format: int64
          minimum: 1
          description: Distinct threads, open and closed, that have a live message carrying the tag.
    RoomTagPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomTag'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    SnippetSegment:
      type: object
      required: [text, hit]
      description: One run of a snippet. `text` is PLAIN text from the Markdown source (render it as text, never as HTML or Markdown).
      properties:
        text: { type: string }
        hit: { type: boolean, description: True for the words that matched the query. }
    MessageSearchHit:
      type: object
      required: [id, authorId, authorName, createdAt, snippet]
      properties:
        id: { type: integer, format: int32, minimum: 1, description: 'The message id (the key of `GET /rooms/{id}/messages/{messageId}`).' }
        authorId: { type: integer, format: int32, minimum: 1 }
        authorName: { type: string }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        snippet:
          type: array
          description: A fragment of the message, at most two pieces of 6 to 18 words joined by an ellipsis, its hits marked.
          items:
            $ref: '#/components/schemas/SnippetSegment'
    MessageSearchPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MessageSearchHit'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 20 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Matching live messages in the selected thread.
    ThreadSearchHit:
      type: object
      required: [roomId, roomName, roomArchived, threadNumber, title, titleSnippet, status, closed, ownerId, ownerName, messageCount, lastActivityAt, matchCount, messages, tags]
      properties:
        roomId: { type: integer, format: int32, minimum: 1 }
        roomName: { type: string }
        roomArchived: { type: boolean, description: An archived room is searched and labelled. }
        threadNumber: { type: integer, format: int32, minimum: 1 }
        title: { type: string }
        titleSnippet:
          type: array
          description: The whole title, its hits marked (one plain segment when only a message matched, and also when a watched-threads search names no `q`, since then nothing is a hit).
          items:
            $ref: '#/components/schemas/SnippetSegment'
        status: { type: string, description: The status KEY. }
        closed: { type: boolean }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0 }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        matchCount: { type: integer, format: int64, minimum: 0, description: 'How many live messages of the thread match (0 for a title-only hit, and always 0 for a search without `q`: the watched-threads and tag views).' }
        messages:
          type: array
          maxItems: 3
          description: The three newest matching live messages, newest first (empty for a title-only hit and for a search without `q`, the watched-threads and tag views).
          items:
            $ref: '#/components/schemas/MessageSearchHit'
        tags:
          $ref: '#/components/schemas/ThreadTags'
    ThreadSearchPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ThreadSearchHit'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 20 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Matching threads.
    ThreadEventType:
      type: string
      description: |
        The kind of a history entry (persisted, never renamed). The `params` of each: `CREATED` `{status, statusLabel}`;
        `TITLE_CHANGED` `{}`; `STATUS_CHANGED`, `CLOSED`, `REOPENED` and `STATUS_REPLACED` `{from, to, fromLabel, toLabel}`
        (status keys and the labels at that moment); `OWNER_CHANGED` `{fromId, toId, fromName, toName}`; `FIELD_CHANGED`
        `{field, fieldLabel, from?, to?}`; `TAGS_CHANGED` `{added?, removed?}` (registry tag names, each side joined with ", ", a side with no
        change absent); `MERGED_INTO` and `MERGED_FROM` `{threadNumber}` (the related thread's number). The history is append-only,
        so it keeps no free text: no title is recorded (the thread shows
        the current one), and `from`/`to` (display text; an absent side means unset) exist only for a SELECT, MULTI_SELECT, USER,
        DATE or NUMBER field, never for a TEXT or URL one (the entry says THAT the field changed). A RETIRED field's entries answer
        without `from`/`to` too, and show them again if the field is revived. Entries written before 1.0.0 were scrubbed to this shape.
      enum: [CREATED, TITLE_CHANGED, STATUS_CHANGED, CLOSED, REOPENED, OWNER_CHANGED, FIELD_CHANGED, STATUS_REPLACED, TAGS_CHANGED, MERGED_INTO, MERGED_FROM]
    ThreadEvent:
      type: object
      required: [id, actorId, actorName, actorDeleted, type, params, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        actorId: { type: integer, format: int32, minimum: 1, description: The acting user. }
        actorName: { type: string }
        actorDeleted: { type: boolean, description: The acting account has since been deleted. }
        type: { $ref: '#/components/schemas/ThreadEventType' }
        params:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: integer, format: int64, description: Epoch millis }
    ThreadEventPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadEvent'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    MessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 8000
          description: Markdown (stored raw, rendered without HTML). Line endings are normalised; leading blank lines and trailing whitespace are dropped, the first line's indentation stays.
    LinkPreviewRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: The exact external link destination currently present in the live message.
    LinkPreviewKind:
      type: string
      enum: [PAGE, IMAGE, UNAVAILABLE]
    LinkPreviewImage:
      type: object
      required: [mediaType, data, width, height]
      properties:
