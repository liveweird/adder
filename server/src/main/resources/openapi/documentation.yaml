    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a user; must be active (`400` otherwise).
        handle:
          type: string
          nullable: true
          minLength: 2
          maxLength: 30
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: >-
            The team's mention handle: lowercase letters, digits and single hyphens, starting with a letter; never folded
            (uppercase is a `400`); not one of the reserved words `everyone`, `watchers`, `observers`, `here`, `all`,
            `channel`, `room`, `team` (`400`); unique among active teams (`409`).
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a user; must be active (`400` otherwise). Omitted on PUT (a full replace) = no manager.
        handle:
          type: string
          nullable: true
          minLength: 2
          maxLength: 30
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: >-
            The team's mention handle: lowercase letters, digits and single hyphens, starting with a letter; never folded
            (uppercase is a `400`); not one of the reserved words `everyone`, `watchers`, `observers`, `here`, `all`,
            `channel`, `room`, `team` (`400`); unique among active teams (`409`). Omitted on PUT (a full replace) = no handle.
    TeamMember:
      type: object
      required: [userId, name, email]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
    TeamResponse:
      type: object
      required: [id, name, handle, managerId, managerName, members, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        handle: { type: string, nullable: true, description: The mention handle; null when the team has none. }
        managerId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager; null when unset or when the assigned user was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's display name; null with `managerId`. }
        members:
          type: array
          maxItems: 200
          description: The roster - ACTIVE users only (a soft-deleted member is absent), by name then id; a team holds at most 200.
          items:
            $ref: '#/components/schemas/TeamMember'
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, handle, managerId, managerName, memberCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        handle: { type: string, nullable: true, description: The mention handle; null when the team has none. }
        managerId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager; null when unset or when the assigned user was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's display name; null with `managerId`. }
        memberCount: { type: integer, format: int32, minimum: 0, description: The roster size - ACTIVE users only. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    WorkflowLabel:
      type: object
      required: [en]
      additionalProperties: false
      description: >-
        A label per language: `en` is required, `pl` optional (omit it to leave the label untranslated; a present blank value is a
        `400`); no other language is accepted. Each value is 1-60 characters after trimming.
      properties:
        en: { type: string, minLength: 1, maxLength: 60 }
        pl: { type: string, minLength: 1, maxLength: 60 }
    WorkflowStatus:
      type: object
      required: [key, label, colour, category, initial]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: An immutable lower-case slug (`in-progress`), unique within the document.
        label: { $ref: '#/components/schemas/WorkflowLabel' }
        colour: { $ref: '#/components/schemas/StatusColour' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        initial:
          type: boolean
          description: Exactly one status of a document is the initial one, and it is in the `OPEN` category.
    WorkflowOption:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { $ref: '#/components/schemas/WorkflowLabel' }
    WorkflowField:
      type: object
      required: [key, label, type, required, options]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: An immutable lower-case slug, unique within the document.
        label: { $ref: '#/components/schemas/WorkflowLabel' }
        type: { $ref: '#/components/schemas/FieldType' }
        required: { type: boolean }
        options:
          type: array
          maxItems: 50
          description: 1-50 options for `SELECT` and `MULTI_SELECT`; empty for every other type.
          items:
            $ref: '#/components/schemas/WorkflowOption'
    StatusColour:
      type: string
      enum: [GRAY, RED, ORANGE, BLUE, GRAPE, TEAL]
      description: The semantic colour of a status; the web app maps it to its hue.
    StatusCategory:
      type: string
      enum: [OPEN, CLOSED]
      description: A thread in a `CLOSED` status is closed - no further activity until it is reopened.
    FieldType:
      type: string
      enum: [TEXT, NUMBER, DATE, SELECT, MULTI_SELECT, USER, URL]
    TagCategoryRequest:
      type: object
      required: [name, tags]
