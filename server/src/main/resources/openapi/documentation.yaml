  /api/v1/workflow-templates:
    get:
      tags: [workflows]
      operationId: listWorkflowTemplates
      summary: List workflow templates
      description: |
        Any authenticated user - a room copies a template's statuses and fields when it is created. Active templates only.

        - Sortable fields: `id`, `name`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring, at most 100 characters - `400` beyond).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: A page of workflow templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplatePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [workflows]
      operationId: createWorkflowTemplate
      summary: Create a workflow template
      description: |
        ADMIN only (guarded before the body decodes - a non-admin's malformed body is still `403`). The new template starts at
        `revision` 1. A case-insensitive name clash with an active template is `409`; a deleted template frees its name. The
        document must satisfy the workflow rules: 2-20 statuses (unique slug keys, exactly one initial and it is `OPEN`, at
        least one `CLOSED`), 0-20 fields (unique slug keys), options only on the select kinds (1-50, unique slugs), every
        status, field and option label a language map with an `en` value of 1-60 characters (`400` otherwise), unique per language
        (case-insensitive, after trimming) among the statuses, among the fields and among one field's options.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTemplateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new template
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/workflow-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [workflows]
      operationId: getWorkflowTemplate
      summary: Get a workflow template
      description: Any authenticated user. The `revision` is what a later PUT names in `X-Expected-Revision`.
      responses:
        '200':
          description: The template with its statuses and fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [workflows]
      operationId: updateWorkflowTemplate
      summary: Replace a workflow template
      description: |
        ADMIN only. A whole-document replace under optimistic concurrency, checked in this order: the guard (uniform `403`,
        whether or not the id exists and whatever the body), the `X-Expected-Revision` header (missing, repeated or malformed is
        `400`), the body (`400`, the rules of the create), then under the row lock the id (`404`) and the revision. A stale
        revision is `409` of type `urn:adder:problem:revision-conflict`; a case-insensitive name clash with another active
        template is a plain `409`. Every successful PUT stores `revision + 1`; read the template again for it. A template edit
        never touches a room that copied it.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTemplateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [workflows]
      operationId: deleteWorkflowTemplate
      summary: Delete a workflow template (soft)
      description: ADMIN only, guard before the id lookup. Soft delete - the name is freed for reuse; rooms that copied the template are untouched.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List rooms
      description: |
        Any authenticated user: the rooms the caller may read - the ones they are a member of, and for an `ADMIN` every room.
        Deleted rooms never appear.

        - Sortable fields: `id`, `name`, `lastActivityAt`, `createdAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring, at most 80 characters - `400` beyond); `archived` (strict `true` or
          `false`; omitted = both); `member` (strict `true` or `false`: `true` = only rooms the caller is a member of - the rooms rail
          always sends it; `false` = only readable rooms the caller is NOT in, which is empty for a non-admin; omitted = every readable
          room). A repeated key is a `400`.
        - Each row's `role` is the CALLER's role in that room, `null` for an `ADMIN` who is not a member.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
        - name: archived
          in: query
          required: false
          schema: { type: boolean }
        - name: member
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: A page of rooms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room from a workflow template
      description: |
        Any authenticated user; the creator becomes the room's OWNER. In ONE transaction the room is inserted, its creator is added as
        OWNER, and the template's statuses and fields are COPIED into the room with every label resolved to the request's `language`
        (default `en`; a label the template has no translation for falls back to its `en` text). The copy is single-language plain text
        and has no link back: a later template edit or delete never touches the room. When per-label resolution would clash within a list,
        that whole list is copied in EN.

        An unknown or deleted `templateId` and an unsupported `language` are `400`. A case-insensitive name clash with a non-deleted
        room is `409` (archived rooms keep their names; a deleted room frees its own). Rides a per-USER rate bucket of 30 per minute
        shared with the rename (`429` beyond it). The name may not contain invisible formatting characters (`400`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new room
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Get a room
      description: |
        A member of the room or an `ADMIN`. A non-member (and any caller for a room that does not exist or was deleted) gets the same
        `404`, so a room's existence is not disclosed. `role` is the caller's role, `null` for an `ADMIN` outside the room.
        `workflowRevision` is what a workflow PUT names in `X-Expected-Revision`.
      responses:
        '200':
          description: The room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [rooms]
      operationId: updateRoom
      summary: Replace a room's name and description
      description: |
        The room's OWNER or an `ADMIN`. Checked in this order: visibility (`404` for a missing room and for a non-member alike), role
        (`403` for a plain member), the body (`400`), then under the room lock the guard again (a caller demoted while the write waited is
        refused), the archived state (`409` of type `urn:adder:problem:room-archived`: an archived room is read-only) and the name (a
        case-insensitive clash with another non-deleted room is a plain `409`, audited `room.name_conflict`). A full replace: an omitted description clears it.
        The name may not contain invisible formatting characters (Unicode category Cf, U+2028, U+2029: `400`). Rides the per-USER `room-name`
        bucket shared with the room create (30 per minute, `429` beyond it), because a rename's `409` would otherwise be a free probe for a room's name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [rooms]
      operationId: deleteRoom
      summary: Delete a room (soft)
      description: |
        `ADMIN` only, but the visibility check comes first: a non-member who is not an `ADMIN` gets the `404`, a member who is not an
        `ADMIN` (the room's OWNER included) gets `403`. Soft delete - the room stops reading as active and frees its name; there is no
        restore. An archived room can be deleted.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [rooms]
      operationId: archiveRoom
      summary: Archive a room
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, then role `403`). Idempotent: archiving an archived room is a `204` that
        changes nothing. An archived room is read-only for its name, description and workflow; its members can still be managed.
        No request body.
      responses:
        '204':
          description: Archived (or already archived)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [rooms]
      operationId: unarchiveRoom
      summary: Unarchive a room
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, then role `403`). Idempotent: unarchiving an active room is a `204` that
        changes nothing. No request body.
      responses:
        '204':
          description: Unarchived (or already active)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/workflow:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: getRoomWorkflow
      summary: Get a room's workflow
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`). The room's ACTIVE statuses and fields in position order
        (retired ones are not shown), with plain single-language labels and the `revision` a later workflow PUT names in
        `X-Expected-Revision`. Each status carries `threadCount`, the number of threads currently in it.
      responses:
        '200':
          description: The room's workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomWorkflow'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [rooms]
      operationId: updateRoomWorkflow
      summary: Replace a room's workflow
      description: |
        The room's OWNER or an `ADMIN`. A whole-document replace of the room's own copy under optimistic concurrency, checked in
        this order: the room (a missing room or a non-member is the uniform `404`), the role (`403`), the `X-Expected-Revision`
        header (missing, repeated or malformed is `400`), the body (`400`: the workflow rules - 2-20 statuses with unique slug keys,
        exactly one initial and it is `OPEN`, at least one `CLOSED`, 0-20 fields with unique slug keys, 1-50 options on the select
        kinds only, labels of 1-60 characters unique per list, case-insensitively), then under the room lock, in this order: an
        archived room is `409` of type `urn:adder:problem:room-archived`; a stale revision is `409` of type
        `urn:adder:problem:revision-conflict`; a field whose key exists (retired ones included) with another `type` is `409` of type
        `urn:adder:problem:field-type-immutable` with `keys`; a room may reserve at most 200 status keys and 200 field keys
        (retired ones included), beyond that a plain `409`; an invalid `replacements` mapping is `400`; a status that would be retired
        or re-categorised while threads use it, without a valid replacement, is `409` of type `urn:adder:problem:status-in-use` with
        `keys`.

        `statuses` and `fields` are the ACTIVE ones in the new order (position is the array index). A key the document no longer
        names is retired (its key stays reserved); a retired key it names again is revived. `replacements` is
        `{retiredKey: replacementKey}`: where the threads of each status THIS change retires move; the key must be a status this
        change retires and the target a status of the new document in the same category as the retired one (else `400`). A
        status's category can only change while no thread uses it. A replacement moves each of those threads and writes one
        `STATUS_REPLACED` event to its history; the thread keeps its `closedAt` (the replacement has the same category), its
        `lastActivityAt` and its details `revision` are not bumped, and only its `updatedAt` moves. Every successful PUT stores
        `workflowRevision + 1`; read the workflow again for it.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomWorkflowUpdate'
      responses:
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: listRoomMembers
      summary: List a room's members
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`). Members are ACTIVE users only: a soft-deleted user's
        membership is inert and never listed.

        - Sortable fields: `id` (the user id), `name`, `role`, `addedAt`. Default `id` ascending.
        - Filters: `role` (`OWNER` or `MEMBER`; any other value is a `400`); `name` (case- and accent-insensitive substring of the display
          name, at most 100 characters - `400` beyond). A repeated key is a `400`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RoomRole' }
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: A page of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomMemberPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [rooms]
      operationId: addRoomMembers
      summary: Add people to a room, one by one and/or a whole team
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, role `403`, then the body `400`, then under the room lock the guard again).
        Allowed on an archived room. At least one of `userIds` (at most 200) and `teamId` is required. A team is a SNAPSHOT: its
        ACTIVE roster at this moment becomes members, and a later roster edit never follows. Everyone is added as `MEMBER`; promotion
        is a separate step (`PUT .../members/{userId}`).

        Idempotent: a person who already belongs is skipped and counted in `alreadyMembers` (and beats the cap). An unknown or
        soft-deleted user id or team id is a `400` and nothing is added. A room holds at most 500 active members: an add that would
        exceed it is a plain `409` and nothing is added. A team whose roster holds no active member adds nobody: `200` with
        `{added: 0, alreadyMembers: 0}`. One `room.member_added` audit line per person actually added. The body is limited to 16 KiB (`413`
        beyond it, before it is decoded) and the call rides a per-USER `room-members` bucket of 60 per minute (`429` beyond it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomMembersAddRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Added (the counts say how many people were new)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomMembersAddResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/UserIdPath'
    put:
      tags: [rooms]
      operationId: setRoomMemberRole
      summary: Set a member's role
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, role `403`, the body `400`, then under the room lock the guard again). Allowed
        on an archived room. Idempotent: the role the member already has is a `204` that changes nothing and is not audited
        (`room.member_role_changed` fires on a change only). A user who is not an active member is `404`. Demoting the room's last
        `OWNER` whose user is active is a `409` of type `urn:adder:problem:last-owner`: promote someone else first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomMemberRoleRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: The member has the role (set now or already)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [rooms]
      operationId: removeRoomMember
      summary: Leave a room, or remove a member
      description: |
        A member removes THEMSELVES (a leave: visibility `404` for a non-member, so an `ADMIN` who is not in the room gets `404` too) or
        the room's OWNER or an `ADMIN` removes someone else (a plain member removing another is `403`). Allowed on an archived room.
        `404` for a user who is not an active member. Removing the room's last `OWNER` whose user is active - a leave included - is a
        `409` of type `urn:adder:problem:last-owner`. Audited `room.member_removed` (with `self`). A hard delete: the person can be added
        again.
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [threads]
      operationId: listRoomTags
      summary: List a room's hashtags
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, then the parameters are checked: `400`).

        A tag is a hashtag written in a message (`#Wdrozenie`); it belongs to the MESSAGE, so a thread has it while one of its live
        messages does, and editing it away or deleting the message removes it. A row is the FOLDED tag (lower case, accents stripped: the
        key the thread list's `tag` filter takes) and `threadCount`, the number of distinct threads, open and closed, that have a live
        message carrying it. Nothing here is a record the caller can edit: the set is derived from the messages.

        - Sortable fields: `tag`, `threadCount`. Default `-threadCount` (the most used first; ties by `tag`).
        - Filter: `tag`, a case- and accent-insensitive substring of the tag (for a picker), at most 50 characters (`400` beyond). A
          repeated key is a `400`.

        Rides the per-USER `chat-read` bucket of 300 per minute shared with the thread list (`429` beyond it; the bucket is spent
        before any guard, so a refused or invalid read costs a token too). The read runs under one deadline of 5 seconds by default: a
        list past it is answered `429` of type `urn:adder:problem:read-timeout` with `Retry-After: 2`, audited without the filter value.
        At most 8 of the caller's list reads run at once and at most 10 in the server (the thread list and the tag list together, a read
        waits about 1 second for a slot): past either it is answered `429` of type `urn:adder:problem:read-busy` with `Retry-After: 1`
        (the server is loaded; retry shortly, nothing to narrow).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: tag
          in: query
          required: false
          schema: { type: string, maxLength: 50 }
      responses:
        '200':
          description: A page of the room's tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTagPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/search:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [threads]
      operationId: searchRoom
      summary: Search a room's threads and messages
      description: |
        Full-text search over the room's thread TITLES and live message BODIES. A member of the room or an `ADMIN` (a non-member gets the
        uniform `404`). Checked in this order: authentication (`401`), the per-USER `search` bucket of 60 per minute (`429`; spent
        before any guard, so a refused search costs a token too), visibility (`404`, audited `room.access_denied`), the parameters
        (`400`), then the query. A non-member's bad `q` is still a `404`. An archived room is searched.

        - `q` (REQUIRED, 2 to 100 characters after trimming, at least one letter or digit, no control characters; repeating it is a `400`)
          is matched case- and accent-insensitively: `zolw` finds `Żółw` and the snippet keeps the diacritics. Every term is required
          within ONE message or within the title; a term of three or more characters matches as a PREFIX (there is no stemming, so
          `awari` finds `awaria` and `awarii`, but `bazy` does not find `baza`), a shorter one matches exactly. There are no operators:
          `&`, `|`, `!`, quotes and `:*` are punctuation, never syntax, so no input is a query error, and an input with no word in it
          (`!!!`, `<script>`) matches nothing. `PROD-123` is indexed as `prod` and `-123`: searching it finds it, `123` alone does not.
          Hashtag text is searchable (`#db-outage` indexes `db-outage`, `db` and `outage`). Field values and deleted messages are never
          searched.
        - `closed` (strict `true` or `false`, on the status category; omitted = both; a repeated key is a `400`).
        - Sortable fields: `lastActivityAt`, `createdAt`, `id`. Default `-lastActivityAt` (`id` ascending breaks ties). `pageSize` is at
          most 20 (default 20; `400` beyond).

        An item is a THREAD, in the page envelope: `total` counts matching threads. `messages` holds the three newest matching live
        messages (newest first) and `matchCount` counts all of them; a thread that only matched by its title has no messages and a
        count of 0. A snippet is a list of typed segments `{text, hit}`, never markup: `text` is a fragment of the Markdown source as
        PLAIN text (render it as text, never as HTML or Markdown), `hit` marks the words that matched. `status` is the status KEY (the
        room's workflow holds the label and colour). The search is one read under ONE deadline for all its statements (5 seconds by
        default): a search past it is answered `429` of type `urn:adder:problem:search-timeout` with `Retry-After: 2`, audited without
        the term (narrow the query). At most 4 searches run in the server at once (both search operations together): another is refused
        at once with `429` of type `urn:adder:problem:search-busy` and `Retry-After: 1` (the server is loaded; retry shortly, nothing to
        narrow). The cost of a search is linear in the messages of the rooms it covers (this room, or the caller's rooms): a word that
        matches nothing reads them all. The term appears in no log line and in no problem body. Results are not live.
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: closed
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/SearchPageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of matching threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadSearchPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [threads]
      operationId: listThreads
      summary: List a room's threads
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`).

        - Sortable fields: `id`, `number`, `title`, `lastActivityAt`, `createdAt`, `status` (the status's position in the room's
          workflow: the first status first, a retired one where it sits). Default `id` ascending (the SPA sends `-lastActivityAt`).
        - Filters: `closed` (strict `true` or `false`, on the status category: `true` = only closed threads, `false` = only open ones;
          omitted = both; a repeated key is a `400`), and the repeatable `status`, `ownerId` and `field`: any-of within one parameter,
          all-of across parameters. `field` is `key:value` on an ACTIVE SELECT, MULTI_SELECT or USER field of the room, any-of
          within a key and all-of across keys (SELECT and MULTI_SELECT: an option key, one the room has since removed still finds
          the threads that kept it; USER: a user id). An unknown, RETIRED, TEXT, URL, DATE or NUMBER field key, a `field` without a
          colon and a value of the wrong shape for its type are a `400`.
        - `tag` (repeatable, any-of, at most 10 distinct after case folding) keeps the threads that have a LIVE message carrying any of
          the hashtags: the value is the tag as written without its `#`, or a `tag` of `GET /rooms/{id}/tags` as returned, and it is
          folded (case and accents ignored: `Wdrozenie` and `wdrożenie` are one tag). A returned key can hold punctuation and be longer
          than a written tag, so a value is 1 to 150 characters without `#` or control characters. A malformed value, or more than 10
          distinct values, is a `400`.
        - `mentionedUserId` (repeatable, any-of, at most 20 distinct) keeps the threads that have a LIVE message mentioning any of
          those people (`<@id>` in its body, the person an active member of the room when it was written or edited); the filter reads
          the mention index only, so it finds nothing for a message written before mentions were indexed. A non-positive or
          non-integer id, or more than 20 distinct values, is a `400`.
        - A well-formed status key, owner id, mentioned user id, field value or tag that matches nothing is an empty page, never an error. Checked in this
          order: visibility (`404`), then the parameters (`400`): a non-member's bad filter is still a `404`. A filter never widens
          what the caller may read.
        - A row carries the status KEY; labels and colours come from the room's workflow (`GET /rooms/{id}/workflow`).
        - Rides the per-USER `chat-read` bucket of 300 per minute shared with `GET /rooms/{id}/tags` (`429` beyond it; the bucket is spent
          before any guard, so a refused or invalid read costs a token too). The read runs under one deadline of 5 seconds by default: a
          list past it is answered `429` of type `urn:adder:problem:read-timeout` with `Retry-After: 2`, audited without the filter values.
          At most 8 of the caller's list reads run at once and at most 10 in the server (the thread list and the tag list together, a read
          waits about 1 second for a slot): past either it is answered `429` of type `urn:adder:problem:read-busy` with `Retry-After: 1`
          (the server is loaded; retry shortly, nothing to narrow).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: closed
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/ThreadStatusFilter'
        - $ref: '#/components/parameters/ThreadOwnerFilter'
        - $ref: '#/components/parameters/ThreadFieldFilter'
        - $ref: '#/components/parameters/ThreadTagFilter'
        - $ref: '#/components/parameters/ThreadMentionFilter'
      responses:
        '200':
          description: A page of threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [threads]
      operationId: createThread
      summary: Start a thread
      description: |
        A MEMBER of the room (an `ADMIN` who is not a member is `403` and joins through the Members page first; a non-member is the
        uniform `404`). Checked in this order: visibility (`404`), membership (`403`), the body (`400`), then under the room lock the
        guard again (a caller removed while the write waited is refused), an archived room (`409` of type `urn:adder:problem:room-archived`)
        and the field values (`400`).

        The thread starts in the room's initial status with the caller as its owner and the number `MAX + 1` of the room; `body`
        becomes its opening message. `title` is a single line of 1 to 200 characters; `body` is Markdown of 1 to 8,000 UTF-16 units
        after line endings are normalised, leading blank lines and trailing whitespace are dropped and the first line's indentation stays
        (`\n` and `\t` allowed, every other control character and the hidden direction characters
        are a `400`). Every required field must be supplied; an unknown key, or a value for a retired key (an unchanged `null` for a retired key is ignored), is a `400`,
        as is a value that breaks its type's rule. The thread, its opening message, its `CREATED` history entry and the activity bump of the thread and the room commit
        together. Rides the per-USER `chat-post` bucket of 120 per minute shared with the message POST (`429` beyond it); the bucket
        is spent before any guard, so a refused or invalid POST costs a token too. The request body is at most 192 KiB (`413` beyond it)
        and `fields` holds at most 20 keys whose values are primitives, `null` or a list of at most 50 option keys (anything else, a
        nested object included, is a `400` before any lock); the stored values may not exceed 439,001 characters of JSON (`400`). The write
        waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with
        `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new thread
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    get:
      tags: [threads]
      operationId: getThread
      summary: Get a thread
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, as does an unknown number). `fields` holds the ACTIVE
        fields' stored values only (a retired field keeps its value, hidden, and it returns if the field is revived); `fieldUserNames`
        maps the user ids held by USER fields to display names. `revision` is what the details PUT names in `X-Expected-Revision`.
      responses:
        '200':
          description: The thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [threads]
      operationId: updateThread
      summary: Edit a thread's title and fields
      description: |
        A member of the room or an `ADMIN` (any reader edits the open-side metadata; a non-member is the uniform `404`). Checked in this
        order: visibility (`404`), the `X-Expected-Revision` header (missing, repeated or malformed is `400`), the body (`400`), then
        under the room lock: the guard again (a caller removed while the write waited is refused), the thread (`404`), an archived room
        (`409` of type `urn:adder:problem:room-archived`), a closed thread (`409` of type `urn:adder:problem:thread-closed`: reopen it
        first), a stale revision (`409` of type `urn:adder:problem:revision-conflict`), then the field values (`400`).

        `title` is a single line of 1 to 200 characters. `fields` MERGES over the stored values: a key left out is untouched and `null`
        clears the field; a value equal to the stored one is not re-validated, so a stale value (a removed option, a user who left)
        never blocks a save. A required field cannot be cleared once set; an unknown key, or a changed value for a retired key, is a `400`.
        When nothing changed the answer is `204` with no revision bump, no history entry and no activity bump. Otherwise the revision
        becomes `revision + 1` (read the thread again for it), one `TITLE_CHANGED` and one `FIELD_CHANGED` entry per changed field are
        recorded, and the thread and the room are bumped in the activity order.

        The body is at most 192 KiB (`413` beyond it) and `fields` holds at most 20 keys whose values are primitives, `null` or a list of at most 50 option keys (anything else, a nested object included, is a `400` before any lock); the stored values may not exceed 439,001 characters of JSON (`400`).
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadUpdateRequest'
      responses:
        '204':
          description: Saved, or nothing changed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/status:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadStatus
      summary: Move a thread to a status (close, reopen)
      description: |
        A member of the room or an `ADMIN` (a non-member is the uniform `404`). A move between two OPEN statuses is open to every reader;
        a move that enters or leaves a CLOSED status - closing, reopening, or CLOSED to CLOSED - needs a STEWARD: the thread's owner
        while a member, the room's OWNER or an `ADMIN` (`403` otherwise). Which of the two applies depends on the target's category, so
        the answer is decided under the room lock after the target resolves: checked in this order visibility (`404`), the body (`400`),
        then under the lock the guard again, the thread (`404`), the target (`400` for a status key that is unknown or retired - every
        reader can read the workflow, so it discloses nothing), the steward rule (`403`), an archived room (`409` of type
        `urn:adder:problem:room-archived`, the no-op included). A closed thread is NOT refused here: reopening it, or moving it between
        CLOSED statuses, is the point.

        Setting the status the thread already has is `204` with no history entry, no activity bump and no audit line (a plain member
        is still `403` when that status is CLOSED). Otherwise the status changes, `closedAt` is set to the instant the thread closed
        (kept across CLOSED to CLOSED moves) and cleared by a move into an OPEN one, a `STATUS_CHANGED`, `CLOSED` or `REOPENED` history entry is recorded and
        the thread and the room are bumped in the activity order. A single-value set: the last writer wins, and the history records
        each change; the thread's `revision` is not moved.
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadStatusRequest'
      responses:
        '204':
          description: Moved, or already in that status
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/owner:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadOwner
      summary: Pass a thread on to another member
      description: |
        A STEWARD: the thread's owner while a member, the room's OWNER or an `ADMIN` (a non-member is the uniform `404`, a member who is
        not a steward `403`). Checked in this order: visibility (`404`), the thread (`404`) and the steward rule (`403`) on a lock-free
        read of its owner, the body (`400`), then under the room lock the guard, the thread and the steward rule again on the fresh
        rows, an archived room (`409` of type `urn:adder:problem:room-archived`), a closed thread (`409` of type
        `urn:adder:problem:thread-closed`: reopen it first), and the new owner (`400` unless `userId` is an ACTIVE member of the room).
        A removed or deleted owner keeps the thread, inert, until a steward passes it on.

        Naming the current owner again is `204` with no history entry, no activity bump and no audit line. Otherwise an `OWNER_CHANGED`
        history entry is recorded and the thread and the room are bumped in the activity order. A single-value set: the last writer
        wins, and the history records each change; the thread's `revision` is not moved.
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadOwnerRequest'
      responses:
        '204':
          description: Passed on, or already the owner
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    get:
      tags: [threads]
      operationId: listThreadEvents
      summary: List a thread's history
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, as does an unknown number). The thread's append-only
        history: structured entries (`type` plus string-map `params`: keys and ids with snapshots of labels and names) that the client
        renders in the viewer's language. Message edits and deletes are not history.

        - Sortable fields: `id`, `createdAt`. Default `-createdAt,-id` (newest first).
        - `userDeleted` marks an actor whose account has since been deleted (the recorded name stays).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of history entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadEventPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/messages:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    get:
      tags: [messages]
      operationId: listThreadMessages
      summary: List a thread's messages
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, as does an unknown number). Deleted messages are
        LISTED as tombstones (`body: null`, `deleted: true`); a single `GET` of one answers `404`.

        - Sortable field: `id` only (ascending is time). Default `-id` (newest first), so the keyset is right without a `sort` parameter.
        - Keyset paging inside the standard envelope: `id[lt]` keeps only the messages OLDER than that id, so the next page of a
          newest-first list is `id[lt]=<smallest id loaded>&page=1`. `total` is counted AFTER the `id[lt]` filter: `total > items.length`
          means older messages exist. A repeated `id[lt]` is a `400`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/IdLt'
      responses:
        '200':
          description: A page of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [messages]
      operationId: postThreadMessage
      summary: Post a message to a thread
      description: |
        A MEMBER of the room (an `ADMIN` who is not a member is `403` and joins through the Members page first; a non-member is the
        uniform `404`). Checked in this order: visibility (`404`), membership (`403`), the body (`400`), then under the room lock the
        guard again (a caller removed while the write waited is refused), the thread (`404`), an archived room (`409` of type
        `urn:adder:problem:room-archived`) and a closed thread (`409` of type `urn:adder:problem:thread-closed`: a steward reopens it first).

        `body` is Markdown of 1 to 8,000 UTF-16 units after line endings are normalised, leading blank lines and trailing whitespace
        are dropped and the first line's indentation stays (`\n` and `\t` allowed, every other control character and the hidden
        direction characters are a `400`). It is stored raw and rendered without HTML. The message, `messageCount + 1` and the
        activity bump of the thread and the room commit together. Rides the per-USER `chat-post` bucket of 120 per minute shared with
        the thread POST (`429` beyond it); the bucket is spent before any guard, so a refused or invalid POST costs a token too. The
        request body is at most 64 KiB (`413` beyond it), and the write waits at most about 3 seconds for the room's write lock before it is
        answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '201':
          description: Posted; `Location` points at the new message (`/api/v1/rooms/{id}/messages/{messageId}`)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/MessageIdPath'
    get:
      tags: [messages]
      operationId: getMessage
      summary: Get a message
      description: |
        A member of the room or an `ADMIN`. A message is addressed through its room (API-RES-006 allows two path parameters at most):
        an unknown message, a DELETED one and a message of another room are the same `404`, as is a non-member's.
      responses:
        '200':
          description: The message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [messages]
      operationId: editMessage
      summary: Edit a message
      description: |
        The message's AUTHOR while still a member of the room; nobody else edits it, a room owner and an `ADMIN` included (they may
        delete, never edit). Checked in this order: visibility (`404`), the message (`404` when it is unknown, deleted or of another
        room) and the author rule (`403`) on a lock-free read of the author, the body (`400`), then under the room lock the guard, the
        message and the author rule again on the fresh rows, an archived room (`409` of type `urn:adder:problem:room-archived`) and a
        closed thread (`409` of type `urn:adder:problem:thread-closed`).

        The body rules are those of the post. Sending the body the message already has (after normalising) is `204` with no write and
        no audit line. Otherwise the body is overwritten (no versions are kept) and `editedAt` is set; `messageCount` and the activity
        order are untouched. Last writer wins: the author alone writes it and the room lock serialises their own requests.
        The body is at most 64 KiB (`413` beyond it). Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '204':
          description: Saved, or nothing changed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Delete a message
      description: |
        The message's AUTHOR while a member, the room's OWNER or an `ADMIN` (a non-member is the uniform `404`, any other member `403`).
        A moderator removal exists because incident chat leaks credentials and the author may be asleep. Checked like the edit
        (visibility, the message and the remover rule on a lock-free read, then again under the room lock), then an archived room
        (`409` of type `urn:adder:problem:room-archived`) and a closed thread (`409` of type `urn:adder:problem:thread-closed`: a
        moderator's delete included; a steward reopens the thread, deletes and closes it again).

        The body is scrubbed, the row is marked deleted and `deleted_by` records the caller. The message stays in the thread's list
        as a tombstone (`deletedByModerator` tells an author's own delete from a moderator's); `messageCount` never goes down. A
        deleted message is `404` for every further read or write.
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/pins:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [threads]
      operationId: listRoomPins
      summary: List a room's pinned threads and messages
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, then the parameters are checked: `400`).

        A pin is of a whole thread (`kind` `THREAD`, `message` `null`) or of one message (`kind` `MESSAGE`, `message` the ordinary
        message as `GET /rooms/{id}/messages/{messageId}` answers it). A room holds at most 50 pins, so one page of 50 is the whole set;
        the answer is still the paged envelope. Every pin says who made it (`pinnedById`, `pinnedByName`: the name is read now) and when.
        A thread's `threadTitle`, `threadStatus` (the status KEY) and `threadClosed` are as the thread reads now. A deleted message has
        no pin: it leaves the list in the delete's own transaction.

        - Sortable fields: `id`, `pinnedAt`. Default `-pinnedAt,-id` (the newest pin first; pins made in the same millisecond list the later one first). No filter.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of pins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPinPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/pin:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadPin
      summary: Pin or unpin a thread
      description: |
        Any MEMBER of the room (a non-member is the uniform `404`; an `ADMIN` outside the room reads the pins but is `403` here, like
        every other write of speech). Checked in this order: visibility (`404`), the member rule (`403`), the body (`400`), then under
        the room lock the guard again on the fresh caller, the thread (`404`), an archived room (`409` of type
        `urn:adder:problem:room-archived`), the state the thread already has (`204`, nothing written, no live hint, no audit line) and,
        when pinning, the room's 51st pin (`409` of type `urn:adder:problem:pin-limit`; unpinning is never refused).

        A closed thread CAN be pinned: a pin is the room's, and "pin the thread that explains what happened" is the use. A pin is not
        activity: it moves no activity order and writes no history entry. A single-value set: the last writer wins.
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
      responses:
        '204':
          description: Pinned or unpinned, or already so
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/messages/{messageId}/pin:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/MessageIdPath'
    put:
      tags: [messages]
      operationId: setMessagePin
      summary: Pin or unpin a message
      description: |
        The same set as `setThreadPin`, for one message. Any MEMBER of the room; the order is visibility (`404`), the member rule
        (`403`), the body (`400`), then under the room lock the guard again, the message (`404` when it is unknown, DELETED or of
        another room), an archived room (`409` of type `urn:adder:problem:room-archived`), the state it already has (`204`, nothing
        written) and the room's 51st pin (`409` of type `urn:adder:problem:pin-limit`). A message of a closed thread can be pinned.
        A message and its thread can both be pinned. Deleting the message removes its pin.
        Rides the per-USER `chat-write` bucket of 240 per minute (`429` beyond it; spent before any guard, so a refused write costs a token), and, like every write of the room, waits at most about 3 seconds for the room's write lock before it is answered `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
      responses:
        '204':
          description: Pinned or unpinned, or already so
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/search:
    get:
      tags: [threads]
      operationId: searchRooms
      summary: Search the threads and messages of all the caller's rooms
      description: |
        The same full-text search as `GET /api/v1/rooms/{id}/search` (the matching, the snippets, the item and the page envelope are
        identical, and each hit says which room it is from) over every room the caller is an ACTIVE member of, an archived one included
        (`roomArchived: true`) and a deleted one never. Any authenticated caller; there is no room in the request, so there is no `404`.
        **The scope is membership and nothing else, an `ADMIN`'s too**: an `ADMIN` finds hits only in the rooms they belong to (they can
        still search any single room through `GET /api/v1/rooms/{id}/search`). A caller who belongs to no room gets an empty page. A room
        the caller is removed from is gone from the next request.

        Checked in this order: authentication (`401`), the per-USER `search` bucket of 60 per minute, shared with the room search
        (`429`; spent before anything else, so a refused search costs a token too), the parameters (`400`: no room is looked at first),
        then the query.

        - `q` (REQUIRED, 2 to 100 characters after trimming, at least one letter or digit, no control characters; repeating it is a
          `400`): case- and accent-insensitive, every term required within ONE message or the title, a term of three or more characters
          matches as a PREFIX, no operators. Exactly as the room search documents it.
        - `closed` (strict `true` or `false`, on the status category; omitted = both; a repeated key is a `400`).
        - Sortable fields: `lastActivityAt`, `createdAt`, `id`. Default `-lastActivityAt` (`id` ascending breaks ties). `pageSize` is at
          most 20 (default 20; `400` beyond).

        `total` counts matching threads across the caller's rooms. `status` is the status KEY of the thread's own room: this response does
        not carry a room's workflow, so a client shows an open or closed badge from `closed` (`GET /api/v1/rooms/{id}/workflow` holds
        the labels and colours). The search is one read under ONE deadline for all its statements (5 seconds by default): a search past it
        is answered `429` of type `urn:adder:problem:search-timeout` with `Retry-After: 2`, audited without the term (narrow the query).
        At most 4 searches run in the server at once (both search operations together): another is refused at once with `429` of type
        `urn:adder:problem:search-busy` and `Retry-After: 1` (the server is loaded; retry shortly, nothing to narrow). The cost is linear
        in the messages of the caller's rooms: a word that matches nothing reads them all. The term appears in no log line and in no
        problem body. Results are not live.
      parameters:
        - $ref: '#/components/parameters/Q'
        - name: closed
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/SearchPageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of matching threads, each naming its room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadSearchPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/live/tickets:
    post:
      tags: [live]
      operationId: mintLiveTicket
      summary: Mint a single-use ticket for the live-update WebSocket
      description: |
        Any authenticated caller, no further guard: a ticket proves nothing about any room, subscriptions are judged per room when they are
        made. The ticket (43 base64url characters) is bound to the caller and to the access token that authenticated this call, is valid
        for 30 seconds and works ONCE: the socket sends it in its FIRST FRAME and never in a URL (API-AUTH-002), so it is not logged by
        any proxy. The socket closes when that access token expires, and the client mints again. An exchange rather than a creation, so
        `200`, not `201`. No request body.

        Rides the per-USER `live-ticket` bucket of 60 per minute (`429` beyond it; spent before anything else). The server holds at most
        `live.maxTickets` (10,000) unexpired tickets in memory; past that the mint is also a `429` with `Retry-After: 30` (audited `live.ticket_saturated`).
        Tickets are per process: the deployment runs one replica. The caller may hold at most 16 sockets (one per tab): a mint beyond
        that is a `429` of type `urn:adder:problem:live-socket-limit` with `Retry-After: 60` (nothing is minted). While the server is
        stopping, already holds its maximum of sockets, or its notification listener has been down for more than 10 seconds (hints would reach nobody; the
        open sockets are closed 1013 too) the mint is a `503` of type `urn:adder:problem:live-unavailable` with `Retry-After`.
      responses:
        '200':
          description: The ticket and its expiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveTicketResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/LiveUnavailable' }
  /api/v1/live:
    get:
      tags: [live]
      operationId: connectLive
      summary: Open the live-update WebSocket
      description: |
        A WebSocket upgrade (`GET` with `Connection: Upgrade` and `Upgrade: websocket`); `101` is the only success. The route is public at the HTTP
        layer (`security: []`): the socket authenticates in-band, by its FIRST FRAME, a ticket minted by `mintLiveTicket`. The ticket never travels in
        the URL (API-AUTH-002) and the `Authorization` header never reaches the socket. A plain (non-upgrade) `GET` answers `400` after admission.

        **Admission, in order:** the per-IP `live-connect` bucket (600 a minute, `429` with `Retry-After`; it comes FIRST, so a refused request costs a
        token too); the `Origin` header (REQUIRED, `403`): its scheme must be `http` or `https` AND equal the request's own scheme, and its authority
        must equal the request's own host and port (default ports dropped, case-insensitive) or be listed in `http.corsHosts` (a `Host` header whose port is
        not a number is a `403` too); a stopping server, a full socket table, too many unauthenticated sockets from the caller's address (8 by default;
        an IPv6 address counts by its /64) or in total (`503` of type `urn:adder:problem:live-unavailable` with `Retry-After`); otherwise `101`. A browser hides a refused handshake's status from the page, so
        everything the client must act on goes on the ticket mint or into a 4xxx close code below.

        **Frames** are JSON text frames of at most 8 KiB; the client ignores unknown server frame types and fields; the server is strict
        (`LiveClientFrame`). Client to server: `{"type":"auth","ticket":"..."}` (the first frame, within 2 seconds, exactly once),
        `{"type":"subscribe","roomIds":[...]}` and `{"type":"unsubscribe","roomIds":[...]}` (1 to 128 positive ids), `{"type":"ping"}`. Server to
        client (`LiveServerFrame`): `ready` (after a good ticket; `maxSubscriptions` is 128), `subscribed` (the answer to ONE `subscribe` frame: which of its ids are now subscribed, which are `refused`
        and which are `capped` over the per-socket limit; `refused` deliberately mixes "no such room" with "not readable", like the REST `404`),
        `event` (a hint), `revoked` (the room is no longer readable, because the caller was removed from it or it was deleted: the subscription is gone, at once), `resync` (a gap: refetch everything) and `pong`.

        **Close codes:** 1000 normal; 1001 the server is stopping (reconnect after a random 1 to 5 seconds); 1003 a binary frame; 1008 a malformed,
        unknown or over-long frame, a frame before `auth`, a second `auth`, or more than 30 frames in 10 seconds; 1009 a frame over 8 KiB; 1011 an
        internal error; 4001 the access token that minted the ticket expired (mint again at once); 4003 that token was revoked, or the account
        changed (logout, deletion, password or role change), at redemption or within a minute after it (mint again; the client's refresh or
        sign-out follows); 4401 no ticket by the deadline, or an unknown, expired or used one; 4429 the per-user socket cap (16)
        was reached (pause, retry in 60 seconds); 1013 the server's socket table filled between the upgrade and the redemption, too many
        unauthenticated sockets were open, or the server's notification listener has been down for more than 10 seconds (try again with backoff). A server ping every 25 seconds keeps the connection open through proxies; a visible, authenticated
        socket is never closed for being quiet.

        **Events** (`event.kind`, `LiveEventKind`; the wire name equals the audit event of the write): `room.created`, `room.updated`,
        `room.archived`, `room.unarchived`, `room.deleted`, `room.member_added`, `room.member_role_changed`, `room.member_removed`,
        `room.workflow_updated`, `thread.created`, `thread.updated`, `thread.status_changed`, `thread.owner_changed` (these carry `threadNumber`
        for the thread kinds), `message.posted`, `message.edited` and `message.deleted` (these carry `threadNumber` and `messageId`) and
        `room.pin_changed` (a pin or unpin; it carries `threadNumber`, and `messageId` for a message pin). An event says
        THAT something changed, never what: it carries ids only, and the client refetches through the ordinary REST reads, so authorization stays
        where it is. **Delivery semantics:** a socket receives the events of the rooms it is subscribed to, in commit order per room, plus the events about
        the person itself on every socket it has, subscribed or not (`room.created` for the creator; `room.member_added` and
        `room.member_role_changed` for the person concerned); removal from a room and deletion of a room arrive as `revoked` instead (an `ADMIN`
        who is merely removed from a room keeps it and gets the `room.member_removed` event); delivery is
        AT MOST ONCE with no replay (a missed hint is covered by `resync` and by the refetch after each `subscribed`); an event is emitted only for
        a real change (a no-op write emits nothing); a socket gets at most one frame per hint. A user may subscribe to the rooms they can read (an
        `ADMIN`: every existing room).

        One socket per tab, at most 16 per user. The server is a single replica: tickets and subscriptions are per process.
      security: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string }
          description: The page's origin; a missing header, a non-http(s) scheme, a scheme other than the request's own or a foreign authority is a `403`.
      responses:
        '101':
          description: Switching Protocols - the socket is open; send the `auth` frame
        '400':
          description: Not a WebSocket upgrade (a plain `GET`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: >-
            The `Origin` header is missing, malformed, foreign or of another scheme than the request's own, or the request's `Host` cannot be read
            (audited as `live.refused` with reason `origin` and a `detail`). When `http.corsHosts` is
            set, the CORS plugin refuses a foreign origin first, with a bodiless `403` and no audit line.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/LiveUnavailable' }
  /api/v1/telemetry/current:
    get:
      tags: [telemetry]
      operationId: getTelemetryCurrent
      summary: Adder's own vital signs - processes, storage, request latency
      description: |
        ADMIN only (operational data: process sizes, container limits, storage sizes), read-only, no audit event;
        both telemetry reads share one per-user rate bucket (30/min, `429`). `.claude/docs/observability.md` "Telemetry".
        `processes` lists each sampling process (role `app`) with its latest raw sample: every live process, and the
        newest stale one when none is alive (a process that stopped stays visible for a day). `stale` = no sample for more than three
        sample intervals. A figure the process could not measure is null (no container limit outside a cgroup, no `memory.peak` on an
        old kernel) - never zero; `percentOfLimit` is the cgroup working set over the container limit, in percent. `storage` is the
        newest database / per-schema size (null before the first measurement). `requests` is the latest sample interval of the live
        processes: the `*` total and the 15 busiest routes.
      responses:
        '200':
          description: The current figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCurrent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/history:
    get:
      tags: [telemetry]
      operationId: getTelemetryHistory
      summary: The trend of one telemetry section over 24 hours, 7 days or 90 days
      description: |
        ADMIN only (guard before the query is read: `403` outranks `400`), read-only, no audit event.
        `group` picks the section and `range` the span; both are required. Buckets: `24h` = the raw sample interval (widened to a whole
        multiple of it when that would exceed 400 points), `7d` = one hour (the hourly rollups plus the raw rows of the hours not yet
        rolled up), `90d` = six hours; `bucketSeconds` says which. At most 400 points per series and 40 series (`truncated` when more
        matched); a series has points only for the buckets that hold data.
        Per-process groups merge the processes of one `role` into one series, so a trend survives a restart (`memory`, `jvm`), or all
        processes into one series per route (`requests`, `role` null); `storage` is cluster-wide (`role` null). `requests` keeps the `*`
        total (count, p50, p95, 5xx, 429) and the ten busiest routes of the range (count, p50, p95). A DELTA series' `avg` is the
        bucket's TOTAL and its `max` the largest single sample interval; a GAUGE or PERCENTILE series' `avg` is the n-weighted mean and
        `max` the largest sample. `historyFrom` is the oldest instant the range can actually hold: the first sampler boot (a fresh
        install, or retention shorter than the range).
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
            enum: [memory, storage, requests, jvm]
          description: The panel section.
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [24h, 7d, 90d]
          description: How far back the history reaches.
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400. Ids are database sequences that
      # start at 1, so 0 never addresses anything (it answers 404, like any unknown id).
      schema: { type: integer, format: int32, minimum: 1 }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
      description: A user id (int32; ids start at 1).
    ThreadNumberPath:
      name: number
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
      description: A thread's per-room number (`#42`; int32, numbering starts at 1 in every room).
    MessageIdPath:
      name: messageId
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
      description: A message id (int32; ids start at 1).
    IdLt:
      name: id[lt]
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 1 }
      description: Keyset filter of a message list - only rows whose `id` is below this value (the older messages). A repeated key is a `400`.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`, and so is a field named
        twice (with or without `-`) or a list longer than the whitelist. `id` ascending is
        always appended as a deterministic tiebreaker.
    DirectoryPageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      description: Rows per page for the user directory only. Defaults to 20, maximum 20 (the shared maximum is 100).
    SearchPageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      description: Rows per page for the search only (a hit carries up to three snippets). Defaults to 20, maximum 20 (the shared maximum is 100).
    Q:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 100 }
      description: >-
        Free-text search (API-LIST-005), REQUIRED where declared. Case- and accent-insensitive; the endpoint says how it
        matches (a substring, or whole words and prefixes) and what it searches. The value is trimmed before the length
        limits apply, so it needs 2 to 100 characters (code points) after trimming.
    ThreadStatusFilter:
      name: status
      in: query
      required: false
      description: Repeatable - any of these status keys (the thread list). A well-formed key that is not a status of the room matches nothing; a malformed one, or more than 20 distinct values, is a `400`.
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items: { type: string, maxLength: 40, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
      style: form
      explode: true
    ThreadOwnerFilter:
      name: ownerId
      in: query
      required: false
      description: Repeatable - any of these owner ids (the thread list; "mine" is the caller's own id). An id that owns nothing matches nothing; a non-positive or non-integer one, or more than 20 distinct values, is a `400`.
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items: { type: integer, format: int32, minimum: 1 }
      style: form
      explode: true
    ThreadMentionFilter:
      name: mentionedUserId
      in: query
      required: false
      description: Repeatable - a live message of the thread mentions any of these people (the thread list; "mentions me" is the caller's own id). An id nobody was mentioned as matches nothing; a non-positive or non-integer one, or more than 20 distinct values, is a `400`.
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items: { type: integer, format: int32, minimum: 1 }
      style: form
      explode: true
    ThreadFieldFilter:
      name: field
      in: query
      required: false
      description: >-
        Repeatable `key:value` (the thread list): the field's key, a colon, then an option key (SELECT, MULTI_SELECT) or a user id
        (USER). Any-of within one key, all-of across keys; at most 20 distinct pairs. The key must be an ACTIVE SELECT, MULTI_SELECT or
        USER field of the room; any other key, a missing colon or a value of the wrong shape is a `400`.
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          maxLength: 81
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*:([a-z][a-z0-9]*(-[a-z0-9]+)*|[0-9]+)$'
      style: form
      explode: true
    ThreadTagFilter:
      name: tag
      in: query
      required: false
      description: >-
        Repeatable - any of these hashtags, without the `#` (the thread list): a tag as written, or a key of the room's tag list as
        returned (folding can add punctuation and length, so up to 150 characters, no control characters). Folded like the stored tags
        (case and accents ignored). A tag that no live message carries matches nothing; a malformed value, or more than 10 distinct
        values after case folding, is a `400`. A request may carry at most 50 distinct raw values (more is a `400`), which must fold to
        at most 10.
      schema:
        type: array
        minItems: 1
        maxItems: 10
        items: { type: string, minLength: 1, maxLength: 150 }
      style: form
      explode: true
    ExpectedRevision:
      name: X-Expected-Revision
      in: header
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: |
        The revision of the document the caller read (`revision`, or a room's `workflowRevision`). Missing, repeated or
        malformed is a `400`; a stale one is a `409` of type `urn:adder:problem:revision-conflict`. Every successful PUT
        bumps the revision.
  responses:
    UnsupportedMediaType:
      description: Request body must use application/json. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing, invalid or no longer valid token (revoked, or the account was deleted, demoted or re-credentialed since it was issued)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    LiveUnavailable:
      description: >-
        The live channel cannot take another socket right now: the server is stopping, holds its maximum of sockets or of unauthenticated
        sockets (in total or from the caller's address), or its notification listener is down (`urn:adder:problem:live-unavailable`). Retry after the stated seconds; every other route is unaffected.
      headers:
        Retry-After:
          required: true
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail), on a telemetry read
        (`/api/v1/telemetry/**`) the per-USER telemetry bucket is exhausted (30/min), on the user directory
        (`/api/v1/users/directory`) the per-USER directory bucket is exhausted (120/min), on creating or
        renaming a room (`POST /api/v1/rooms`, `PUT /api/v1/rooms/{id}`) the per-USER room-name bucket (shared by both) is exhausted (30/min),
        on adding room members (`POST /api/v1/rooms/{id}/members`) the per-USER room-members bucket is exhausted (60/min), on starting a thread or posting a message
        (`POST /api/v1/rooms/{id}/threads`, `POST /api/v1/rooms/{id}/threads/{number}/messages`) the per-USER chat-post bucket (shared by both) is exhausted (120/min), on the other thread
        and message writes (the thread details, status and owner PUTs, a message edit and a message delete) the per-USER chat-write bucket (shared by all five) is exhausted (240/min),
        on the thread list and the tag list (`GET /api/v1/rooms/{id}/threads`, `GET /api/v1/rooms/{id}/tags`) the per-USER chat-read bucket (shared by both) is exhausted (300/min), the read outruns its deadline (`urn:adder:problem:read-timeout`, `Retry-After: 2`), or the caller or the server already runs its maximum of list reads (`urn:adder:problem:read-busy`, `Retry-After: 1`),
        on a search (`GET /api/v1/rooms/{id}/search`, `GET /api/v1/search`) the per-USER search bucket (shared by both) is exhausted (60/min), or the search outruns its request deadline (`urn:adder:problem:search-timeout`, `Retry-After: 2`), or the server already runs its maximum of concurrent searches (`urn:adder:problem:search-busy`, `Retry-After: 1`), on minting a live-update ticket (`POST /api/v1/live/tickets`) the per-USER live-ticket bucket is exhausted (60/min), the server already holds its maximum of pending tickets (answered with `Retry-After: 30`) or the caller already holds 16 sockets (`urn:adder:problem:live-socket-limit`, `Retry-After: 60`), on the live-update WebSocket (`GET /api/v1/live`) the per-IP live-connect bucket is exhausted (600/min), or, on /login, the
        per-account lockout is active (account-specific detail). Any room write (the record, archive, delete, workflow, member, thread and message writes) whose room stayed locked by other
        writers for about 3 seconds is a `429` of type `urn:adder:problem:room-busy` with `Retry-After: 1` (retry; nothing was written). `Retry-After` is sent with the `room-busy` 429, the `search-timeout`, `read-timeout` and `read-busy` 429s, the per-bucket 429s and the live-ticket store's full `429` (30 s, the ticket TTL), not with the login lockout, so it is
        declared optional. All carry a ProblemDetail body.
      headers:
        Retry-After:
          required: false
          description: Seconds to wait before retrying; sent with `room-busy`, `search-timeout`, `read-timeout`, `read-busy` and the rate-limit bucket 429s.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the ceiling — 512 KiB globally, 16 KiB on the anonymous auth routes
        (login, MFA, refresh, password reset), the room member add and the thread status and owner PUTs, 64 KiB on a message post or edit and 192 KiB
        on a thread create or details edit — a memory-DoS backstop shared by
        every endpoint, so declared on every operation that takes a body (field-level maxLength
        rules reject oversized values far earlier on ordinary payloads). Cross-cutting for the
        coverage gate: pinned once by `PayloadValidationTest`, never once per operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: >-
        Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use 256-bit reset credential from the email; never logged or returned.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 71
          description: The new password; at most 71 UTF-8 bytes (bcrypt ceiling).

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V1) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    LiveTicketResponse:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket:
          type: string
          minLength: 43
          maxLength: 43
          description: Opaque single-use ticket (32 random bytes, base64url). Send it as the socket's first frame; never put it in a URL.
        expiresAt:
          type: integer
          format: int64
          description: Ticket expiry as Unix epoch milliseconds (30 seconds after the mint).

    LiveEventKind:
      type: string
      description: What changed; the wire name equals the audit event of the write (the catalog is in the `connectLive` description).
      enum:
        - room.created
        - room.updated
        - room.archived
        - room.unarchived
        - room.deleted
        - room.member_added
        - room.member_role_changed
        - room.member_removed
        - room.workflow_updated
        - thread.created
        - thread.updated
        - thread.status_changed
        - thread.owner_changed
        - message.posted
        - message.edited
        - message.deleted
        - room.pin_changed
    LiveAuthFrame:
      type: object
      required: [type, ticket]
      description: The FIRST frame of a socket, within 2 seconds, exactly once.
      properties:
        type: { type: string, enum: [auth] }
        ticket: { type: string, minLength: 43, maxLength: 43, description: The single-use ticket of `mintLiveTicket`. }
    LiveSubscribeFrame:
      type: object
      required: [type, roomIds]
      description: Subscribe to rooms the caller can read; answered by one `subscribed` frame.
      properties:
        type: { type: string, enum: [subscribe] }
        roomIds: { type: array, minItems: 1, maxItems: 128, items: { type: integer, format: int64, minimum: 1, maximum: 4294967295 } }
    LiveUnsubscribeFrame:
      type: object
      required: [type, roomIds]
      description: Drop subscriptions; no answer.
      properties:
        type: { type: string, enum: [unsubscribe] }
        roomIds: { type: array, minItems: 1, maxItems: 128, items: { type: integer, format: int64, minimum: 1, maximum: 4294967295 } }
    LivePingFrame:
      type: object
      required: [type]
      description: Application-level keep-alive; answered by `pong`.
      properties:
        type: { type: string, enum: [ping] }
    LiveClientFrame:
      description: A frame the client sends (JSON text, at most 8 KiB, parsed strictly).
      oneOf:
        - $ref: '#/components/schemas/LiveAuthFrame'
        - $ref: '#/components/schemas/LiveSubscribeFrame'
        - $ref: '#/components/schemas/LiveUnsubscribeFrame'
        - $ref: '#/components/schemas/LivePingFrame'
      discriminator:
        propertyName: type
        mapping:
          auth: '#/components/schemas/LiveAuthFrame'
          subscribe: '#/components/schemas/LiveSubscribeFrame'
          unsubscribe: '#/components/schemas/LiveUnsubscribeFrame'
          ping: '#/components/schemas/LivePingFrame'
    LiveReadyFrame:
      type: object
      required: [type, protocol, maxSubscriptions]
      description: The ticket was good; the socket is authenticated.
      properties:
        type: { type: string, enum: [ready] }
        protocol: { type: integer, format: int32, description: The protocol version (1). }
        maxSubscriptions: { type: integer, format: int32, description: Subscriptions allowed per socket (128). }
    LiveSubscribedFrame:
      type: object
      required: [type, roomIds, refused, capped]
      description: >-
        The answer to ONE `subscribe` frame, about that frame's ids only: `roomIds` are subscribed now, `refused` are rooms that do not exist or the
        caller cannot read (deliberately indistinguishable) and `capped` are ids over the per-socket subscription limit.
      properties:
        type: { type: string, enum: [subscribed] }
        roomIds: { type: array, items: { type: integer, format: int32, minimum: 0 } }
        refused: { type: array, items: { type: integer, format: int32, minimum: 0 } }
        capped: { type: array, items: { type: integer, format: int32, minimum: 0 } }
    LiveEventFrame:
      type: object
      required: [type, kind, roomId]
      description: A hint that something changed; ids only, never what.
      properties:
        type: { type: string, enum: [event] }
        kind: { $ref: '#/components/schemas/LiveEventKind' }
        roomId: { type: integer, format: int32, minimum: 0 }
        threadNumber: { type: integer, format: int32, description: The thread's per-room number; present for the thread and message kinds. }
        messageId: { type: integer, format: int32, minimum: 0, description: Present for the message kinds. }
    LiveRevokedFrame:
      type: object
      required: [type, roomId]
      description: The room is no longer readable by the caller (removed, or the room was deleted); the subscription is gone.
      properties:
        type: { type: string, enum: [revoked] }
        roomId: { type: integer, format: int32, minimum: 0 }
    LiveResyncFrame:
      type: object
      required: [type]
      description: 'A gap (a listener outage or an overflowing queue), so refetch everything the page shows.'
      properties:
        type: { type: string, enum: [resync] }
    LivePongFrame:
      type: object
      required: [type]
      description: The answer to a `ping`.
      properties:
        type: { type: string, enum: [pong] }
    LiveServerFrame:
      description: A frame the server sends (JSON text). A client ignores unknown types and unknown fields.
      oneOf:
        - $ref: '#/components/schemas/LiveReadyFrame'
        - $ref: '#/components/schemas/LiveSubscribedFrame'
        - $ref: '#/components/schemas/LiveEventFrame'
        - $ref: '#/components/schemas/LiveRevokedFrame'
        - $ref: '#/components/schemas/LiveResyncFrame'
        - $ref: '#/components/schemas/LivePongFrame'
      discriminator:
        propertyName: type
        mapping:
          ready: '#/components/schemas/LiveReadyFrame'
          subscribed: '#/components/schemas/LiveSubscribedFrame'
          event: '#/components/schemas/LiveEventFrame'
          revoked: '#/components/schemas/LiveRevokedFrame'
          resync: '#/components/schemas/LiveResyncFrame'
          pong: '#/components/schemas/LivePongFrame'

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    UserDirectoryEntry:
      type: object
      required: [id, name, email]
      description: The whole directory projection - nothing else about a user is exposed.
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        email: { type: string }

    UserDirectoryPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserDirectoryEntry'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a user; must be active (`400` otherwise).
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a user; must be active (`400` otherwise). Omitted on PUT (a full replace) = no manager.
    TeamMember:
      type: object
      required: [userId, name, email]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
    TeamResponse:
      type: object
      required: [id, name, managerUserId, managerName, members, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager; null when unset or when the assigned user was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's display name; null with `managerUserId`. }
        members:
          type: array
          maxItems: 200
          description: The roster - ACTIVE users only (a soft-deleted member is absent), by name then id; a team holds at most 200.
          items:
            $ref: '#/components/schemas/TeamMember'
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, managerUserId, managerName, memberCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager; null when unset or when the assigned user was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's display name; null with `managerUserId`. }
        memberCount: { type: integer, format: int32, minimum: 0, description: The roster size - ACTIVE users only. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    WorkflowLabel:
      type: object
      required: [en]
      additionalProperties: false
      description: >-
        A label per language: `en` is required, `pl` optional (omit it to leave the label untranslated; a present blank value is a
        `400`); no other language is accepted. Each value is 1-60 characters after trimming.
      properties:
        en: { type: string, minLength: 1, maxLength: 60 }
        pl: { type: string, minLength: 1, maxLength: 60 }
    WorkflowStatus:
      type: object
      required: [key, label, colour, category, initial]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: An immutable lower-case slug (`in-progress`), unique within the document.
        label: { $ref: '#/components/schemas/WorkflowLabel' }
        colour: { $ref: '#/components/schemas/StatusColour' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        initial:
          type: boolean
          description: Exactly one status of a document is the initial one, and it is in the `OPEN` category.
    WorkflowOption:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { $ref: '#/components/schemas/WorkflowLabel' }
    WorkflowField:
      type: object
      required: [key, label, type, required, options]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: An immutable lower-case slug, unique within the document.
        label: { $ref: '#/components/schemas/WorkflowLabel' }
        type: { $ref: '#/components/schemas/FieldType' }
        required: { type: boolean }
        options:
          type: array
          maxItems: 50
          description: 1-50 options for `SELECT` and `MULTI_SELECT`; empty for every other type.
          items:
            $ref: '#/components/schemas/WorkflowOption'
    StatusColour:
      type: string
      enum: [GRAY, RED, ORANGE, BLUE, GRAPE, TEAL]
      description: The semantic colour of a status; the web app maps it to its hue.
    StatusCategory:
      type: string
      enum: [OPEN, CLOSED]
      description: A thread in a `CLOSED` status is closed - no further activity until it is reopened.
    FieldType:
      type: string
      enum: [TEXT, NUMBER, DATE, SELECT, MULTI_SELECT, USER, URL]
    WorkflowTemplateRequest:
      type: object
      required: [name, statuses, fields]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        statuses:
          type: array
          minItems: 2
          maxItems: 20
          items:
            $ref: '#/components/schemas/WorkflowStatus'
        fields:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/WorkflowField'
    WorkflowTemplateResponse:
      type: object
      required: [id, name, statuses, fields, revision, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStatus'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowField'
        revision:
          type: integer
          format: int64
          minimum: 1
          description: The optimistic-concurrency token; a PUT names it in `X-Expected-Revision`. Starts at 1, every successful PUT bumps it.
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    WorkflowTemplateListItem:
      type: object
      required: [id, name, statusCount, fieldCount, revision, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        statusCount: { type: integer, format: int32, minimum: 0 }
        fieldCount: { type: integer, format: int32, minimum: 0 }
        revision: { type: integer, format: int64, minimum: 1 }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    WorkflowTemplatePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTemplateListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    RoomCreateRequest:
      type: object
      required: [name, templateId]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        templateId:
          type: integer
          format: int32
          minimum: 1
          description: The workflow template to copy; unknown or deleted is a `400`.
        language:
          $ref: '#/components/schemas/Language'
    RoomUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
    RoomListItem:
      type: object
      required: [id, name, archived, role, memberCount, lastActivityAt, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        archived: { type: boolean }
        role:
          type: string
          enum: [OWNER, MEMBER]
          nullable: true
          description: The CALLER's role in the room; `null` for an `ADMIN` who is not a member.
        memberCount: { type: integer, format: int32, minimum: 0, description: Active members only }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis of the room's latest thread or message activity; the creation time until there is any }
        createdAt: { type: integer, format: int64, description: Epoch millis }
    RoomResponse:
      type: object
      required: [id, name, archived, role, memberCount, workflowRevision, lastActivityAt, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        archived: { type: boolean }
        archivedAt: { type: integer, format: int64, nullable: true, description: Epoch millis; `null` while the room is active }
        role:
          type: string
          enum: [OWNER, MEMBER]
          nullable: true
          description: The CALLER's role in the room; `null` for an `ADMIN` who is not a member.
        memberCount: { type: integer, format: int32, minimum: 0, description: Active members only }
        workflowRevision:
          type: integer
          format: int64
          minimum: 1
          description: The room workflow's optimistic-concurrency token (`X-Expected-Revision` of its PUT). Starts at 1.
        lastActivityAt: { type: integer, format: int64, description: Epoch millis of the room's latest thread or message activity; the creation time until there is any }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    RoomPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    RoomRole:
      type: string
      enum: [OWNER, MEMBER]
      description: A member's role in a room.
    RoomMember:
      type: object
      required: [userId, name, email, role, addedAt]
      properties:
        userId: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/RoomRole' }
        addedAt: { type: integer, format: int64, description: Epoch millis }
    RoomMemberPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomMember'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    RoomMembersAddRequest:
      type: object
      description: At least one of `userIds` and `teamId` is required (`400` otherwise).
      properties:
        userIds:
          type: array
          maxItems: 200
          items: { type: integer, format: int32, minimum: 1 }
          description: Active users to add; an unknown or deleted id is a `400`. Duplicates collapse.
        teamId:
          type: integer
          format: int32
          minimum: 1
          description: A team whose ACTIVE roster is added as a snapshot; an unknown or deleted team is a `400`.
    RoomMembersAddResult:
      type: object
      required: [added, alreadyMembers]
      properties:
        added: { type: integer, format: int32, minimum: 0, description: People who became members now }
        alreadyMembers: { type: integer, format: int32, minimum: 0, description: Requested people (and team roster members) who already belonged }
    RoomMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/RoomRole' }
    RoomWorkflowStatus:
      type: object
      required: [key, label, colour, category, initial, threadCount]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: An immutable lower-case slug, reserved for the life of the room.
        label: { type: string, minLength: 1, maxLength: 60, description: Plain text in the language the room was created with }
        colour: { $ref: '#/components/schemas/StatusColour' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        initial:
          type: boolean
          description: Exactly one status is the initial one, and it is in the `OPEN` category.
        threadCount: { type: integer, format: int64, minimum: 0, description: The threads currently in this status }
    RoomWorkflowStatusDef:
      type: object
      required: [key, label, colour, category, initial]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { type: string, minLength: 1, maxLength: 60 }
        colour: { $ref: '#/components/schemas/StatusColour' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        initial:
          type: boolean
          description: Exactly one status is the initial one, and it is in the `OPEN` category.
    RoomWorkflowUpdate:
      type: object
      required: [statuses, fields]
      properties:
        statuses:
          type: array
          minItems: 2
          maxItems: 20
          description: The ACTIVE statuses in the new order.
          items:
            $ref: '#/components/schemas/RoomWorkflowStatusDef'
        fields:
          type: array
          maxItems: 20
          description: The ACTIVE fields in the new order.
          items:
            $ref: '#/components/schemas/RoomWorkflowField'
        replacements:
          type: object
          maxProperties: 20
          additionalProperties: { type: string }
          description: >-
            `{retiredKey: replacementKey}`: where the threads of each status this change retires move. The target must be a
            status of the new document in the same category. Omit it when no status that threads use is retired.
    RoomWorkflowOption:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { type: string, minLength: 1, maxLength: 60 }
    RoomWorkflowField:
      type: object
      required: [key, label, type, required, options]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: '#/components/schemas/FieldType' }
        required: { type: boolean }
        options:
          type: array
          maxItems: 50
          description: 1-50 options for `SELECT` and `MULTI_SELECT`; empty for every other type.
          items:
            $ref: '#/components/schemas/RoomWorkflowOption'
    RoomWorkflow:
      type: object
      required: [revision, statuses, fields]
      properties:
        revision: { type: integer, format: int64, minimum: 1, description: The token a workflow PUT names in `X-Expected-Revision` }
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/RoomWorkflowStatus'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/RoomWorkflowField'

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: >-
            A URI reference identifying the problem type; `about:blank` unless a conflict is typed
            (`urn:adder:problem:…`, e.g. `revision-conflict` on a 409 or `room-busy` on a 429).
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
        keys:
          type: array
          items: { type: string }
          description: >-
            Extension member, present only on a workflow conflict that is about specific keys (the statuses or fields
            the conflict names).

    ThreadFieldValues:
      type: object
      description: |
        Field values by field key. Per type: TEXT a single-line string of at most 500 characters (blank means unset); NUMBER a finite
        JSON number whose magnitude is at most 1e15; DATE a real calendar day as a `YYYY-MM-DD` string; SELECT one option key;
        MULTI_SELECT 1 to 50 distinct option keys (an empty array means unset); USER the id of an active member of the room;
        URL an absolute `http` or `https` URL of at most 2,000 characters with no user name or password and no control or hidden direction
        character. `null` means unset. A value of the wrong JSON type is a `400`; so is a nested object, or a request with more than 20 keys (a request carries at most 20 keys, even when one is an unchanged retired key).
      maxProperties: 20
      additionalProperties:
        anyOf:
          - { type: string, nullable: true }
          - { type: number }
          - type: array
            maxItems: 50
            items: { type: string }
    ThreadCreateRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: A single line; trimmed. }
        body:
          type: string
          minLength: 1
          maxLength: 8000
          description: The opening message, Markdown (stored raw, rendered without HTML). Line endings are normalised; leading blank lines and trailing whitespace are dropped, the first line's indentation stays.
        fields:
          $ref: '#/components/schemas/ThreadFieldValues'
    ThreadUpdateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: A single line; trimmed. }
        fields:
          description: |
            MERGED over the stored values, not a full replace (a documented exception to API-RES-004): a retired field's value is hidden
            on read and cannot be sent back, so replacing would erase it. An omitted key keeps its value; send `null` to clear it.
          allOf:
            - $ref: '#/components/schemas/ThreadFieldValues'
    ThreadStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1, maxLength: 40, description: The KEY of an active status of the room's workflow. }
    ThreadOwnerRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: integer, format: int32, minimum: 1, description: The id of an active member of the room. }
    ThreadResponse:
      type: object
      required:
        - id
        - number
        - title
        - status
        - closed
        - closedAt
        - ownerId
        - ownerName
        - createdById
        - createdByName
        - fields
        - fieldUserNames
        - messageCount
        - revision
        - lastActivityAt
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        number: { type: integer, format: int32, minimum: 1, description: The per-room number (`#42`); never reused. }
        title: { type: string }
        status: { type: string, description: The status KEY; its label and colour are in the room's workflow. }
        closed: { type: boolean, description: The status is in a CLOSED category; the thread takes no further activity until it is reopened. }
        closedAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the instant the thread closed (kept across CLOSED to CLOSED moves); `null` while open. }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        createdById: { type: integer, format: int32, minimum: 1 }
        createdByName: { type: string }
        fields:
          $ref: '#/components/schemas/ThreadFieldValues'
        fieldUserNames:
          type: object
          readOnly: true
          description: Display names of the users held by USER fields, by user id.
          additionalProperties: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0, description: 'Every message: the opener and deleted ones included; it never goes down.' }
        revision: { type: integer, format: int64, minimum: 1, description: The token the details PUT names in `X-Expected-Revision`. Starts at 1. }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    ThreadListItem:
      type: object
      required: [id, number, title, status, closed, ownerId, ownerName, messageCount, lastActivityAt, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        number: { type: integer, format: int32, minimum: 1 }
        title: { type: string }
        status: { type: string, description: The status KEY. }
        closed: { type: boolean }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0 }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        createdAt: { type: integer, format: int64, description: Epoch millis }
    ThreadPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    RoomTag:
      type: object
      required: [tag, threadCount]
      properties:
        tag:
          type: string
          minLength: 1
          maxLength: 150
          description: The FOLDED tag without its `#` (lower case, accents stripped); what the thread list's `tag` filter takes.
        threadCount:
          type: integer
          format: int64
          minimum: 1
          description: Distinct threads, open and closed, that have a live message carrying the tag.
    RoomTagPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomTag'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    SnippetSegment:
      type: object
      required: [text, hit]
      description: One run of a snippet. `text` is PLAIN text from the Markdown source (render it as text, never as HTML or Markdown).
      properties:
        text: { type: string }
        hit: { type: boolean, description: True for the words that matched the query. }
    MessageSearchHit:
      type: object
      required: [id, authorId, authorName, createdAt, snippet]
      properties:
        id: { type: integer, format: int32, minimum: 1, description: 'The message id (the key of `GET /rooms/{id}/messages/{messageId}`).' }
        authorId: { type: integer, format: int32, minimum: 1 }
        authorName: { type: string }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        snippet:
          type: array
          description: A fragment of the message, at most two pieces of 6 to 18 words joined by an ellipsis, its hits marked.
          items:
            $ref: '#/components/schemas/SnippetSegment'
    ThreadSearchHit:
      type: object
      required: [roomId, roomName, roomArchived, threadNumber, title, titleSnippet, status, closed, ownerId, ownerName, messageCount, lastActivityAt, matchCount, messages]
      properties:
        roomId: { type: integer, format: int32, minimum: 1 }
        roomName: { type: string }
        roomArchived: { type: boolean, description: An archived room is searched and labelled. }
        threadNumber: { type: integer, format: int32, minimum: 1 }
        title: { type: string }
        titleSnippet:
          type: array
          description: The whole title, its hits marked (one plain segment when only a message matched).
          items:
            $ref: '#/components/schemas/SnippetSegment'
        status: { type: string, description: The status KEY. }
        closed: { type: boolean }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0 }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        matchCount: { type: integer, format: int64, minimum: 0, description: How many live messages of the thread match (0 for a title-only hit). }
        messages:
          type: array
          maxItems: 3
          description: The three newest matching live messages, newest first.
          items:
            $ref: '#/components/schemas/MessageSearchHit'
    ThreadSearchPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ThreadSearchHit'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 20 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Matching threads.
    ThreadEventType:
      type: string
      description: |
        The kind of a history entry (persisted, never renamed). The `params` of each: `CREATED` `{title, status, statusLabel}`;
        `TITLE_CHANGED` `{from, to}`; `STATUS_CHANGED`, `CLOSED`, `REOPENED` and `STATUS_REPLACED` `{from, to, fromLabel, toLabel}`
        (status keys and the labels at that moment); `OWNER_CHANGED` `{fromId, toId, fromName, toName}`; `FIELD_CHANGED`
        `{field, fieldLabel, from?, to?}` (display text; an absent side means unset).
      enum: [CREATED, TITLE_CHANGED, STATUS_CHANGED, CLOSED, REOPENED, OWNER_CHANGED, FIELD_CHANGED, STATUS_REPLACED]
    ThreadEvent:
      type: object
      required: [id, userId, userName, userDeleted, type, params, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        userId: { type: integer, format: int32, minimum: 1, description: The acting user. }
        userName: { type: string }
        userDeleted: { type: boolean, description: The acting account has since been deleted. }
        type: { $ref: '#/components/schemas/ThreadEventType' }
        params:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: integer, format: int64, description: Epoch millis }
    ThreadEventPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadEvent'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    MessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 8000
          description: Markdown (stored raw, rendered without HTML). Line endings are normalised; leading blank lines and trailing whitespace are dropped, the first line's indentation stays.
    MessageResponse:
      type: object
      required: [id, threadNumber, authorId, authorName, body, deleted, deletedByModerator, editedAt, createdAt, mentions]
      properties:
        id: { type: integer, format: int32, minimum: 1, description: Ascending in time; the keyset a list pages by. }
        threadNumber: { type: integer, format: int32, minimum: 1, description: The per-room number of the message's thread. }
        authorId: { type: integer, format: int32, minimum: 1 }
        authorName: { type: string }
        body: { type: string, nullable: true, description: 'Markdown; `null` on a tombstone (a deleted message in a list), whose `editedAt` is `null` too.' }
        deleted: { type: boolean }
        deletedByModerator: { type: boolean, description: 'A room owner or an ADMIN removed it (an author''s own delete is `false`); always `false` while not deleted.' }
        editedAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the last edit; `null` while the body is as posted and on a tombstone. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        mentions:
          type: array
          maxItems: 20
          description: The room members the body mentions with `<@id>` (an active member when the message was written or edited), by their CURRENT display name, ordered by user id; empty on a tombstone and on a message written before mentions were indexed. A token whose id is not listed here is plain text.
          items: { $ref: '#/components/schemas/MentionedUser' }
    MentionedUser:
      type: object
      required: [userId, name]
      properties:
        userId: { type: integer, format: int32, minimum: 1, description: The id inside the `<@id>` token. }
        name: { type: string, description: The person's current display name (a soft-deleted account keeps its last one). }
    MessagePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: The rows matching the filters, `id[lt]` included - so `total` greater than the items loaded means older messages exist.
    PinRequest:
      type: object
      required: [pinned]
      properties:
        pinned: { type: boolean, description: 'Whether the thread or message is pinned after the call.' }
    RoomPin:
      type: object
      required: [id, kind, threadNumber, threadTitle, threadStatus, threadClosed, message, pinnedById, pinnedByName, pinnedAt]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        kind: { type: string, enum: [THREAD, MESSAGE], description: What the pin points at. }
        threadNumber: { type: integer, format: int32, minimum: 1, description: 'The per-room number of the pinned thread, or of the pinned message''s thread.' }
        threadTitle: { type: string }
        threadStatus: { type: string, description: The thread's status KEY. }
        threadClosed: { type: boolean }
        message:
          allOf:
            - $ref: '#/components/schemas/MessageResponse'
          nullable: true
          description: The pinned message as it reads now; `null` for a thread pin.
        pinnedById: { type: integer, format: int32, minimum: 1 }
        pinnedByName: { type: string, description: Read now (a deleted account keeps its recorded name). }
        pinnedAt: { type: integer, format: int64, description: Epoch millis }
    RoomPinPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomPin'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    TelemetryCurrent:
      type: object
      required: [generatedAt, sampleIntervalSeconds, processes, storage, notifyQueue, requests]
      properties:
        generatedAt: { type: integer, format: int64, description: Epoch millis }
        sampleIntervalSeconds: { type: integer, format: int32, description: The cadence of the raw samples; also the `requests` window. }
        processes:
          type: array
          items: { $ref: '#/components/schemas/TelemetryProcess' }
        storage:
          allOf: [{ $ref: '#/components/schemas/TelemetryStorage' }]
          nullable: true
          description: The newest storage measurement; null until the cluster section has taken one.
        notifyQueue:
          allOf: [{ $ref: '#/components/schemas/TelemetryNotifyQueue' }]
          nullable: true
          description: The newest NOTIFY-queue reading, independent of `storage` (its own cadence); null until one was taken.
        requests: { $ref: '#/components/schemas/TelemetryRequests' }
    TelemetryProcess:
      type: object
      description: One sampling process (a JVM run) with its latest raw sample.
      required: [id, role, instance, startedAt, lastSeenAt, sampledAt, stale, version, commit, memory, jvm]
      properties:
        id: { type: integer, format: int32 }
        role: { type: string, description: 'The process role; `app`.' }
        instance: { type: string, description: The pod or host name. }
        startedAt: { type: integer, format: int64, description: Epoch millis of the JVM start }
        lastSeenAt: { type: integer, format: int64, description: Epoch millis of the latest sample tick }
        sampledAt: { type: integer, format: int64, nullable: true, description: The bucket of the sample the figures come from; null when none is retained. }
        stale: { type: boolean, description: No sample for more than three sample intervals. }
        version: { type: string, nullable: true, description: The image build version (null outside the image). }
        commit: { type: string, nullable: true, description: The image build commit (null outside the image). }
        memory: { $ref: '#/components/schemas/TelemetryMemory' }
        jvm: { $ref: '#/components/schemas/TelemetryJvm' }
    TelemetryMemory:
      type: object
      description: Bytes; a figure the process could not measure is null.
      required:
        - heapUsedBytes
        - heapCommittedBytes
        - heapMaxBytes
        - oldGenPeakBytes
        - nonHeapBytes
        - directBytes
        - rssBytes
        - cgroupCurrentBytes
        - cgroupAnonBytes
        - workingSetBytes
        - cgroupPeakBytes
        - containerLimitBytes
        - percentOfLimit
      properties:
        heapUsedBytes: { type: integer, format: int64, nullable: true }
        heapCommittedBytes: { type: integer, format: int64, nullable: true }
        heapMaxBytes: { type: integer, format: int64 }
        oldGenPeakBytes: { type: integer, format: int64, nullable: true, description: The old generation's peak over the latest sample interval. }
        nonHeapBytes: { type: integer, format: int64, nullable: true }
        directBytes: { type: integer, format: int64, nullable: true }
        rssBytes: { type: integer, format: int64, nullable: true }
        cgroupCurrentBytes: { type: integer, format: int64, nullable: true }
        cgroupAnonBytes: { type: integer, format: int64, nullable: true }
        workingSetBytes: { type: integer, format: int64, nullable: true, description: '`memory.current - inactive_file`: what the kubelet evicts on.' }
        cgroupPeakBytes: { type: integer, format: int64, nullable: true, description: The cgroup's LIFETIME peak. }
        containerLimitBytes: { type: integer, format: int64, nullable: true }
        percentOfLimit:
          type: number
          format: double
          nullable: true
          description: '`workingSetBytes` over `containerLimitBytes`, in percent (one decimal; may exceed 100); null without a limit or a working set.'
    TelemetryJvm:
      type: object
      required: [cpuRatio, threads, gcCount, gcTimeMs, poolAcquired, poolIdle, poolPending, poolAllocated, liveSockets, liveListenerUp]
      properties:
        cpuRatio: { type: number, format: double, nullable: true, description: Process CPU time over wall time as a fraction of the available processors (0..1). }
        threads: { type: integer, format: int32, nullable: true }
        gcCount: { type: integer, format: int64, nullable: true, description: 'Collections over the latest sample interval, all collectors summed.' }
        gcTimeMs: { type: integer, format: int64, nullable: true, description: 'Collection time over the latest sample interval, all collectors summed.' }
        poolAcquired: { type: integer, format: int32, nullable: true }
        poolIdle: { type: integer, format: int32, nullable: true }
        poolPending: { type: integer, format: int32, nullable: true }
        poolAllocated: { type: integer, format: int32, nullable: true }
        liveSockets: { type: integer, format: int32, nullable: true, description: Authenticated live-channel sockets of the process at its latest sample. }
        liveListenerUp: { type: boolean, nullable: true, description: 'Whether the process''s live LISTEN session was up at its latest sample; null before the listener started (it starts on the first ticket mint) or without a sample.' }
    TelemetryStorage:
      type: object
      required: [measuredAt, databaseBytes, schemas]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        databaseBytes: { type: integer, format: int64, description: '`pg_database_size`.' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/TelemetrySchemaSize' }
    TelemetryNotifyQueue:
      type: object
      description: 'How full the cluster''s NOTIFY queue was (`pg_notification_queue_usage()`), measured every sample interval.'
      required: [measuredAt, usage]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        usage: { type: number, format: double, description: 'The fraction of the queue in use, 0..1.' }
    TelemetrySchemaSize:
      type: object
      required: [name, bytes]
      properties:
        name: { type: string, description: 'public or ops (telemetry''s own cost).' }
        bytes: { type: integer, format: int64, description: "Heap, TOAST and indexes of the schema's tables." }
    TelemetryRequests:
      type: object
      required: [windowSeconds, percentileWindowSeconds, measuredAt, total, routes]
      properties:
        windowSeconds: { type: integer, format: int32, description: The window of the counts - the latest sample interval. }
        percentileWindowSeconds:
          type: integer
          format: int32
          description: The window p50 and p95 cover - the sample interval capped at 300 s (the request timers' reservoir), so it can be shorter than `windowSeconds`.
        measuredAt: { type: integer, format: int64, nullable: true, description: The sample bucket the figures describe; null when no live process has a sample. }
        total: { $ref: '#/components/schemas/TelemetryRouteStats' }
        routes:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/TelemetryRouteStats' }
    TelemetryRouteStats:
      type: object
      description: One route (or `*`, every `/api/` route except the telemetry's own and the probes) over the latest sample interval.
      required: [route, count, p50Ms, p95Ms, serverErrors, rateLimited]
      properties:
        route: { type: string, description: 'The normalised route (`/api/v1/users/{id}`) or `*`.' }
        count: { type: integer, format: int64, minimum: 0 }
        p50Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        p95Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        serverErrors: { type: integer, format: int64, minimum: 0, description: 5xx responses. }
        rateLimited: { type: integer, format: int64, minimum: 0, description: 429 responses. }
    TelemetryHistory:
      type: object
      required: [group, range, bucketSeconds, from, to, historyFrom, truncated, series]
      properties:
        group: { type: string, enum: [memory, storage, requests, jvm] }
        range: { type: string, enum: [24h, 7d, 90d] }
        bucketSeconds: { type: integer, format: int32, description: The width of a point's bucket. }
        from: { type: integer, format: int64, description: Epoch millis of the range start (the first bucket may begin up to one bucket earlier). }
        to: { type: integer, format: int64, description: Epoch millis of the read }
        historyFrom: { type: integer, format: int64, description: The oldest instant the range can actually hold data for. }
        truncated: { type: boolean, description: 'More series matched than were returned (40).' }
        series:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/TelemetrySeries' }
    TelemetrySeries:
      type: object
      description: One chart line; `points` are the buckets that hold data, ascending, at most 400.
      required: [key, metric, label, role, unit, kind, points]
      properties:
        key: { type: string, description: 'Unique within the response (`<role>:<metric>:<label>`, empty parts left out).' }
        metric: { type: string, description: 'The metric name (`mem.heap_used`, `http.p95`, ...).' }
        label: { type: string, description: 'A route, a GC collector or a schema; empty when the metric has none.' }
        role: { type: string, nullable: true, description: 'The process role a `memory` / `jvm` series merges (`app`); null for cluster-wide and `requests` series.' }
        unit: { type: string, enum: [BYTES, MILLISECONDS, COUNT, RATIO] }
        kind:
          type: string
          enum: [GAUGE, DELTA, PERCENTILE]
          description: A DELTA point's `avg` is the bucket's total; for the others it is the n-weighted mean.
        points:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/TelemetryPoint' }
    TelemetryPoint:
      type: object
      required: [t, avg, max]
      properties:
        t: { type: integer, format: int64, description: Epoch millis of the bucket start }
        avg: { type: number, format: double }
        max: { type: number, format: double }

