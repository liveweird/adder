openapi: 3.1.0
info:
  title: adder-api
  version: 0.2.0
  description: |
    JWT-authenticated REST API for Adder — a team chat with workflow threads. It serves the Adder web app and is
    versioned by its `/api/v1` path prefix. This foundation exposes the accounts, teams, feature-flag and operational
    surface the chat features build on.

    Authorization model: every user is implicitly a regular user; additional global roles (`ADMIN`) are carried as
    the `roles` array and only ever ADD privileges on top of that baseline. Every operation requires a bearer
    access token except the seven that declare `security: []` (`/login`, `/login/mfa`, `/refresh`, `/password-reset`,
    `/password-reset/confirm` and the two probes). Beyond that each operation states its own rule: user management (`/users`, apart from
    reading or changing one's own record where noted) and the writes on the team record are `ADMIN` only (a team's roster is edited by an ADMIN or the team's manager); reading teams and workflow templates is open to
    any authenticated user, and the writes on a workflow template are `ADMIN` only; telemetry is `ADMIN` only. A caller without the right gets a uniform `403`, whether or not the
    addressed resource exists.

    Rooms are the exception to that: a room is members-only, so a caller who is not a member (an `ADMIN` reads and manages every room)
    gets the same `404` as for a room that does not exist, and a member without the room's OWNER role gets a `403`. Every room operation
    checks in this order: authentication (`401`), visibility (`404`), role (`403`), the header and the body (`400`), then the state of the
    room under its lock (`409`).

    List operations page with `page` / `pageSize` / `sort` into an `{items, page, pageSize, total}` envelope.

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`). Any endpoint may additionally
    return `500` (`InternalServerError`) on an unexpected server fault.
servers:
  - url: http://localhost:8087
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: health
    description: Public liveness and readiness probes; they disclose nothing but a status.
  - name: auth
    description: Login (with the optional email second factor), token refresh, logout and the self-service password reset.
  - name: users
    description: Adder's own login accounts - ADMIN-managed CRUD, per-user feature flags, language and password change, plus the member-picker directory open to any signed-in user.
  - name: teams
    description: Flat teams, the ownership unit chat features scope to - readable by any authenticated user; the team record is written by ADMIN only, the roster by ADMIN or the team's manager.
  - name: workflows
    description: The ADMIN-curated workflow-template registry (statuses and fields a room copies at creation) - readable by any authenticated user, written by ADMIN only.
  - name: rooms
    description: Members-only rooms created from a workflow template, each with its own copy of the template's statuses and fields - a non-member gets a uniform `404`, an `ADMIN` reads and manages every room.
  - name: threads
    description: The room's threads - a per-room number, a title, a workflow status, an owner and typed field values - and their append-only history. Members-only like the room; a non-member gets the uniform `404`.
  - name: telemetry
    description: Adder's own vital signs (process memory, JVM, storage, request latency) and their 24h/7d/90d trends - ADMIN only.

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      description: |
        Public and unauthenticated (the container HEALTHCHECK and the k8s liveness probe call it):
        `200` proves the process answers requests. It touches nothing — use `/api/v1/ready` for the
        database round trip.
      security: []
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/ready:
    get:
      tags: [health]
      operationId: ready
      summary: Readiness probe
      description: |
        Public and unauthenticated (the k8s readiness probe and the e2e global setup call it): `200`
        once a database round trip succeeds within a short budget, `503` while it does not — the pod
        leaves the Service until the database is back.
        Rate-limited per client IP (default 60/min, `READY_RATE_LIMIT_PER_MINUTE`; the kubelet needs
        12/min): over the bucket it answers `429`. `/api/v1/health` is not bucketed.
      security: []
      responses:
        '200':
          description: The app and its database answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: The database did not answer within the probe's budget
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter. The in-memory lockout store admits at most
        `LOGIN_LOCKOUT_MAX_TRACKED` identities (default 10,000). At capacity a new identity
        receives `429` before password verification; existing tracked identities continue,
        and expired state frees capacity. This applies equally to existing and unknown emails.

        **Email MFA (opt-in via the `MFA` feature flag):** when the account has MFA enabled,
        correct credentials answer `200` with an `MfaChallengeResponse` instead of tokens — a
        6-digit code is emailed to the account, and the client exchanges it together with the
        `challengeId` at `POST /api/v1/login/mfa` for the ordinary `LoginResponse`. On a
        deployment without outbound email (`MAIL_TRANSPORT=disabled`) an MFA-enabled login
        fails closed with `503`. The pending challenge store admits at most
        `MFA_MAX_TRACKED` challenges (default 10,000); new issuance at capacity receives
        `429` without sending a code, while existing challenges remain verifiable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued, or (MFA-enabled accounts) a second-factor challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: MFA is enabled for the account but this deployment cannot send email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/login/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Exchange an MFA challenge and emailed code for a JWT pair
      description: |
        Second login step for MFA-enabled accounts. The `challengeId` comes from the login
        response, the 6-digit `code` from the email. Challenges are single-use, expire after
        a short TTL (default 5 min, `MFA_CODE_TTL_SECONDS`), and allow a few attempts
        (default 5, `MFA_MAX_ATTEMPTS`); every failure mode — unknown challenge, expired,
        wrong code, attempts exhausted, user gone, password changed — answers the uniform `401`. Rate-limited
        per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal with refresh-token rotation. Accepts a valid, unexpired,
        non-revoked refresh token and returns a brand-new access token and refresh token (each with
        a full TTL). The presented refresh token is retired: it is blocklisted until its own expiry,
        so it works once. A replay of an already-rotated token is `401`, except that a replay within
        a short grace window after the rotation (60 seconds by default; it covers a response lost in
        flight, at most twice per token, and not after a logout that reached the server) is answered with another fresh pair.
        The superseded access token is not revoked and
        lives until its own expiry. Requires no `Authorization` header (the access token may
        already be expired). Returns `401` for a missing/invalid/expired/revoked/already-used
        refresh token, if the user no longer exists, or if the token's credential revision no
        longer matches the user's current credentials. Password changes invalidate earlier refresh
        tokens even within the same clock second. Legacy tokens without a credential revision
        require a fresh sign-in after upgrading to 0.14.1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body, it is revoked too. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: |
        Normally answers `202` for a well-formed request, whether or not an account with that
        email exists (no account enumeration; the actual work happens asynchronously). If the
        account exists, a single-use reset link is emailed to its stored address. Requesting or
        opening a link never changes the password or any session: nothing changes until the owner
        confirms the link and chooses a new password (`POST /api/v1/password-reset/confirm`).
        Links expire after 15 minutes by default (`PASSWORD_RESET_TOKEN_TTL_SECONDS`, 1 to 3600
        seconds). Only a SHA-256 digest of the 256-bit random token is persisted, and the browser
        receives the token in a URL fragment, never in a server-visible path or query string.
        Throttled per submitted email — one request per interval
        (default 60 s, `PASSWORD_RESET_MIN_INTERVAL_SECONDS`) — uniformly for existing and
        unknown addresses, and rate-limited per client IP. The in-memory cooldown store admits
        at most `PASSWORD_RESET_MAX_TRACKED` identities (default 10,000). At capacity a new
        identity receives `429` and no reset email is scheduled; elapsed cooldowns free space.
        A soft-deleted account is unknown here (no link is minted or emailed, and the response
        follows the same acceptance and throttling rules). Answers `503` on deployments without
        outbound email (`MAIL_TRANSPORT=disabled`) or without a configured `MAIL_APP_URL` (the
        deployment's https origin, validated at startup, never derived from the `Host` header).
        Several requested links may coexist; completing one invalidates all of them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email, or has no `MAIL_APP_URL` (password reset unavailable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Choose a new password using a single-use reset link
      description: |
        Public credential exchange: the reset token authorizes only this operation, never
        bearer-authenticated API calls. Send it in the JSON body, not the URL. A valid token is
        checked before the password is validated. Expired, used, malformed and unknown tokens,
        deleted accounts, and tokens predating a password or email change all answer one uniform
        `401`. Consumption of the token, the password replacement and the credential-generation
        advance commit atomically; concurrent confirmations cannot both succeed, including with
        different links for one account. A password the rules refuse (`400`) does not consume the
        token. Success invalidates every access and refresh session of the account and any pending
        MFA challenge. There is no automatic sign-in: sign in normally, with the MFA code if it is
        enabled. A best-effort confirmation email contains neither password nor token; a delivery
        failure does not undo the reset. Rate-limited to 10 requests per minute per client IP. A
        lost success response can make a retry answer `401`: try signing in with the chosen
        password, or request another link. A link issued earlier still works if outbound mail is
        later disabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Password replaced and existing sessions revoked; sign in again
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (management view)
      description: |
        ADMIN only — the whole management surface is admin-gated; regular users keep only
        their self password change.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email` (deliberately not `roles` — a set has no
          order). Default sort is `id` ascending; `id` ascending is always appended as a
          deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `name` / `email` — case- and accent-insensitive substring matches.
          - `role` — `ADMIN` (holders of the additional role) or `USER` (plain users).
          - `feature` + `featureEnabled` — feature-flag state (the pair must come
            together, `400` otherwise; `featureEnabled` is a strict boolean).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: email
          in: query
          required: false
          schema: { type: string }
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, USER] }
        - name: feature
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Feature' }
          description: Feature-flag state filter — must be paired with `featureEnabled` (400 otherwise).
        - name: featureEnabled
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean — only users with `feature` enabled (true) or disabled (false).
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        ADMIN only. The initial password is CLIENT-generated (the SPA's 96-bit generator) and
        shown to the admin exactly once — the server stores only the bcrypt hash and no
        response ever carries plaintext. The email is canonicalized (trimmed + lowercased);
        a duplicate among active accounts is a `409` (a soft-deleted account frees its email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error (blank/too-long name or email, password rules)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/directory:
    get:
      tags: [users]
      operationId: searchUserDirectory
      summary: Look up active users (member picker)
      description: |
        ANY signed-in user — deliberately not the ADMIN-only management list (`GET /users`, which stays
        unchanged). A room owner is any user and needs somebody to add, so this returns the minimum
        a picker needs: `{id, name, email}` of ACTIVE users (soft-deleted accounts are absent). Roles,
        feature flags and language are never exposed; the email tells namesakes apart.

        It is the broadest read of accounts open to a regular user (a team roster and a room's member
        list show name and email too, `security.md` "What the user directory discloses"). The bounds slow and
        audit a bulk harvest; they do not prevent one by a signed-in insider (the disclosure is accepted):
        `q` is REQUIRED and needs at least 2 characters, a page holds at most 20 rows, and the
        endpoint rides a per-USER rate bucket of 120 per minute (`429` beyond it).

        Supports offset pagination, sorting and one free-text filter.

        - `q` — case- and accent-insensitive substring match on name OR email. It is trimmed
          before the limits apply; 2 to 100 characters (code points) after trimming, `400` otherwise
          (a missing or blank `q` included).
        - `pageSize` — 1 to 20 (default 20), `400` beyond.
        - Sortable fields: `name` (default) and `id`; `id` ascending is always appended as a
          deterministic tiebreaker.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/DirectoryPageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: A page of active users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDirectoryPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user
      description: Target user or ADMIN (guard-before-read — an unauthorized caller 403s uniformly).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: updateUser
      summary: Update a user's name, email, and roles
      description: |
        ADMIN only. The password is deliberately not writable here (it has its own endpoint).
        Demoting the LAST active administrator is a `409` — the management surface must stay
        reachable. An email already used by another active account is also a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        ADMIN only, soft delete: the account can no longer sign in, outstanding refresh
        tokens die (`user_gone`), the email is freed for reuse, and the user's catalog files
        stay with a deleted-creator marker. Deleting YOURSELF is a `403`; deleting the LAST
        active administrator is a `409`.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN, or attempted to delete their own account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/features:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserDisabledFeatures
      summary: Replace a user's disabled-feature set (ADMIN only)
      description: |
        Per-user feature flags: a **wholesale replace** of the target user's DISABLED set —
        an empty array re-enables everything (idempotent, a same-set re-PUT is `204` again).
        **ADMIN-only**; changing one's OWN flags is allowed (the users routes themselves are
        never feature-gated, so an admin can always find their way back). `MFA` is the one
        inverted-default flag: users start with it in the disabled set, and a set omitting it
        — the empty "re-enable everything" array included — ENABLES the login second factor.
        The set rides the JWT, so a change takes effect at the target's next token refresh
        (≤15 min) or login. Audited as `user.features_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeaturesUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Disabled-feature set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/language:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserLanguage
      summary: Set a user's language (target user or ADMIN)
      description: |
        The ONE synced per-user language: it drives the UI at sign-in (rides `LoginResponse`,
        applied by the SPA on login/MFA/refresh) and the language of every email sent to the
        user (read fresh at send time, so a change takes effect immediately for emails; the
        UI picks it up at the next sign-in or token refresh). **Target user or ADMIN** — the
        header language switcher is the self-service writer (switching while signed in also
        saves here); an admin may fix a mis-set language. Idempotent (a same-value re-PUT is
        `204` again); an unsupported code is `400`. Audited as `user.language_changed` on an
        actual change. Set initially at create (`UserCreateRequest.language`, default `en`);
        the whole-user PUT deliberately never touches it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLanguageUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Language set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        and pending MFA challenges, including changes within the same clock second
        (already-issued access tokens expire naturally within their TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters or longer than 71 UTF-8 bytes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List teams
      description: |
        Any authenticated user — teams are the shared ownership unit chat features scope to;
        every mutation is ADMIN only.

        - Sortable fields: `id`, `name`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A page of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      description: |
        ADMIN only (guarded before the body decodes — a non-admin's malformed body is still
        403). A case-insensitive name clash with an active team is `409`. An optional manager (a
        user; being a manager grants no write rights on the team yet) must be an active
        user (`400` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new team
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: Get a team
      description: Any authenticated user.
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [teams]
      operationId: updateTeam
      summary: Rename / re-describe a team, set its manager
      description: "ADMIN only, guard before the id lookup (uniform 403). A full replace: an omitted `managerUserId` clears the manager; a set one must be an active user (`400` otherwise). A case-insensitive name clash with another active team is `409`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: Delete a team (soft)
      description: ADMIN only, guard before the id lookup. Soft delete — the name is freed for reuse.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/UserIdPath'
    put:
      tags: [teams]
      operationId: addTeamMember
      summary: Add a user to a team's roster
      description: |
        ADMIN or the team's ACTIVE manager (guarded first, before any read: every other caller gets a uniform `403` whether
        or not the team exists; a non-admin's grant is re-checked under the team row lock). Idempotent: `204` for an
        added OR an already-present member, and only an actual add is audited (`team.member_added`). No request body.
        An unknown or soft-deleted team (ADMIN caller) or user is `404`; a roster that already holds 200 active members is `409`.
      responses:
        '204':
          description: The user is on the roster (added now or already present)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: removeTeamMember
      summary: Remove a user from a team's roster
      description: |
        ADMIN or the team's ACTIVE manager, guarded exactly like the add (uniform `403`, re-checked under the team row lock).
        `404` for an unknown team (ADMIN caller) or a user who is not on the roster. Audited `team.member_removed`.
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/workflow-templates:
    get:
      tags: [workflows]
      operationId: listWorkflowTemplates
      summary: List workflow templates
      description: |
        Any authenticated user - a room copies a template's statuses and fields when it is created. Active templates only.

        - Sortable fields: `id`, `name`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring, at most 100 characters - `400` beyond).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: A page of workflow templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplatePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [workflows]
      operationId: createWorkflowTemplate
      summary: Create a workflow template
      description: |
        ADMIN only (guarded before the body decodes - a non-admin's malformed body is still `403`). The new template starts at
        `revision` 1. A case-insensitive name clash with an active template is `409`; a deleted template frees its name. The
        document must satisfy the workflow rules: 2-20 statuses (unique slug keys, exactly one initial and it is `OPEN`, at
        least one `CLOSED`), 0-20 fields (unique slug keys), options only on the select kinds (1-50, unique slugs), every
        status, field and option label a language map with an `en` value of 1-60 characters (`400` otherwise), unique per language
        (case-insensitive, after trimming) among the statuses, among the fields and among one field's options.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTemplateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new template
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/workflow-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [workflows]
      operationId: getWorkflowTemplate
      summary: Get a workflow template
      description: Any authenticated user. The `revision` is what a later PUT names in `X-Expected-Revision`.
      responses:
        '200':
          description: The template with its statuses and fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTemplateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [workflows]
      operationId: updateWorkflowTemplate
      summary: Replace a workflow template
      description: |
        ADMIN only. A whole-document replace under optimistic concurrency, checked in this order: the guard (uniform `403`,
        whether or not the id exists and whatever the body), the `X-Expected-Revision` header (missing, repeated or malformed is
        `400`), the body (`400`, the rules of the create), then under the row lock the id (`404`) and the revision. A stale
        revision is `409` of type `urn:adder:problem:revision-conflict`; a case-insensitive name clash with another active
        template is a plain `409`. Every successful PUT stores `revision + 1`; read the template again for it. A template edit
        never touches a room that copied it.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowTemplateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [workflows]
      operationId: deleteWorkflowTemplate
      summary: Delete a workflow template (soft)
      description: ADMIN only, guard before the id lookup. Soft delete - the name is freed for reuse; rooms that copied the template are untouched.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List rooms
      description: |
        Any authenticated user: the rooms the caller may read - the ones they are a member of, and for an `ADMIN` every room.
        Deleted rooms never appear.

        - Sortable fields: `id`, `name`, `lastActivityAt`, `createdAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring, at most 80 characters - `400` beyond); `archived` (strict `true` or
          `false`; omitted = both); `member` (strict `true` or `false`: `true` = only rooms the caller is a member of - the rooms rail
          always sends it; `false` = only readable rooms the caller is NOT in, which is empty for a non-admin; omitted = every readable
          room). A repeated key is a `400`.
        - Each row's `role` is the CALLER's role in that room, `null` for an `ADMIN` who is not a member.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
        - name: archived
          in: query
          required: false
          schema: { type: boolean }
        - name: member
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: A page of rooms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room from a workflow template
      description: |
        Any authenticated user; the creator becomes the room's OWNER. In ONE transaction the room is inserted, its creator is added as
        OWNER, and the template's statuses and fields are COPIED into the room with every label resolved to the request's `language`
        (default `en`; a label the template has no translation for falls back to its `en` text). The copy is single-language plain text
        and has no link back: a later template edit or delete never touches the room. When per-label resolution would clash within a list,
        that whole list is copied in EN.

        An unknown or deleted `templateId` and an unsupported `language` are `400`. A case-insensitive name clash with a non-deleted
        room is `409` (archived rooms keep their names; a deleted room frees its own). Rides a per-USER rate bucket of 30 per minute
        shared with the rename (`429` beyond it). The name may not contain invisible formatting characters (`400`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new room
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Get a room
      description: |
        A member of the room or an `ADMIN`. A non-member (and any caller for a room that does not exist or was deleted) gets the same
        `404`, so a room's existence is not disclosed. `role` is the caller's role, `null` for an `ADMIN` outside the room.
        `workflowRevision` is what a workflow PUT names in `X-Expected-Revision`.
      responses:
        '200':
          description: The room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [rooms]
      operationId: updateRoom
      summary: Replace a room's name and description
      description: |
        The room's OWNER or an `ADMIN`. Checked in this order: visibility (`404` for a missing room and for a non-member alike), role
        (`403` for a plain member), the body (`400`), then under the room lock the guard again (a caller demoted while the write waited is
        refused), the archived state (`409` of type `urn:adder:problem:room-archived`: an archived room is read-only) and the name (a
        case-insensitive clash with another non-deleted room is a plain `409`, audited `room.name_conflict`). A full replace: an omitted description clears it.
        The name may not contain invisible formatting characters (Unicode category Cf, U+2028, U+2029: `400`). Rides the per-USER `room-name`
        bucket shared with the room create (30 per minute, `429` beyond it), because a rename's `409` would otherwise be a free probe for a room's name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [rooms]
      operationId: deleteRoom
      summary: Delete a room (soft)
      description: |
        `ADMIN` only, but the visibility check comes first: a non-member who is not an `ADMIN` gets the `404`, a member who is not an
        `ADMIN` (the room's OWNER included) gets `403`. Soft delete - the room stops reading as active and frees its name; there is no
        restore. An archived room can be deleted.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [rooms]
      operationId: archiveRoom
      summary: Archive a room
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, then role `403`). Idempotent: archiving an archived room is a `204` that
        changes nothing. An archived room is read-only for its name, description and workflow; its members can still be managed.
        No request body.
      responses:
        '204':
          description: Archived (or already archived)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [rooms]
      operationId: unarchiveRoom
      summary: Unarchive a room
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, then role `403`). Idempotent: unarchiving an active room is a `204` that
        changes nothing. No request body.
      responses:
        '204':
          description: Unarchived (or already active)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/workflow:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: getRoomWorkflow
      summary: Get a room's workflow
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`). The room's ACTIVE statuses and fields in position order
        (retired ones are not shown), with plain single-language labels and the `revision` a later workflow PUT names in
        `X-Expected-Revision`. Each status carries `threadCount`, the number of threads currently in it (always `0` until threads exist).
      responses:
        '200':
          description: The room's workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomWorkflow'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [rooms]
      operationId: updateRoomWorkflow
      summary: Replace a room's workflow
      description: |
        The room's OWNER or an `ADMIN`. A whole-document replace of the room's own copy under optimistic concurrency, checked in
        this order: the room (a missing room or a non-member is the uniform `404`), the role (`403`), the `X-Expected-Revision`
        header (missing, repeated or malformed is `400`), the body (`400`: the workflow rules - 2-20 statuses with unique slug keys,
        exactly one initial and it is `OPEN`, at least one `CLOSED`, 0-20 fields with unique slug keys, 1-50 options on the select
        kinds only, labels of 1-60 characters unique per list, case-insensitively), then under the room lock, in this order: an
        archived room is `409` of type `urn:adder:problem:room-archived`; a stale revision is `409` of type
        `urn:adder:problem:revision-conflict`; a field whose key exists (retired ones included) with another `type` is `409` of type
        `urn:adder:problem:field-type-immutable` with `keys`; a room may reserve at most 200 status keys and 200 field keys
        (retired ones included), beyond that a plain `409`; an invalid `replacements` mapping is `400`; a status that would be retired
        or re-categorised while threads use it, without a valid replacement, is `409` of type `urn:adder:problem:status-in-use` with
        `keys`.

        `statuses` and `fields` are the ACTIVE ones in the new order (position is the array index). A key the document no longer
        names is retired (its key stays reserved); a retired key it names again is revived. `replacements` is
        `{retiredKey: replacementKey}`: where the threads of each status THIS change retires move; the key must be a status this
        change retires and the target a status of the new document in the same category as the retired one (else `400`). A
        status's category can only change while no thread uses it. Every successful PUT stores `workflowRevision + 1`; read the
        workflow again for it.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomWorkflowUpdate'
      responses:
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [rooms]
      operationId: listRoomMembers
      summary: List a room's members
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`). Members are ACTIVE users only: a soft-deleted user's
        membership is inert and never listed.

        - Sortable fields: `id` (the user id), `name`, `role`, `addedAt`. Default `id` ascending.
        - Filters: `role` (`OWNER` or `MEMBER`; any other value is a `400`); `name` (case- and accent-insensitive substring of the display
          name, at most 100 characters - `400` beyond). A repeated key is a `400`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RoomRole' }
        - name: name
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: A page of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomMemberPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [rooms]
      operationId: addRoomMembers
      summary: Add people to a room, one by one and/or a whole team
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, role `403`, then the body `400`, then under the room lock the guard again).
        Allowed on an archived room. At least one of `userIds` (at most 200) and `teamId` is required. A team is a SNAPSHOT: its
        ACTIVE roster at this moment becomes members, and a later roster edit never follows. Everyone is added as `MEMBER`; promotion
        is a separate step (`PUT .../members/{userId}`).

        Idempotent: a person who already belongs is skipped and counted in `alreadyMembers` (and beats the cap). An unknown or
        soft-deleted user id or team id is a `400` and nothing is added. A room holds at most 500 active members: an add that would
        exceed it is a plain `409` and nothing is added. A team whose roster holds no active member adds nobody: `200` with
        `{added: 0, alreadyMembers: 0}`. One `room.member_added` audit line per person actually added. The body is limited to 16 KiB (`413`
        beyond it, before it is decoded) and the call rides a per-USER `room-members` bucket of 60 per minute (`429` beyond it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomMembersAddRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Added (the counts say how many people were new)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomMembersAddResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/UserIdPath'
    put:
      tags: [rooms]
      operationId: setRoomMemberRole
      summary: Set a member's role
      description: |
        The room's OWNER or an `ADMIN` (visibility `404`, role `403`, the body `400`, then under the room lock the guard again). Allowed
        on an archived room. Idempotent: the role the member already has is a `204` that changes nothing and is not audited
        (`room.member_role_changed` fires on a change only). A user who is not an active member is `404`. Demoting the room's last
        `OWNER` whose user is active is a `409` of type `urn:adder:problem:last-owner`: promote someone else first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomMemberRoleRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: The member has the role (set now or already)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [rooms]
      operationId: removeRoomMember
      summary: Leave a room, or remove a member
      description: |
        A member removes THEMSELVES (a leave: visibility `404` for a non-member, so an `ADMIN` who is not in the room gets `404` too) or
        the room's OWNER or an `ADMIN` removes someone else (a plain member removing another is `403`). Allowed on an archived room.
        `404` for a user who is not an active member. Removing the room's last `OWNER` whose user is active - a leave included - is a
        `409` of type `urn:adder:problem:last-owner`. Audited `room.member_removed` (with `self`). A hard delete: the person can be added
        again.
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [threads]
      operationId: listThreads
      summary: List a room's threads
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`).

        - Sortable fields: `id`, `number`, `title`, `lastActivityAt`, `createdAt`. Default `id` ascending (the SPA sends `-lastActivityAt`).
        - Filters: `closed` (strict `true` or `false`, on the status category: `true` = only closed threads, `false` = only open ones;
          omitted = both). A repeated key is a `400`.
        - A row carries the status KEY; labels and colours come from the room's workflow (`GET /rooms/{id}/workflow`).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: closed
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: A page of threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [threads]
      operationId: createThread
      summary: Start a thread
      description: |
        A MEMBER of the room (an `ADMIN` who is not a member is `403` and joins through the Members page first; a non-member is the
        uniform `404`). Checked in this order: visibility (`404`), membership (`403`), the body (`400`), then under the room lock the
        guard again (a caller removed while the write waited is refused), an archived room (`409` of type `urn:adder:problem:room-archived`)
        and the field values (`400`).

        The thread starts in the room's initial status with the caller as its owner and the number `MAX + 1` of the room; `body`
        becomes its opening message. `title` is a single line of 1 to 200 characters; `body` is Markdown of 1 to 8,000 UTF-16 units
        after line endings are normalised, leading blank lines and trailing whitespace are dropped and the first line's indentation stays
        (`\n` and `\t` allowed, every other control character and the hidden direction characters
        are a `400`). Every required field must be supplied; an unknown key, or a value for a retired key (an unchanged `null` for a retired key is ignored), is a `400`,
        as is a value that breaks its type's rule. The thread, its opening message, its `CREATED` history entry and the activity bump of the thread and the room commit
        together. Rides the per-USER `chat-post` bucket of 120 per minute shared with the message POST (`429` beyond it); the bucket
        is spent before any guard, so a refused or invalid POST costs a token too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new thread
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    get:
      tags: [threads]
      operationId: getThread
      summary: Get a thread
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, as does an unknown number). `fields` holds the ACTIVE
        fields' stored values only (a retired field keeps its value, hidden, and it returns if the field is revived); `fieldUserNames`
        maps the user ids held by USER fields to display names. `revision` is what the details PUT names in `X-Expected-Revision`.
      responses:
        '200':
          description: The thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [threads]
      operationId: updateThread
      summary: Edit a thread's title and fields
      description: |
        A member of the room or an `ADMIN` (any reader edits the open-side metadata; a non-member is the uniform `404`). Checked in this
        order: visibility (`404`), the `X-Expected-Revision` header (missing, repeated or malformed is `400`), the body (`400`), then
        under the room lock: the guard again (a caller removed while the write waited is refused), the thread (`404`), an archived room
        (`409` of type `urn:adder:problem:room-archived`), a closed thread (`409` of type `urn:adder:problem:thread-closed`: reopen it
        first), a stale revision (`409` of type `urn:adder:problem:revision-conflict`), then the field values (`400`).

        `title` is a single line of 1 to 200 characters. `fields` MERGES over the stored values: a key left out is untouched and `null`
        clears the field; a value equal to the stored one is not re-validated, so a stale value (a removed option, a user who left)
        never blocks a save. A required field cannot be cleared once set; an unknown key, or a changed value for a retired key, is a `400`.
        When nothing changed the answer is `204` with no revision bump, no history entry and no activity bump. Otherwise the revision
        becomes `revision + 1` (read the thread again for it), one `TITLE_CHANGED` and one `FIELD_CHANGED` entry per changed field are
        recorded, and the thread and the room are bumped in the activity order.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadUpdateRequest'
      responses:
        '204':
          description: Saved, or nothing changed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/status:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadStatus
      summary: Move a thread to a status (close, reopen)
      description: |
        A member of the room or an `ADMIN` (a non-member is the uniform `404`). A move between two OPEN statuses is open to every reader;
        a move that enters or leaves a CLOSED status - closing, reopening, or CLOSED to CLOSED - needs a STEWARD: the thread's owner
        while a member, the room's OWNER or an `ADMIN` (`403` otherwise). Which of the two applies depends on the target's category, so
        the answer is decided under the room lock after the target resolves: checked in this order visibility (`404`), the body (`400`),
        then under the lock the guard again, the thread (`404`), the target (`400` for a status key that is unknown or retired - every
        reader can read the workflow, so it discloses nothing), the steward rule (`403`), an archived room (`409` of type
        `urn:adder:problem:room-archived`, the no-op included). A closed thread is NOT refused here: reopening it, or moving it between
        CLOSED statuses, is the point.

        Setting the status the thread already has is `204` with no history entry, no activity bump and no audit line (a plain member
        is still `403` when that status is CLOSED). Otherwise the status changes, `closedAt` is set to the instant the thread closed
        (kept across CLOSED to CLOSED moves) and cleared by a move into an OPEN one, a `STATUS_CHANGED`, `CLOSED` or `REOPENED` history entry is recorded and
        the thread and the room are bumped in the activity order. A single-value set: the last writer wins, and the history records
        each change; the thread's `revision` is not moved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadStatusRequest'
      responses:
        '204':
          description: Moved, or already in that status
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/owner:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    put:
      tags: [threads]
      operationId: setThreadOwner
      summary: Pass a thread on to another member
      description: |
        A STEWARD: the thread's owner while a member, the room's OWNER or an `ADMIN` (a non-member is the uniform `404`, a member who is
        not a steward `403`). Checked in this order: visibility (`404`), the thread (`404`) and the steward rule (`403`) on a lock-free
        read of its owner, the body (`400`), then under the room lock the guard, the thread and the steward rule again on the fresh
        rows, an archived room (`409` of type `urn:adder:problem:room-archived`), a closed thread (`409` of type
        `urn:adder:problem:thread-closed`: reopen it first), and the new owner (`400` unless `userId` is an ACTIVE member of the room).
        A removed or deleted owner keeps the thread, inert, until a steward passes it on.

        Naming the current owner again is `204` with no history entry, no activity bump and no audit line. Otherwise an `OWNER_CHANGED`
        history entry is recorded and the thread and the room are bumped in the activity order. A single-value set: the last writer
        wins, and the history records each change; the thread's `revision` is not moved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadOwnerRequest'
      responses:
        '204':
          description: Passed on, or already the owner
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/rooms/{id}/threads/{number}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/ThreadNumberPath'
    get:
      tags: [threads]
      operationId: listThreadEvents
      summary: List a thread's history
      description: |
        A member of the room or an `ADMIN` (a non-member gets the uniform `404`, as does an unknown number). The thread's append-only
        history: structured entries (`type` plus string-map `params`: keys and ids with snapshots of labels and names) that the client
        renders in the viewer's language. Message edits and deletes are not history.

        - Sortable fields: `id`, `createdAt`. Default `-createdAt,-id` (newest first).
        - `userDeleted` marks an actor whose account has since been deleted (the recorded name stays).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of history entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadEventPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/current:
    get:
      tags: [telemetry]
      operationId: getTelemetryCurrent
      summary: Adder's own vital signs - processes, storage, request latency
      description: |
        ADMIN only (operational data: process sizes, container limits, storage sizes), read-only, no audit event;
        both telemetry reads share one per-user rate bucket (30/min, `429`). `.claude/docs/observability.md` "Telemetry".
        `processes` lists each sampling process (role `app`) with its latest raw sample: every live process, and the
        newest stale one when none is alive (a process that stopped stays visible for a day). `stale` = no sample for more than three
        sample intervals. A figure the process could not measure is null (no container limit outside a cgroup, no `memory.peak` on an
        old kernel) - never zero; `percentOfLimit` is the cgroup working set over the container limit, in percent. `storage` is the
        newest database / per-schema size (null before the first measurement). `requests` is the latest sample interval of the live
        processes: the `*` total and the 15 busiest routes.
      responses:
        '200':
          description: The current figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCurrent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/history:
    get:
      tags: [telemetry]
      operationId: getTelemetryHistory
      summary: The trend of one telemetry section over 24 hours, 7 days or 90 days
      description: |
        ADMIN only (guard before the query is read: `403` outranks `400`), read-only, no audit event.
        `group` picks the section and `range` the span; both are required. Buckets: `24h` = the raw sample interval (widened to a whole
        multiple of it when that would exceed 400 points), `7d` = one hour (the hourly rollups plus the raw rows of the hours not yet
        rolled up), `90d` = six hours; `bucketSeconds` says which. At most 400 points per series and 40 series (`truncated` when more
        matched); a series has points only for the buckets that hold data.
        Per-process groups merge the processes of one `role` into one series, so a trend survives a restart (`memory`, `jvm`), or all
        processes into one series per route (`requests`, `role` null); `storage` is cluster-wide (`role` null). `requests` keeps the `*`
        total (count, p50, p95, 5xx, 429) and the ten busiest routes of the range (count, p50, p95). A DELTA series' `avg` is the
        bucket's TOTAL and its `max` the largest single sample interval; a GAUGE or PERCENTILE series' `avg` is the n-weighted mean and
        `max` the largest sample. `historyFrom` is the oldest instant the range can actually hold: the first sampler boot (a fresh
        install, or retention shorter than the range).
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
            enum: [memory, storage, requests, jvm]
          description: The panel section.
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [24h, 7d, 90d]
          description: How far back the history reaches.
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400. Ids are database sequences that
      # start at 1, so 0 never addresses anything (it answers 404, like any unknown id).
      schema: { type: integer, format: int32, minimum: 1 }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
      description: A user id (int32; ids start at 1).
    ThreadNumberPath:
      name: number
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
      description: A thread's per-room number (`#42`; int32, numbering starts at 1 in every room).
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
    DirectoryPageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      description: Rows per page for the user directory only. Defaults to 20, maximum 20 (the shared maximum is 100).
    Q:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 100 }
      description: >-
        Free-text search (API-LIST-005), REQUIRED where declared (the user directory). Case- and accent-insensitive
        substring match; the endpoint declares which fields it searches. The value is trimmed before the length limits
        apply, so it needs 2 to 100 characters (code points) after trimming.
    ExpectedRevision:
      name: X-Expected-Revision
      in: header
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: |
        The revision of the document the caller read (`revision`, or a room's `workflowRevision`). Missing, repeated or
        malformed is a `400`; a stale one is a `409` of type `urn:adder:problem:revision-conflict`. Every successful PUT
        bumps the revision.
  responses:
    UnsupportedMediaType:
      description: Request body must use application/json. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing, invalid or no longer valid token (revoked, or the account was deleted, demoted or re-credentialed since it was issued)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail), on a telemetry read
        (`/api/v1/telemetry/**`) the per-USER telemetry bucket is exhausted (30/min), on the user directory
        (`/api/v1/users/directory`) the per-USER directory bucket is exhausted (120/min), on creating or
        renaming a room (`POST /api/v1/rooms`, `PUT /api/v1/rooms/{id}`) the per-USER room-name bucket (shared by both) is exhausted (30/min),
        on adding room members (`POST /api/v1/rooms/{id}/members`) the per-USER room-members bucket is exhausted (60/min), on starting a thread
        (`POST /api/v1/rooms/{id}/threads`) the per-USER chat-post bucket (shared with the message POST) is exhausted (120/min), or, on /login, the
        per-account lockout is active (account-specific detail). All carry a ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the ceiling — 512 KiB globally, 16 KiB on the anonymous auth routes
        (login, MFA, refresh, password reset) and the room member add — a memory-DoS backstop shared by
        every endpoint, so declared on every operation that takes a body (field-level maxLength
        rules reject oversized values far earlier on ordinary payloads). Cross-cutting for the
        coverage gate: pinned once by `PayloadValidationTest`, never once per operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: >-
        Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use 256-bit reset credential from the email; never logged or returned.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 71
          description: The new password; at most 71 UTF-8 bytes (bcrypt ceiling).

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V1) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    UserDirectoryEntry:
      type: object
      required: [id, name, email]
      description: The whole directory projection - nothing else about a user is exposed.
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        email: { type: string }

    UserDirectoryPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserDirectoryEntry'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a user; must be active (`400` otherwise).
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a user; must be active (`400` otherwise). Omitted on PUT (a full replace) = no manager.
    TeamMember:
      type: object
      required: [userId, name, email]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
    TeamResponse:
      type: object
      required: [id, name, managerUserId, managerName, members, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager; null when unset or when the assigned user was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's display name; null with `managerUserId`. }
        members:
          type: array
          maxItems: 200
          description: The roster - ACTIVE users only (a soft-deleted member is absent), by name then id; a team holds at most 200.
          items:
            $ref: '#/components/schemas/TeamMember'
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, managerUserId, managerName, memberCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerUserId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager; null when unset or when the assigned user was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's display name; null with `managerUserId`. }
        memberCount: { type: integer, format: int32, minimum: 0, description: The roster size - ACTIVE users only. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    WorkflowLabel:
      type: object
      required: [en]
      additionalProperties: false
      description: >-
        A label per language: `en` is required, `pl` optional (omit it to leave the label untranslated; a present blank value is a
        `400`); no other language is accepted. Each value is 1-60 characters after trimming.
      properties:
        en: { type: string, minLength: 1, maxLength: 60 }
        pl: { type: string, minLength: 1, maxLength: 60 }
    WorkflowStatus:
      type: object
      required: [key, label, colour, category, initial]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: An immutable lower-case slug (`in-progress`), unique within the document.
        label: { $ref: '#/components/schemas/WorkflowLabel' }
        colour: { $ref: '#/components/schemas/StatusColour' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        initial:
          type: boolean
          description: Exactly one status of a document is the initial one, and it is in the `OPEN` category.
    WorkflowOption:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { $ref: '#/components/schemas/WorkflowLabel' }
    WorkflowField:
      type: object
      required: [key, label, type, required, options]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: An immutable lower-case slug, unique within the document.
        label: { $ref: '#/components/schemas/WorkflowLabel' }
        type: { $ref: '#/components/schemas/FieldType' }
        required: { type: boolean }
        options:
          type: array
          maxItems: 50
          description: 1-50 options for `SELECT` and `MULTI_SELECT`; empty for every other type.
          items:
            $ref: '#/components/schemas/WorkflowOption'
    StatusColour:
      type: string
      enum: [GRAY, RED, ORANGE, BLUE, GRAPE, TEAL]
      description: The semantic colour of a status; the web app maps it to its hue.
    StatusCategory:
      type: string
      enum: [OPEN, CLOSED]
      description: A thread in a `CLOSED` status is closed - no further activity until it is reopened.
    FieldType:
      type: string
      enum: [TEXT, NUMBER, DATE, SELECT, MULTI_SELECT, USER, URL]
    WorkflowTemplateRequest:
      type: object
      required: [name, statuses, fields]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        statuses:
          type: array
          minItems: 2
          maxItems: 20
          items:
            $ref: '#/components/schemas/WorkflowStatus'
        fields:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/WorkflowField'
    WorkflowTemplateResponse:
      type: object
      required: [id, name, statuses, fields, revision, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStatus'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowField'
        revision:
          type: integer
          format: int64
          minimum: 1
          description: The optimistic-concurrency token; a PUT names it in `X-Expected-Revision`. Starts at 1, every successful PUT bumps it.
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    WorkflowTemplateListItem:
      type: object
      required: [id, name, statusCount, fieldCount, revision, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        statusCount: { type: integer, format: int32, minimum: 0 }
        fieldCount: { type: integer, format: int32, minimum: 0 }
        revision: { type: integer, format: int64, minimum: 1 }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    WorkflowTemplatePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTemplateListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    RoomCreateRequest:
      type: object
      required: [name, templateId]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        templateId:
          type: integer
          format: int32
          minimum: 1
          description: The workflow template to copy; unknown or deleted is a `400`.
        language:
          $ref: '#/components/schemas/Language'
    RoomUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
    RoomListItem:
      type: object
      required: [id, name, archived, role, memberCount, lastActivityAt, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        archived: { type: boolean }
        role:
          type: string
          enum: [OWNER, MEMBER]
          nullable: true
          description: The CALLER's role in the room; `null` for an `ADMIN` who is not a member.
        memberCount: { type: integer, format: int32, minimum: 0, description: Active members only }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis; equals the creation time until threads exist }
        createdAt: { type: integer, format: int64, description: Epoch millis }
    RoomResponse:
      type: object
      required: [id, name, archived, role, memberCount, workflowRevision, lastActivityAt, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        archived: { type: boolean }
        archivedAt: { type: integer, format: int64, nullable: true, description: Epoch millis; `null` while the room is active }
        role:
          type: string
          enum: [OWNER, MEMBER]
          nullable: true
          description: The CALLER's role in the room; `null` for an `ADMIN` who is not a member.
        memberCount: { type: integer, format: int32, minimum: 0, description: Active members only }
        workflowRevision:
          type: integer
          format: int64
          minimum: 1
          description: The room workflow's optimistic-concurrency token (`X-Expected-Revision` of its PUT). Starts at 1.
        lastActivityAt: { type: integer, format: int64, description: Epoch millis; equals the creation time until threads exist }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    RoomPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    RoomRole:
      type: string
      enum: [OWNER, MEMBER]
      description: A member's role in a room.
    RoomMember:
      type: object
      required: [userId, name, email, role, addedAt]
      properties:
        userId: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/RoomRole' }
        addedAt: { type: integer, format: int64, description: Epoch millis }
    RoomMemberPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomMember'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    RoomMembersAddRequest:
      type: object
      description: At least one of `userIds` and `teamId` is required (`400` otherwise).
      properties:
        userIds:
          type: array
          maxItems: 200
          items: { type: integer, format: int32, minimum: 1 }
          description: Active users to add; an unknown or deleted id is a `400`. Duplicates collapse.
        teamId:
          type: integer
          format: int32
          minimum: 1
          description: A team whose ACTIVE roster is added as a snapshot; an unknown or deleted team is a `400`.
    RoomMembersAddResult:
      type: object
      required: [added, alreadyMembers]
      properties:
        added: { type: integer, format: int32, minimum: 0, description: People who became members now }
        alreadyMembers: { type: integer, format: int32, minimum: 0, description: Requested people (and team roster members) who already belonged }
    RoomMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/RoomRole' }
    RoomWorkflowStatus:
      type: object
      required: [key, label, colour, category, initial, threadCount]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          description: An immutable lower-case slug, reserved for the life of the room.
        label: { type: string, minLength: 1, maxLength: 60, description: Plain text in the language the room was created with }
        colour: { $ref: '#/components/schemas/StatusColour' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        initial:
          type: boolean
          description: Exactly one status is the initial one, and it is in the `OPEN` category.
        threadCount: { type: integer, format: int64, minimum: 0, description: The threads currently in this status }
    RoomWorkflowStatusDef:
      type: object
      required: [key, label, colour, category, initial]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { type: string, minLength: 1, maxLength: 60 }
        colour: { $ref: '#/components/schemas/StatusColour' }
        category: { $ref: '#/components/schemas/StatusCategory' }
        initial:
          type: boolean
          description: Exactly one status is the initial one, and it is in the `OPEN` category.
    RoomWorkflowUpdate:
      type: object
      required: [statuses, fields]
      properties:
        statuses:
          type: array
          minItems: 2
          maxItems: 20
          description: The ACTIVE statuses in the new order.
          items:
            $ref: '#/components/schemas/RoomWorkflowStatusDef'
        fields:
          type: array
          maxItems: 20
          description: The ACTIVE fields in the new order.
          items:
            $ref: '#/components/schemas/RoomWorkflowField'
        replacements:
          type: object
          maxProperties: 20
          additionalProperties: { type: string }
          description: >-
            `{retiredKey: replacementKey}`: where the threads of each status this change retires move. The target must be a
            status of the new document in the same category. Omit it when no status that threads use is retired.
    RoomWorkflowOption:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { type: string, minLength: 1, maxLength: 60 }
    RoomWorkflowField:
      type: object
      required: [key, label, type, required, options]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        label: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: '#/components/schemas/FieldType' }
        required: { type: boolean }
        options:
          type: array
          maxItems: 50
          description: 1-50 options for `SELECT` and `MULTI_SELECT`; empty for every other type.
          items:
            $ref: '#/components/schemas/RoomWorkflowOption'
    RoomWorkflow:
      type: object
      required: [revision, statuses, fields]
      properties:
        revision: { type: integer, format: int64, minimum: 1, description: The token a workflow PUT names in `X-Expected-Revision` }
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/RoomWorkflowStatus'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/RoomWorkflowField'

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: >-
            A URI reference identifying the problem type; `about:blank` unless a conflict is typed
            (`urn:adder:problem:…`, e.g. `revision-conflict`).
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
        keys:
          type: array
          items: { type: string }
          description: >-
            Extension member, present only on a workflow conflict that is about specific keys (the statuses or fields
            the conflict names).

    ThreadFieldValues:
      type: object
      description: |
        Field values by field key. Per type: TEXT a single-line string of at most 500 characters (blank means unset); NUMBER a finite
        JSON number whose magnitude is at most 1e15; DATE a real calendar day as a `YYYY-MM-DD` string; SELECT one option key;
        MULTI_SELECT 1 to 50 distinct option keys (an empty array means unset); USER the id of an active member of the room;
        URL an absolute `http` or `https` URL of at most 2,000 characters. `null` means unset. A value of the wrong JSON type is a `400`.
      additionalProperties:
        anyOf:
          - { type: string, nullable: true }
          - { type: number }
          - type: array
            items: { type: string }
    ThreadCreateRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: A single line; trimmed. }
        body:
          type: string
          minLength: 1
          maxLength: 8000
          description: The opening message, Markdown (stored raw, rendered without HTML). Line endings are normalised; leading blank lines and trailing whitespace are dropped, the first line's indentation stays.
        fields:
          $ref: '#/components/schemas/ThreadFieldValues'
    ThreadUpdateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: A single line; trimmed. }
        fields:
          description: |
            MERGED over the stored values, not a full replace (a documented exception to API-RES-004): a retired field's value is hidden
            on read and cannot be sent back, so replacing would erase it. An omitted key keeps its value; send `null` to clear it.
          allOf:
            - $ref: '#/components/schemas/ThreadFieldValues'
    ThreadStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1, maxLength: 40, description: The KEY of an active status of the room's workflow. }
    ThreadOwnerRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: integer, format: int32, minimum: 1, description: The id of an active member of the room. }
    ThreadResponse:
      type: object
      required:
        - id
        - number
        - title
        - status
        - closed
        - closedAt
        - ownerId
        - ownerName
        - createdById
        - createdByName
        - fields
        - fieldUserNames
        - messageCount
        - revision
        - lastActivityAt
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        number: { type: integer, format: int32, minimum: 1, description: The per-room number (`#42`); never reused. }
        title: { type: string }
        status: { type: string, description: The status KEY; its label and colour are in the room's workflow. }
        closed: { type: boolean, description: The status is in a CLOSED category; the thread takes no further activity until it is reopened. }
        closedAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the instant the thread closed (kept across CLOSED to CLOSED moves); `null` while open. }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        createdById: { type: integer, format: int32, minimum: 1 }
        createdByName: { type: string }
        fields:
          $ref: '#/components/schemas/ThreadFieldValues'
        fieldUserNames:
          type: object
          readOnly: true
          description: Display names of the users held by USER fields, by user id.
          additionalProperties: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0, description: 'Every message: the opener and deleted ones included; it never goes down.' }
        revision: { type: integer, format: int64, minimum: 1, description: The token the details PUT names in `X-Expected-Revision`. Starts at 1. }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    ThreadListItem:
      type: object
      required: [id, number, title, status, closed, ownerId, ownerName, messageCount, lastActivityAt, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        number: { type: integer, format: int32, minimum: 1 }
        title: { type: string }
        status: { type: string, description: The status KEY. }
        closed: { type: boolean }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0 }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        createdAt: { type: integer, format: int64, description: Epoch millis }
    ThreadPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    ThreadEventType:
      type: string
      description: |
        The kind of a history entry (persisted, never renamed). The `params` of each: `CREATED` `{title, status, statusLabel}`;
        `TITLE_CHANGED` `{from, to}`; `STATUS_CHANGED`, `CLOSED`, `REOPENED` and `STATUS_REPLACED` `{from, to, fromLabel, toLabel}`
        (status keys and the labels at that moment); `OWNER_CHANGED` `{fromId, toId, fromName, toName}`; `FIELD_CHANGED`
        `{field, fieldLabel, from?, to?}` (display text; an absent side means unset).
      enum: [CREATED, TITLE_CHANGED, STATUS_CHANGED, CLOSED, REOPENED, OWNER_CHANGED, FIELD_CHANGED, STATUS_REPLACED]
    ThreadEvent:
      type: object
      required: [id, userId, userName, userDeleted, type, params, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        userId: { type: integer, format: int32, minimum: 1, description: The acting user. }
        userName: { type: string }
        userDeleted: { type: boolean, description: The acting account has since been deleted. }
        type: { $ref: '#/components/schemas/ThreadEventType' }
        params:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: integer, format: int64, description: Epoch millis }
    ThreadEventPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadEvent'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    TelemetryCurrent:
      type: object
      required: [generatedAt, sampleIntervalSeconds, processes, storage, requests]
      properties:
        generatedAt: { type: integer, format: int64, description: Epoch millis }
        sampleIntervalSeconds: { type: integer, format: int32, description: The cadence of the raw samples; also the `requests` window. }
        processes:
          type: array
          items: { $ref: '#/components/schemas/TelemetryProcess' }
        storage:
          allOf: [{ $ref: '#/components/schemas/TelemetryStorage' }]
          nullable: true
          description: The newest storage measurement; null until the cluster section has taken one.
        requests: { $ref: '#/components/schemas/TelemetryRequests' }
    TelemetryProcess:
      type: object
      description: One sampling process (a JVM run) with its latest raw sample.
      required: [id, role, instance, startedAt, lastSeenAt, sampledAt, stale, version, commit, memory, jvm]
      properties:
        id: { type: integer, format: int32 }
        role: { type: string, description: 'The process role; `app`.' }
        instance: { type: string, description: The pod or host name. }
        startedAt: { type: integer, format: int64, description: Epoch millis of the JVM start }
        lastSeenAt: { type: integer, format: int64, description: Epoch millis of the latest sample tick }
        sampledAt: { type: integer, format: int64, nullable: true, description: The bucket of the sample the figures come from; null when none is retained. }
        stale: { type: boolean, description: No sample for more than three sample intervals. }
        version: { type: string, nullable: true, description: The image build version (null outside the image). }
        commit: { type: string, nullable: true, description: The image build commit (null outside the image). }
        memory: { $ref: '#/components/schemas/TelemetryMemory' }
        jvm: { $ref: '#/components/schemas/TelemetryJvm' }
    TelemetryMemory:
      type: object
      description: Bytes; a figure the process could not measure is null.
      required:
        - heapUsedBytes
        - heapCommittedBytes
        - heapMaxBytes
        - oldGenPeakBytes
        - nonHeapBytes
        - directBytes
        - rssBytes
        - cgroupCurrentBytes
        - cgroupAnonBytes
        - workingSetBytes
        - cgroupPeakBytes
        - containerLimitBytes
        - percentOfLimit
      properties:
        heapUsedBytes: { type: integer, format: int64, nullable: true }
        heapCommittedBytes: { type: integer, format: int64, nullable: true }
        heapMaxBytes: { type: integer, format: int64 }
        oldGenPeakBytes: { type: integer, format: int64, nullable: true, description: The old generation's peak over the latest sample interval. }
        nonHeapBytes: { type: integer, format: int64, nullable: true }
        directBytes: { type: integer, format: int64, nullable: true }
        rssBytes: { type: integer, format: int64, nullable: true }
        cgroupCurrentBytes: { type: integer, format: int64, nullable: true }
        cgroupAnonBytes: { type: integer, format: int64, nullable: true }
        workingSetBytes: { type: integer, format: int64, nullable: true, description: '`memory.current - inactive_file`: what the kubelet evicts on.' }
        cgroupPeakBytes: { type: integer, format: int64, nullable: true, description: The cgroup's LIFETIME peak. }
        containerLimitBytes: { type: integer, format: int64, nullable: true }
        percentOfLimit:
          type: number
          format: double
          nullable: true
          description: '`workingSetBytes` over `containerLimitBytes`, in percent (one decimal; may exceed 100); null without a limit or a working set.'
    TelemetryJvm:
      type: object
      required: [cpuRatio, threads, gcCount, gcTimeMs, poolAcquired, poolIdle, poolPending, poolAllocated]
      properties:
        cpuRatio: { type: number, format: double, nullable: true, description: Process CPU time over wall time as a fraction of the available processors (0..1). }
        threads: { type: integer, format: int32, nullable: true }
        gcCount: { type: integer, format: int64, nullable: true, description: 'Collections over the latest sample interval, all collectors summed.' }
        gcTimeMs: { type: integer, format: int64, nullable: true, description: 'Collection time over the latest sample interval, all collectors summed.' }
        poolAcquired: { type: integer, format: int32, nullable: true }
        poolIdle: { type: integer, format: int32, nullable: true }
        poolPending: { type: integer, format: int32, nullable: true }
        poolAllocated: { type: integer, format: int32, nullable: true }
    TelemetryStorage:
      type: object
      required: [measuredAt, databaseBytes, schemas]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        databaseBytes: { type: integer, format: int64, description: '`pg_database_size`.' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/TelemetrySchemaSize' }
    TelemetrySchemaSize:
      type: object
      required: [name, bytes]
      properties:
        name: { type: string, description: 'public or ops (telemetry''s own cost).' }
        bytes: { type: integer, format: int64, description: "Heap, TOAST and indexes of the schema's tables." }
    TelemetryRequests:
      type: object
      required: [windowSeconds, percentileWindowSeconds, measuredAt, total, routes]
      properties:
        windowSeconds: { type: integer, format: int32, description: The window of the counts - the latest sample interval. }
        percentileWindowSeconds:
          type: integer
          format: int32
          description: The window p50 and p95 cover - the sample interval capped at 300 s (the request timers' reservoir), so it can be shorter than `windowSeconds`.
        measuredAt: { type: integer, format: int64, nullable: true, description: The sample bucket the figures describe; null when no live process has a sample. }
        total: { $ref: '#/components/schemas/TelemetryRouteStats' }
        routes:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/TelemetryRouteStats' }
    TelemetryRouteStats:
      type: object
      description: One route (or `*`, every `/api/` route except the telemetry's own and the probes) over the latest sample interval.
      required: [route, count, p50Ms, p95Ms, serverErrors, rateLimited]
      properties:
        route: { type: string, description: 'The normalised route (`/api/v1/users/{id}`) or `*`.' }
        count: { type: integer, format: int64, minimum: 0 }
        p50Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        p95Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        serverErrors: { type: integer, format: int64, minimum: 0, description: 5xx responses. }
        rateLimited: { type: integer, format: int64, minimum: 0, description: 429 responses. }
    TelemetryHistory:
      type: object
      required: [group, range, bucketSeconds, from, to, historyFrom, truncated, series]
      properties:
        group: { type: string, enum: [memory, storage, requests, jvm] }
        range: { type: string, enum: [24h, 7d, 90d] }
        bucketSeconds: { type: integer, format: int32, description: The width of a point's bucket. }
        from: { type: integer, format: int64, description: Epoch millis of the range start (the first bucket may begin up to one bucket earlier). }
        to: { type: integer, format: int64, description: Epoch millis of the read }
        historyFrom: { type: integer, format: int64, description: The oldest instant the range can actually hold data for. }
        truncated: { type: boolean, description: 'More series matched than were returned (40).' }
        series:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/TelemetrySeries' }
    TelemetrySeries:
      type: object
      description: One chart line; `points` are the buckets that hold data, ascending, at most 400.
      required: [key, metric, label, role, unit, kind, points]
      properties:
        key: { type: string, description: 'Unique within the response (`<role>:<metric>:<label>`, empty parts left out).' }
        metric: { type: string, description: 'The metric name (`mem.heap_used`, `http.p95`, ...).' }
        label: { type: string, description: 'A route, a GC collector or a schema; empty when the metric has none.' }
        role: { type: string, nullable: true, description: 'The process role a `memory` / `jvm` series merges (`app`); null for cluster-wide and `requests` series.' }
        unit: { type: string, enum: [BYTES, MILLISECONDS, COUNT, RATIO] }
        kind:
          type: string
          enum: [GAUGE, DELTA, PERCENTILE]
          description: A DELTA point's `avg` is the bucket's total; for the others it is the n-weighted mean.
        points:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/TelemetryPoint' }
    TelemetryPoint:
      type: object
      required: [t, avg, max]
      properties:
        t: { type: integer, format: int64, description: Epoch millis of the bucket start }
        avg: { type: number, format: double }
        max: { type: number, format: double }

