    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: |
            A URI reference identifying the problem type: `about:blank`, or one of the typed problems below, which a client tells apart
            from the plain status by the URI, never by the detail text. This list is the whole set (it equals the server's registry,
            `ProblemTypes`, pinned by `ProblemTypesTest`); the status in brackets is the one it answers.

            - `urn:adder:problem:revision-conflict` (409): a stale `X-Expected-Revision`.
            - `urn:adder:problem:last-owner` (409): the write would leave a room without an active owner.
            - `urn:adder:problem:room-archived` (409): an archived room is read-only.
            - `urn:adder:problem:thread-closed` (409): a closed thread takes no activity until it is reopened.
            - `urn:adder:problem:status-in-use` (409): a workflow change would retire or re-categorise a status threads use; carries `keys`.
            - `urn:adder:problem:field-type-immutable` (409): a field's type is fixed per key; carries `keys`.
            - `urn:adder:problem:pin-limit` (409): the room already holds its 50 pins.
            - `urn:adder:problem:reaction-limit` (409): the message or the caller is at the reaction limit.
            - `urn:adder:problem:room-busy` (429, `Retry-After`): the room's write lock stayed busy; retry.
            - `urn:adder:problem:read-timeout` (429, `Retry-After`): a filtered thread list or a tag list outran its deadline.
            - `urn:adder:problem:read-busy` (429, `Retry-After`): the caller or the server is at its maximum of list reads.
            - `urn:adder:problem:search-timeout` (429, `Retry-After`): a search outran its deadline.
            - `urn:adder:problem:search-busy` (429, `Retry-After`): the server is at its maximum of concurrent searches.
            - `urn:adder:problem:live-socket-limit` (429, `Retry-After`): the caller already holds their maximum of live sockets.
            - `urn:adder:problem:live-unavailable` (503, `Retry-After`): the live channel is stopping, full or without its listener.
            - `urn:adder:problem:template-gone` (400): the workflow template a room is created from is unknown or deleted.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
        keys:
          type: array
          items: { type: string }
          description: >-
            Extension member, present only on a conflict that is about specific keys: a workflow conflict (the statuses or fields
            it names) or a team's unique-name clash (`["name"]` or `["handle"]`, the field that is already taken).

    ThreadFieldValues:
      type: object
      description: |
        Field values by field key. Per type: TEXT a single-line string of at most 500 characters (blank means unset); NUMBER a finite
        JSON number whose magnitude is at most 1e15; DATE a real calendar day as a `YYYY-MM-DD` string; SELECT one option key;
        MULTI_SELECT 1 to 50 distinct option keys (an empty array means unset); USER the id of an active member of the room;
        URL an absolute `http` or `https` URL of at most 2,000 characters with no user name or password and no control or hidden direction
        character. `null` means unset. A value of the wrong JSON type is a `400`; so is a nested object, or a request with more than 20 keys (a request carries at most 20 keys, even when one is an unchanged retired key).
      maxProperties: 20
      additionalProperties:
        anyOf:
          - { type: string, nullable: true }
          - { type: number }
          - type: array
            maxItems: 50
            items: { type: string }
    ThreadCreateRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: A single line; trimmed. }
        body:
          type: string
          minLength: 1
          maxLength: 8000
          description: The opening message, Markdown (stored raw, rendered without HTML). Line endings are normalised; leading blank lines and trailing whitespace are dropped, the first line's indentation stays.
        fields:
          $ref: '#/components/schemas/ThreadFieldValues'
    ThreadUpdateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: A single line; trimmed. }
        fields:
          description: |
            MERGED over the stored values, not a full replace (a documented exception to API-RES-004): a retired field's value is hidden
            on read and cannot be sent back, so replacing would erase it. An omitted key keeps its value; send `null` to clear it.
          allOf:
            - $ref: '#/components/schemas/ThreadFieldValues'
    ThreadStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1, maxLength: 40, description: The KEY of an active status of the room's workflow. }
    ThreadOwnerRequest:
      type: object
      required: [ownerId]
      properties:
        ownerId: { type: integer, format: int32, minimum: 1, description: The id of an active member of the room. }
    ThreadResponse:
      type: object
      required:
        - id
        - number
        - title
        - status
        - closed
        - closedAt
        - ownerId
        - ownerName
        - createdById
        - createdByName
        - fields
        - fieldUserNames
        - messageCount
        - revision
        - lastActivityAt
        - createdAt
        - updatedAt
        - unreadCount
        - firstUnreadMessageId
        - watching
        - watcherCount
        - hashtags
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        number: { type: integer, format: int32, minimum: 1, description: The per-room number (`#42`); never reused. }
        title: { type: string }
        status: { type: string, description: The status KEY; its label and colour are in the room's workflow. }
        closed: { type: boolean, description: The status is in a CLOSED category; the thread takes no further activity until it is reopened. }
        closedAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the instant the thread closed (kept across CLOSED to CLOSED moves); `null` while open. }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        createdById: { type: integer, format: int32, minimum: 1 }
        createdByName: { type: string }
        fields:
          $ref: '#/components/schemas/ThreadFieldValues'
        fieldUserNames:
          type: object
          readOnly: true
          description: Display names of the users held by USER fields, by user id.
          additionalProperties: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0, description: 'Every message: the opener and deleted ones included; it never goes down.' }
        revision: { type: integer, format: int64, minimum: 1, description: The token the details PUT names in `X-Expected-Revision`. Starts at 1. }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        unreadCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 'Messages the CALLER has not read (it counts the newest 100 after their marker, so 100 is "100 or more"); 0 for someone who is not a member.'
        firstUnreadMessageId:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: The first of those messages; `null` when none is unread or the caller is not a member.
        watching: { type: boolean, description: The CALLER watches the thread (`PUT .../watch`); `false` for someone who is not a member. }
        watcherCount: { type: integer, format: int32, minimum: 0, description: 'How many active members watch the thread; who they are is not on the wire.' }
        hashtags:
          $ref: '#/components/schemas/ThreadHashtags'
    ThreadHashtags:
      type: array
      maxItems: 20
      description: |
        The thread's HASHTAGS (the `#word`s of its live messages, 0.5.0): the distinct stored (case- and accent-folded)
        keys, alphabetical, at most 20. Each is a valid `tag` filter value of the thread list. A deleted message's hashtags are gone; an edit adds or drops them.
      items: { type: string, minLength: 1, maxLength: 150 }
    ThreadListItem:
      type: object
      required: [id, number, title, status, closed, ownerId, ownerName, messageCount, lastActivityAt, createdAt, unreadCount, watching, hashtags]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        number: { type: integer, format: int32, minimum: 1 }
        title: { type: string }
        status: { type: string, description: The status KEY. }
        closed: { type: boolean }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0 }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        unreadCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 'Messages the CALLER has not read (the newest 100 after their marker are counted, so 100 is "100 or more"); 0 for someone who is not a member.'
        watching: { type: boolean, description: The CALLER watches the thread (`PUT .../watch`); `false` for someone who is not a member. }
        hashtags:
          $ref: '#/components/schemas/ThreadHashtags'
    ThreadPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    RoomTag:
      type: object
      required: [tag, threadCount]
      properties:
        tag:
          type: string
          minLength: 1
          maxLength: 150
          description: The FOLDED tag without its `#` (lower case, accents stripped); what the thread list's `tag` filter takes.
        threadCount:
          type: integer
          format: int64
          minimum: 1
          description: Distinct threads, open and closed, that have a live message carrying the tag.
    RoomTagPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomTag'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    SnippetSegment:
      type: object
      required: [text, hit]
      description: One run of a snippet. `text` is PLAIN text from the Markdown source (render it as text, never as HTML or Markdown).
      properties:
        text: { type: string }
        hit: { type: boolean, description: True for the words that matched the query. }
    MessageSearchHit:
      type: object
      required: [id, authorId, authorName, createdAt, snippet]
      properties:
        id: { type: integer, format: int32, minimum: 1, description: 'The message id (the key of `GET /rooms/{id}/messages/{messageId}`).' }
        authorId: { type: integer, format: int32, minimum: 1 }
        authorName: { type: string }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        snippet:
          type: array
          description: A fragment of the message, at most two pieces of 6 to 18 words joined by an ellipsis, its hits marked.
          items:
            $ref: '#/components/schemas/SnippetSegment'
    ThreadSearchHit:
      type: object
      required: [roomId, roomName, roomArchived, threadNumber, title, titleSnippet, status, closed, ownerId, ownerName, messageCount, lastActivityAt, matchCount, messages]
      properties:
        roomId: { type: integer, format: int32, minimum: 1 }
        roomName: { type: string }
        roomArchived: { type: boolean, description: An archived room is searched and labelled. }
        threadNumber: { type: integer, format: int32, minimum: 1 }
        title: { type: string }
        titleSnippet:
          type: array
          description: The whole title, its hits marked (one plain segment when only a message matched, and also when a watched-threads search names no `q`, since then nothing is a hit).
          items:
            $ref: '#/components/schemas/SnippetSegment'
        status: { type: string, description: The status KEY. }
        closed: { type: boolean }
        ownerId: { type: integer, format: int32, minimum: 1 }
        ownerName: { type: string }
        messageCount: { type: integer, format: int32, minimum: 0 }
        lastActivityAt: { type: integer, format: int64, description: Epoch millis }
        matchCount: { type: integer, format: int64, minimum: 0, description: 'How many live messages of the thread match (0 for a title-only hit, and always 0 for a watched-threads search without `q`).' }
        messages:
          type: array
          maxItems: 3
          description: The three newest matching live messages, newest first (empty for a title-only hit and for a watched-threads search without `q`).
          items:
            $ref: '#/components/schemas/MessageSearchHit'
    ThreadSearchPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ThreadSearchHit'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 20 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Matching threads.
    ThreadEventType:
      type: string
      description: |
        The kind of a history entry (persisted, never renamed). The `params` of each: `CREATED` `{status, statusLabel}`;
        `TITLE_CHANGED` `{}`; `STATUS_CHANGED`, `CLOSED`, `REOPENED` and `STATUS_REPLACED` `{from, to, fromLabel, toLabel}`
        (status keys and the labels at that moment); `OWNER_CHANGED` `{fromId, toId, fromName, toName}`; `FIELD_CHANGED`
        `{field, fieldLabel, from?, to?}`. The history is append-only, so it keeps no free text: no title is recorded (the thread shows
        the current one), and `from`/`to` (display text; an absent side means unset) exist only for a SELECT, MULTI_SELECT, USER,
        DATE or NUMBER field, never for a TEXT or URL one (the entry says THAT the field changed). A RETIRED field's entries answer
        without `from`/`to` too, and show them again if the field is revived. Entries written before 1.0.0 were scrubbed to this shape.
      enum: [CREATED, TITLE_CHANGED, STATUS_CHANGED, CLOSED, REOPENED, OWNER_CHANGED, FIELD_CHANGED, STATUS_REPLACED]
    ThreadEvent:
      type: object
      required: [id, actorId, actorName, actorDeleted, type, params, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        actorId: { type: integer, format: int32, minimum: 1, description: The acting user. }
        actorName: { type: string }
        actorDeleted: { type: boolean, description: The acting account has since been deleted. }
        type: { $ref: '#/components/schemas/ThreadEventType' }
        params:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: integer, format: int64, description: Epoch millis }
    ThreadEventPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadEvent'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    MessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 8000
          description: Markdown (stored raw, rendered without HTML). Line endings are normalised; leading blank lines and trailing whitespace are dropped, the first line's indentation stays.
    MessageResponse:
      type: object
      required: [id, threadNumber, authorId, authorName, body, deleted, deletedByModerator, editedAt, createdAt, mentions, groupMentions, reactions]
      properties:
        id: { type: integer, format: int32, minimum: 1, description: Ascending in time; the keyset a list pages by. }
        threadNumber: { type: integer, format: int32, minimum: 1, description: The per-room number of the message's thread. }
        authorId: { type: integer, format: int32, minimum: 1 }
        authorName: { type: string }
        body: { type: string, nullable: true, description: 'Markdown; `null` on a tombstone (a deleted message in a list), whose `editedAt` is `null` too.' }
        deleted: { type: boolean }
        deletedByModerator: { type: boolean, description: 'A room owner or an ADMIN removed it (an author''s own delete is `false`); always `false` while not deleted.' }
        editedAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the last edit; `null` while the body is as posted and on a tombstone. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        mentions:
          type: array
          maxItems: 20
          description: The room members the body mentions with `<@id>` (an active member when the message was written or edited), by their CURRENT display name, ordered by user id; empty on a tombstone and on a message written before mentions were indexed. A token whose id is not listed here is plain text.
          items: { $ref: '#/components/schemas/MentionedUser' }
        groupMentions:
          type: array
          maxItems: 7
          description: 'The group mentions of the body that took effect: `<@team:id>` of a team that is active and has a handle (at most 5), `<@watchers>` and `<@everyone>` (once each), teams by id and then the keywords; empty on a tombstone and on a message written before group mentions were indexed. A team shows its CURRENT handle and name. A token that is not listed here is plain text.'
          items: { $ref: '#/components/schemas/GroupMention' }
        reactions:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ReactionSummary' }
          description: The emoji on the message, in the order each first appeared; empty when there are none and on a tombstone. At most 20 distinct.
    MentionedUser:
      type: object
      required: [userId, name]
      properties:
        userId: { type: integer, format: int32, minimum: 1, description: The id inside the `<@id>` token. }
        name: { type: string, description: The person's current display name (a soft-deleted account keeps its last one). }
    GroupMention:
      type: object
      required: [kind, teamId, teamHandle, teamName]
      description: One group mention of a message. A client shows `<@team:id>` as `@handle`, `<@watchers>` as `@watchers` and `<@everyone>` as `@everyone`, and only when the token is listed here.
      properties:
        kind: { type: string, enum: [TEAM, WATCHERS, EVERYONE], description: 'Which token: `<@team:id>`, `<@watchers>` or `<@everyone>`. A client treats a value it does not know as plain text.' }
        teamId: { type: integer, format: int32, minimum: 1, nullable: true, description: 'The id inside the `<@team:id>` token; `null` for the two keywords.' }
        teamHandle: { type: string, minLength: 2, maxLength: 30, nullable: true, description: 'The team''s CURRENT mention handle (what follows `@`); `null` for the two keywords.' }
        teamName: { type: string, nullable: true, description: 'The team''s CURRENT display name; `null` for the two keywords.' }
    ReactionSummary:
      type: object
      required: [emoji, count, reacted, names]
      description: One emoji on a message. The full list of reactors is not part of the contract.
      properties:
        emoji: { type: string, minLength: 1, maxLength: 32, description: 'The emoji as it was sent (one emoji, `setMessageReaction`).' }
        count: { type: integer, format: int32, minimum: 1, description: How many people chose it. }
        reacted: { type: boolean, description: Whether the READER is one of them. }
        names:
          type: array
          maxItems: 3
          items: { type: string }
          description: The display names of the first three reactors by time (a soft-deleted account keeps its recorded name).
    ReadMarkerRequest:
      type: object
      required: [messageId]
      properties:
        messageId: { type: integer, format: int32, minimum: 1, description: 'The message the caller has read up to, and including; one of the thread''s own messages, a deleted one included.' }
    WatchRequest:
      type: object
      required: [watching]
      properties:
        watching: { type: boolean, description: 'Whether the caller watches the thread after the call.' }
    ReactionRequest:
      type: object
      required: [emoji, reacted]
      properties:
        emoji: { type: string, minLength: 1, maxLength: 32, description: 'ONE emoji when adding, any other text is `400`; when removing, the stored value within the length bounds.' }
        reacted: { type: boolean, description: '`true` adds the caller''s reaction, `false` removes it.' }
    MessagePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: The rows matching the filters, `id[lt]` included - so `total` greater than the items loaded means older messages exist.
    PinRequest:
      type: object
      required: [pinned]
      properties:
        pinned: { type: boolean, description: 'Whether the thread or message is pinned after the call.' }
    RoomPin:
      type: object
      required: [id, kind, threadNumber, threadTitle, threadStatus, threadClosed, message, pinnedById, pinnedByName, pinnedAt]
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        kind: { type: string, enum: [THREAD, MESSAGE], description: What the pin points at. }
        threadNumber: { type: integer, format: int32, minimum: 1, description: 'The per-room number of the pinned thread, or of the pinned message''s thread.' }
        threadTitle: { type: string }
        threadStatus: { type: string, description: The thread's status KEY. }
        threadClosed: { type: boolean }
        message:
          allOf:
            - $ref: '#/components/schemas/MessageResponse'
          nullable: true
          description: The pinned message as it reads now; `null` for a thread pin.
        pinnedById: { type: integer, format: int32, minimum: 1 }
        pinnedByName: { type: string, description: Read now (a deleted account keeps its recorded name). }
        pinnedAt: { type: integer, format: int64, description: Epoch millis }
    RoomPinPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomPin'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    NotificationType:
      type: string
      description: |
        The kind of a notice, which is also its reason (persisted, never renamed): `MENTIONED` (named with `<@id>`), `TEAM_MENTIONED` (the
        caller's team was named), `WATCHERS_MENTIONED` (the caller watches the thread and its watchers were named), `EVERYONE_MENTIONED`,
        `THREAD_REPLIED` (a reply in a thread the caller watches), `THREAD_CREATED` (a new thread in a room the caller is in),
        `THREAD_ASSIGNED` (someone else made the caller the owner of a thread), `THREAD_OWNER_CHANGED` (a watched thread changed owner),
        `THREAD_STATUS_CHANGED` (a watched thread moved within a status category), `THREAD_CLOSED` and `THREAD_REOPENED` (a watched thread
        was closed or reopened). One notice per person and event, the most specific reason. A client treats a value it does not know as plain text.
      enum:
        - MENTIONED
        - TEAM_MENTIONED
        - WATCHERS_MENTIONED
        - EVERYONE_MENTIONED
        - THREAD_REPLIED
        - THREAD_CREATED
        - THREAD_ASSIGNED
        - THREAD_OWNER_CHANGED
        - THREAD_STATUS_CHANGED
        - THREAD_CLOSED
        - THREAD_REOPENED
    Notification:
      type: object
      description: One notice of the caller. The row holds ids only; the names and the title are read when the list is read.
      required: [id, type, seen, createdAt, actorId, actorName, roomId, roomName, threadNumber, threadTitle, messageId]
      properties:
        id: { type: integer, format: int32, minimum: 1, description: Ascending in time. }
        type: { $ref: '#/components/schemas/NotificationType' }
        seen: { type: boolean }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        actorId: { type: integer, format: int32, minimum: 1, description: 'Who mentioned the caller, or handed the thread over.' }
        actorName: { type: string, description: The actor's CURRENT display name (a soft-deleted account keeps its last one). }
        roomId: { type: integer, format: int32, minimum: 1 }
        roomName: { type: string, description: The room's current name. }
        threadNumber: { type: integer, format: int32, minimum: 1, description: The per-room number of the thread. }
        threadTitle: { type: string, description: The thread's current title. }
        messageId: { type: integer, format: int32, minimum: 1, nullable: true, description: 'The message that notified the caller; `null` for a thread-level kind (`THREAD_ASSIGNED`, the owner and status kinds).' }
    NotificationPreferenceKind:
      type: object
      required: [type, inApp, email]
      properties:
        type: { $ref: '#/components/schemas/NotificationType' }
        inApp: { type: boolean, description: 'Whether a notice of this kind shows in the bell for the user (on by default).' }
        email: { type: boolean, description: 'Whether the digest email lists this kind for the user (off by default, for every kind).' }
    NotificationPreferences:
      type: object
      description: The user's in-app and email switches, one pair per kind of notice, in the order of `NotificationType`.
      required: [emailAvailable, kinds]
      properties:
        emailAvailable: { type: boolean, description: False when the deployment sends no email at all. }
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreferenceKind'
    NotificationChannel:
      type: string
      description: The way a notice reaches a person. Every kind has a switch for each; none is locked on.
      enum: [EMAIL, IN_APP]
    NotificationPreferencePair:
      type: object
      required: [type, channel]
      properties:
        type: { $ref: '#/components/schemas/NotificationType' }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
    NotificationPreferencesUpdate:
      type: object
      required: [disabled]
      properties:
        disabled:
          type: array
          maxItems: 22
          description: >-
            The pairs to switch OFF. A pair listed twice, or also in `enabled`, is a `400`, and so is a list (the two together) longer than the
            number of pairs there are (notification types x channels, 22 today: the bound the server enforces, `MAX_PREFERENCE_PAIRS`).
          items:
            $ref: '#/components/schemas/NotificationPreferencePair'
        enabled:
          type: array
          maxItems: 22
          description: >-
            The pairs to switch ON (optional: absent is empty). A pair in neither list takes its default (in the app on, by email off), so a
            client that sends only `disabled` cannot switch an email on.
          items:
            $ref: '#/components/schemas/NotificationPreferencePair'
    NotificationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000
          description: The caller's notices matching the filter, CAPPED at 1000 (the unseen total is the bell's badge).
    TelemetryCurrent:
      type: object
      required: [generatedAt, sampleIntervalSeconds, processes, storage, notifyQueue, requests]
      properties:
        generatedAt: { type: integer, format: int64, description: Epoch millis }
        sampleIntervalSeconds: { type: integer, format: int32, description: The cadence of the raw samples; also the `requests` window. }
        processes:
          type: array
          items: { $ref: '#/components/schemas/TelemetryProcess' }
        storage:
          allOf: [{ $ref: '#/components/schemas/TelemetryStorage' }]
          nullable: true
          description: The newest storage measurement; null until the cluster section has taken one.
        notifyQueue:
          allOf: [{ $ref: '#/components/schemas/TelemetryNotifyQueue' }]
          nullable: true
          description: The newest NOTIFY-queue reading, independent of `storage` (its own cadence); null until one was taken.
        requests: { $ref: '#/components/schemas/TelemetryRequests' }
    TelemetryProcess:
      type: object
      description: One sampling process (a JVM run) with its latest raw sample.
      required: [id, role, instance, startedAt, lastSeenAt, sampledAt, stale, version, commit, memory, jvm]
      properties:
        id: { type: integer, format: int32 }
        role: { type: string, description: 'The process role; `app`.' }
        instance: { type: string, description: The pod or host name. }
        startedAt: { type: integer, format: int64, description: Epoch millis of the JVM start }
        lastSeenAt: { type: integer, format: int64, description: Epoch millis of the latest sample tick }
        sampledAt: { type: integer, format: int64, nullable: true, description: The bucket of the sample the figures come from; null when none is retained. }
        stale: { type: boolean, description: No sample for more than three sample intervals. }
        version: { type: string, nullable: true, description: The image build version (null outside the image). }
        commit: { type: string, nullable: true, description: The image build commit (null outside the image). }
        memory: { $ref: '#/components/schemas/TelemetryMemory' }
        jvm: { $ref: '#/components/schemas/TelemetryJvm' }
    TelemetryMemory:
      type: object
      description: Bytes; a figure the process could not measure is null.
      required:
        - heapUsedBytes
        - heapCommittedBytes
        - heapMaxBytes
        - oldGenPeakBytes
        - nonHeapBytes
        - directBytes
        - rssBytes
        - cgroupCurrentBytes
        - cgroupAnonBytes
        - workingSetBytes
        - cgroupPeakBytes
        - containerLimitBytes
        - percentOfLimit
      properties:
        heapUsedBytes: { type: integer, format: int64, nullable: true }
        heapCommittedBytes: { type: integer, format: int64, nullable: true }
        heapMaxBytes: { type: integer, format: int64 }
        oldGenPeakBytes: { type: integer, format: int64, nullable: true, description: The old generation's peak over the latest sample interval. }
        nonHeapBytes: { type: integer, format: int64, nullable: true }
        directBytes: { type: integer, format: int64, nullable: true }
        rssBytes: { type: integer, format: int64, nullable: true }
        cgroupCurrentBytes: { type: integer, format: int64, nullable: true }
        cgroupAnonBytes: { type: integer, format: int64, nullable: true }
        workingSetBytes: { type: integer, format: int64, nullable: true, description: '`memory.current - inactive_file`: what the kubelet evicts on.' }
        cgroupPeakBytes: { type: integer, format: int64, nullable: true, description: The cgroup's LIFETIME peak. }
        containerLimitBytes: { type: integer, format: int64, nullable: true }
        percentOfLimit:
          type: number
          format: double
          nullable: true
          description: '`workingSetBytes` over `containerLimitBytes`, in percent (one decimal; may exceed 100); null without a limit or a working set.'
    TelemetryJvm:
      type: object
      required: [cpuRatio, threads, gcCount, gcTimeMs, poolAcquired, poolIdle, poolPending, poolAllocated, liveSockets, liveListenerUp]
      properties:
        cpuRatio: { type: number, format: double, nullable: true, description: Process CPU time over wall time as a fraction of the available processors (0..1). }
        threads: { type: integer, format: int32, nullable: true }
        gcCount: { type: integer, format: int64, nullable: true, description: 'Collections over the latest sample interval, all collectors summed.' }
        gcTimeMs: { type: integer, format: int64, nullable: true, description: 'Collection time over the latest sample interval, all collectors summed.' }
        poolAcquired: { type: integer, format: int32, nullable: true }
        poolIdle: { type: integer, format: int32, nullable: true }
        poolPending: { type: integer, format: int32, nullable: true }
        poolAllocated: { type: integer, format: int32, nullable: true }
        liveSockets: { type: integer, format: int32, nullable: true, description: Authenticated live-channel sockets of the process at its latest sample. }
        liveListenerUp: { type: boolean, nullable: true, description: 'Whether the process''s live LISTEN session was up at its latest sample; null before the listener started (it starts on the first ticket mint) or without a sample.' }
    TelemetryStorage:
      type: object
      required: [measuredAt, databaseBytes, schemas]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        databaseBytes: { type: integer, format: int64, description: '`pg_database_size`.' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/TelemetrySchemaSize' }
    TelemetryNotifyQueue:
      type: object
      description: 'How full the cluster''s NOTIFY queue was (`pg_notification_queue_usage()`), measured every sample interval.'
      required: [measuredAt, usage]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        usage: { type: number, format: double, description: 'The fraction of the queue in use, 0..1.' }
    TelemetrySchemaSize:
      type: object
      required: [name, bytes]
      properties:
        name: { type: string, description: 'public or ops (telemetry''s own cost).' }
        bytes: { type: integer, format: int64, description: "Heap, TOAST and indexes of the schema's tables." }
    TelemetryRequests:
      type: object
      required: [windowSeconds, percentileWindowSeconds, measuredAt, total, routes]
      properties:
        windowSeconds: { type: integer, format: int32, description: The window of the counts - the latest sample interval. }
        percentileWindowSeconds:
          type: integer
          format: int32
          description: The window p50 and p95 cover - the sample interval capped at 300 s (the request timers' reservoir), so it can be shorter than `windowSeconds`.
        measuredAt: { type: integer, format: int64, nullable: true, description: The sample bucket the figures describe; null when no live process has a sample. }
        total: { $ref: '#/components/schemas/TelemetryRouteStats' }
        routes:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/TelemetryRouteStats' }
    TelemetryRouteStats:
      type: object
      description: One route (or `*`, every `/api/` route except the telemetry's own and the probes) over the latest sample interval.
      required: [route, count, p50Ms, p95Ms, serverErrors, rateLimited]
      properties:
        route: { type: string, description: 'The normalised route (`/api/v1/users/{id}`) or `*`.' }
        count: { type: integer, format: int64, minimum: 0 }
        p50Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        p95Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        serverErrors: { type: integer, format: int64, minimum: 0, description: 5xx responses. }
        rateLimited: { type: integer, format: int64, minimum: 0, description: 429 responses. }
    TelemetryHistory:
      type: object
      required: [group, range, bucketSeconds, from, to, historyFrom, truncated, series]
      properties:
        group: { type: string, enum: [memory, storage, requests, jvm] }
        range: { type: string, enum: [24h, 7d, 90d] }
        bucketSeconds: { type: integer, format: int32, description: The width of a point's bucket. }
        from: { type: integer, format: int64, description: Epoch millis of the range start (the first bucket may begin up to one bucket earlier). }
        to: { type: integer, format: int64, description: Epoch millis of the read }
        historyFrom: { type: integer, format: int64, description: The oldest instant the range can actually hold data for. }
        truncated: { type: boolean, description: 'More series matched than were returned (40).' }
        series:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/TelemetrySeries' }
    TelemetrySeries:
      type: object
      description: One chart line; `points` are the buckets that hold data, ascending, at most 400.
      required: [key, metric, label, role, unit, kind, points]
      properties:
        key: { type: string, description: 'Unique within the response (`<role>:<metric>:<label>`, empty parts left out).' }
        metric: { type: string, description: 'The metric name (`mem.heap_used`, `http.p95`, ...).' }
        label: { type: string, description: 'A route, a GC collector or a schema; empty when the metric has none.' }
        role: { type: string, nullable: true, description: 'The process role a `memory` / `jvm` series merges (`app`); null for cluster-wide and `requests` series.' }
        unit: { type: string, enum: [BYTES, MILLISECONDS, COUNT, RATIO] }
        kind:
          type: string
          enum: [GAUGE, DELTA, PERCENTILE]
          description: A DELTA point's `avg` is the bucket's total; for the others it is the n-weighted mean.
        points:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/TelemetryPoint' }
    TelemetryPoint:
      type: object
      required: [t, avg, max]
      properties:
        t: { type: integer, format: int64, description: Epoch millis of the bucket start }
        avg: { type: number, format: double }
        max: { type: number, format: double }

